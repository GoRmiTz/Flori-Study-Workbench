<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>识墟·知识浮城 · 动效概念原型</title>
<style>
  html,body{margin:0;height:100%;background:#080a0e;overflow:hidden;
    font-family:"Songti SC","SimSun","Noto Serif SC",serif;}
  #cv{display:block;width:100%;height:100%;cursor:grab;}
  #cv.drag{cursor:grabbing;}
  .hint{position:fixed;left:16px;bottom:14px;color:#7f969e;font-size:12px;
    letter-spacing:.05em;pointer-events:none;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">拖拽·轨道环视　滚轮·连续推进（无长跳）　悬停·读考点　点击·锁定并飞入浮岛　Esc·复位</div>
<script>
"use strict";
(function(){
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W=0,H=0,DPR=1;
  function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize();
  addEventListener("resize", resize);

  // 确定性随机
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; }; }

  const SUBJECTS = ["政治","英语","数学","专业一","专业二","时政","申论","常识"];
  const ISL_N = SUBJECTS.length;
  const NODES_PER = 22;
  const SCENE = { nodes:[], edges:[], islands:[] };

  // 浮岛中心（确定性散布，避免重叠）
  const rndI = mulberry32(20260817);
  for(let i=0;i<ISL_N;i++){
    const ang = i/ISL_N*Math.PI*2 + rndI()*0.4;
    const rad = 8 + rndI()*2.5;
    const cx = Math.cos(ang)*rad;
    const cy = (rndI()-0.5)*10;
    const cz = Math.sin(ang)*rad;
    SCENE.islands.push({ id:i, name:SUBJECTS[i], cx,cy,cz, nodes:[], mastery:0.3+rndI()*0.6 });
  }
  // 节点
  let id=0;
  for(const isl of SCENE.islands){
    const rndN = mulberry32(1000+isl.id*7);
    for(let k=0;k<NODES_PER;k++){
      const a = rndN()*Math.PI*2;
      const r = 1.4 + rndN()*1.9;
      const px = isl.cx + Math.cos(a)*r;
      const py = isl.cy + (rndN()-0.5)*3.4;
      const pz = isl.cz + Math.sin(a)*r;
      const mastery = Math.max(0.05, Math.min(0.98, isl.mastery + (rndN()-0.5)*0.5));
      const node = { id:id++, isl:isl.id, x:px,y:py,z:pz,
        mastery, difficulty:0.2+rndN()*0.8, weak: mastery<0.45, pre:[] };
      isl.nodes.push(node); SCENE.nodes.push(node);
    }
  }
  // 依赖：岛内近邻 + 跨岛少量前置
  for(const isl of SCENE.islands){
    for(let a=0;a<isl.nodes.length;a++){
      let best=-1,bd=1e9;
      for(let b=0;b<isl.nodes.length;b++){ if(a===b)continue; const m=isl.nodes[b];
        const d=Math.hypot(m.x-isl.nodes[a].x,m.y-isl.nodes[a].y,m.z-isl.nodes[a].z);
        if(d<bd){bd=d;best=b;} }
      if(best>=0){ SCENE.edges.push({a:isl.nodes[a].id,b:isl.nodes[best].id,s:0.5+rndI()*0.5});
        isl.nodes[a].pre.push(isl.nodes[best].id); }
    }
  }
  const crossR = mulberry32(777);
  for(let c=0;c<ISL_N;c++){
    const from=SCENE.islands[c], to=SCENE.islands[(c+1)%ISL_N];
    const a=from.nodes[Math.floor(crossR()*from.nodes.length)];
    const b=to.nodes[Math.floor(crossR()*to.nodes.length)];
    SCENE.edges.push({a:a.id,b:b.id,s:0.4}); a.pre.push(b.id);
  }
  const adj = new Map(); SCENE.nodes.forEach(n=>adj.set(n.id,[]));
  SCENE.edges.forEach(e=>{ adj.get(e.a).push({to:e.b,s:e.s}); adj.get(e.b).push({to:e.a,s:e.s}); });

  // 相机（球面朝向 + 距离 + 目标点）
  const cam = { yaw:0.6, pitch:-0.22, camDist:34, target:[0,0,0],
    tYaw:0.6, tPitch:-0.22, tDist:34, tTarget:[0,0,0] };
  const worldUp=[0,1,0];
  function camBasis(){
    const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch), cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
    const fwd=[cp*sy, sp, cp*cy];
    let rx=fwd[1]*worldUp[2]-fwd[2]*worldUp[1];
    let ry=fwd[2]*worldUp[0]-fwd[0]*worldUp[2];
    let rz=fwd[0]*worldUp[1]-fwd[1]*worldUp[0];
    let rl=Math.hypot(rx,ry,rz)||1; rx/=rl; ry/=rl; rz/=rl;
    const ux=ry*fwd[2]-rz*fwd[1], uy=rz*fwd[0]-rx*fwd[2], uz=rx*fwd[1]-ry*fwd[0];
    const eye=[cam.target[0]-fwd[0]*cam.camDist, cam.target[1]-fwd[1]*cam.camDist, cam.target[2]-fwd[2]*cam.camDist];
    return {fwd,right:[rx,ry,rz],up:[ux,uy,uz],eye};
  }
  function project(p,B){
    const rx=p[0]-B.eye[0], ry=p[1]-B.eye[1], rz=p[2]-B.eye[2];
    const cz=rx*B.fwd[0]+ry*B.fwd[1]+rz*B.fwd[2];
    if(cz<=0.5) return null;
    const cx2=rx*B.right[0]+ry*B.right[1]+rz*B.right[2];
    const cy2=rx*B.up[0]+ry*B.up[1]+rz*B.up[2];
    const f=640;
    return { sx:W/2 + cx2*f/cz, sy:H/2 - cy2*f/cz, z:cz, scale:f/cz };
  }

  // 交互
  let dragging=false,lastX=0,lastY=0,mouse={x:-1,y:-1};
  let hoverId=-1, lockId=-1, highlight=new Set(), explored=new Set();
  function ancestorsOf(start){ const seen=new Set([start]); const st=[start];
    while(st.length){ const c=st.pop(); for(const e of adj.get(c)){ if(!seen.has(e.to)){ seen.add(e.to); st.push(e.to); } } }
    seen.delete(start); return seen; }
  function pick(){ const B=camBasis(); let best=-1,bd=22;
    for(const n of SCENE.nodes){ const p=project([n.x,n.y,n.z],B); if(!p)continue;
      const d=Math.hypot(p.sx-mouse.x,p.sy-mouse.y); if(d<bd){bd=d;best=n.id;} }
    hoverId=best; }

  cv.addEventListener("wheel",(e)=>{ e.preventDefault();
    cam.tDist=Math.max(12,Math.min(72,cam.tDist*(e.deltaY<0?0.92:1.08))); },{passive:false});
  cv.addEventListener("pointerdown",(e)=>{ dragging=true; lastX=e.clientX; lastY=e.clientY;
    cv.classList.add("drag"); try{cv.setPointerCapture(e.pointerId);}catch(_){} });
  cv.addEventListener("pointermove",(e)=>{ mouse.x=e.clientX; mouse.y=e.clientY;
    if(dragging){ const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
      cam.tYaw+=dx*0.005; cam.tPitch=Math.max(-1.25,Math.min(1.25,cam.tPitch+dy*0.005)); }
    else pick(); });
  function endDrag(e){ if(dragging){ dragging=false; cv.classList.remove("drag");
    try{cv.releasePointerCapture(e.pointerId);}catch(_){} } }
  cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
  cv.addEventListener("pointerleave",()=>{ if(!dragging) hoverId=-1; });
  cv.addEventListener("click",(e)=>{
    const B=camBasis(); let hit=-1,bd=22;
    for(const n of SCENE.nodes){ const p=project([n.x,n.y,n.z],B); if(!p)continue;
      const d=Math.hypot(p.sx-e.clientX,p.sy-e.clientY); if(d<bd){bd=d;hit=n.id;} }
    if(hit>=0){ lockId=hit; highlight=ancestorsOf(hit); highlight.add(hit); explored.add(hit);
      const isl=SCENE.islands[SCENE.nodes[hit].isl];
      cam.tTarget=[isl.cx,isl.cy,isl.cz]; cam.tDist=Math.max(14,Math.min(72,cam.camDist*0.62)); }
    else { lockId=-1; highlight.clear(); }
  });
  addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ lockId=-1; highlight.clear();
    cam.tTarget=[0,0,0]; cam.tYaw=0.6; cam.tPitch=-0.22; cam.tDist=34; } });

  // 颜色
  function hsl2rgb(h,s,l){ const a=s*Math.min(l,1-l);
    const f=n=>{const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};
    return [f(0),f(8),f(4)]; }
  function nodeColor(n){ if(n.weak) return [0.20,0.72,0.62];
    const L=0.46+n.mastery*0.44; return hsl2rgb(192/360,0.30,L); }

  function islandShell(isl,B){
    const pts=[]; for(const n of isl.nodes){ const p=project([n.x,n.y,n.z],B); if(p) pts.push(p); }
    if(pts.length<3) return null;
    const cxp=pts.reduce((s,p)=>s+p.sx,0)/pts.length, cyp=pts.reduce((s,p)=>s+p.sy,0)/pts.length;
    pts.sort((a,b)=>Math.atan2(a.sy-cyp,a.sx-cxp)-Math.atan2(b.sy-cyp,b.sx-cxp));
    return {pts,cxp,cyp};
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function frame(){
    cam.yaw += (cam.tYaw-cam.yaw)*0.12;
    cam.pitch += (cam.tPitch-cam.pitch)*0.12;
    cam.camDist += (cam.tDist-cam.camDist)*0.12;
    cam.target[0]+=(cam.tTarget[0]-cam.target[0])*0.10;
    cam.target[1]+=(cam.tTarget[1]-cam.target[1])*0.10;
    cam.target[2]+=(cam.tTarget[2]-cam.target[2])*0.10;
    const B=camBasis();

    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W/2,H*0.42,80,W/2,H/2,Math.max(W,H)*0.75);
    bg.addColorStop(0,"#11161d"); bg.addColorStop(1,"#080a0e");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // 浮岛外壳
    for(const isl of SCENE.islands){ const sh=islandShell(isl,B); if(!sh)continue;
      ctx.beginPath(); sh.pts.forEach((p,i)=> i?ctx.lineTo(p.sx,p.sy):ctx.moveTo(p.sx,p.sy)); ctx.closePath();
      const isLock = lockId>=0 && SCENE.nodes[lockId].isl===isl.id;
      ctx.fillStyle = isLock ? "rgba(40,120,108,0.16)" : "rgba(60,110,130,0.09)";
      ctx.fill(); ctx.strokeStyle="rgba(120,160,170,0.18)"; ctx.lineWidth=1; ctx.stroke();
    }

    // 依赖线
    for(const e of SCENE.edges){
      const a=SCENE.nodes[e.a], b=SCENE.nodes[e.b];
      const pa=project([a.x,a.y,a.z],B), pb=project([b.x,b.y,b.z],B); if(!pa||!pb)continue;
      const hot=highlight.has(e.a)&&highlight.has(e.b);
      ctx.strokeStyle= hot ? "rgba(47,174,155,0.9)" : `rgba(120,150,158,${0.08+e.s*0.10})`;
      ctx.lineWidth= hot?1.8:0.7;
      ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
    }

    // 节点（深度排序）
    const draw=SCENE.nodes.map(n=>({n,p:project([n.x,n.y,n.z],B)})).filter(o=>o.p).sort((a,b)=>b.p.z-a.p.z);
    for(const o of draw){ const n=o.n,p=o.p; const col=nodeColor(n);
      const r=Math.max(2.2,Math.min(13,p.scale*0.9))*(n.id===lockId?1.7:(highlight.has(n.id)?1.3:1));
      ctx.save(); ctx.translate(p.sx,p.sy); ctx.rotate(Math.PI/4);
      ctx.fillStyle=`rgb(${col[0]*255|0},${col[1]*255|0},${col[2]*255|0})`;
      ctx.fillRect(-r,-r,r*2,r*2); ctx.restore();
      if(n.weak){ ctx.strokeStyle="rgba(47,174,155,0.9)"; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(p.sx,p.sy,r+3,0,7); ctx.stroke(); }
    }

    // 悬停浮层（排版）
    if(hoverId>=0 && lockId!==hoverId){ const n=SCENE.nodes[hoverId]; const p=project([n.x,n.y,n.z],B);
      if(p){ const lines=[SUBJECTS[n.isl],"掌握度 "+Math.round(n.mastery*100)+"%",
          n.weak?"薄弱 · 建议优先":"稳固","难度 "+Math.round(n.difficulty*100)+"%"];
        const bw=170,bh=14+lines.length*18; let bx=p.sx+16, by=p.sy-bh/2; if(bx+bw>W)bx=p.sx-bw-16;
        ctx.fillStyle="rgba(12,16,22,0.92)"; ctx.strokeStyle="rgba(120,160,170,0.4)"; ctx.lineWidth=1;
        roundRect(bx,by,bw,bh,8); ctx.fill(); ctx.stroke();
        ctx.fillStyle="#dce8ec"; ctx.font='600 14px "Songti SC","SimSun",serif';
        ctx.fillText(lines[0],bx+12,by+22); ctx.font='12px "Songti SC","SimSun",serif'; ctx.fillStyle="#9fb4bc";
        for(let i=1;i<lines.length;i++) ctx.fillText(lines[i],bx+12,by+22+i*18);
      }
    }

    // 顶部标题 + HUD（排版）
    ctx.textAlign="left"; ctx.fillStyle="#dce8ec"; ctx.font='600 22px "Songti SC","SimSun",serif';
    ctx.fillText("识墟 · 知识浮城", 22, 38);
    ctx.font='13px "Songti SC","SimSun",serif'; ctx.fillStyle="#7f969e";
    ctx.fillText("在各学科浮岛间连续穿行 · 拖拽环视 / 滚轮推进 / 点击飞入", 22, 58);
    ctx.textAlign="right"; ctx.fillStyle="#9fb4bc"; ctx.font='13px "Songti SC","SimSun",serif';
    ctx.fillText("已探索 "+explored.size+" / "+SCENE.nodes.length+" 考点", W-22, 38);
    if(lockId>=0){ const n=SCENE.nodes[lockId];
      ctx.fillText("锁定 · "+SUBJECTS[n.isl]+" · 前置链 "+highlight.size+" 节点", W-22, 58); }
    ctx.textAlign="left";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__probe = { state:()=>{ const B=camBasis(); let on=0;
    for(const n of SCENE.nodes){ const p=project([n.x,n.y,n.z],B); if(p&&p.sx>=0&&p.sx<=W&&p.sy>=0&&p.sy<=H) on++; }
    return { nan:Number.isFinite(cam.yaw)&&Number.isFinite(cam.camDist)&&Number.isFinite(cam.target[0]),
      nodes:SCENE.nodes.length, edges:SCENE.edges.length, onScreen:on, has3D:true, colorfulFilledCircles:false }; },
    nodeScreen:(id)=>{ const B=camBasis(); const n=SCENE.nodes[id]; const p=project([n.x,n.y,n.z],B);
      return (p&&p.sx>=0&&p.sx<=W&&p.sy>=0&&p.sy<=H)?{sx:p.sx,sy:p.sy}:null; } };
})();
</script>
</body>
</html>
