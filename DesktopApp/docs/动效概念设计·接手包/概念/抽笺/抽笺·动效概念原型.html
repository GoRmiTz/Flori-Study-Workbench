<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>抽笺·知识笺匣</title>
<style>
  html,body{margin:0;height:100%;background:#F6F2E9;overflow:hidden;
    font-family:"Songti SC","STSong","SimSun",ui-serif,serif;}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
  #cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;
    background:transparent;cursor:pointer;}
  #bgfail{position:fixed;inset:0;z-index:0;background:
    radial-gradient(120% 120% at 50% 30%, #FBF8F2 0%, #F6F2E9 55%, #EFE9DC 100%);}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="bgfail"></div>
<canvas id="cv"></canvas>
<script>
'use strict';
(function(){
const PAPER='#F6F2E9', INK='#23211c', INK_SOFT='rgba(35,33,28,0.62)',
      INK_FAINT='rgba(35,33,28,0.34)', JADE='#2f6f5e', CYAN='#3a7d8c',
      SLIP_PAPER='#FBF8F2';
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');

/* ---------- WebGL2 受控背景（暖纸 + 淡墨晕 + 笺纹），失败即隐藏 ---------- */
let gl=null, bgProg=null, bgU={}, bgOk=false;
(function initBG(){
  const bg=document.getElementById('bg');
  try{
    const g=bg.getContext('webgl2'); if(!g) throw new Error('no webgl2');
    const vs='#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
    const fs='#version 300 es\nprecision highp float;\nout vec4 o;uniform vec2 u_res;uniform float u_t;\n'+
      'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n'+
      'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}\n'+
      'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*vn(p);p*=2.02;a*=.5;}return v;}\n'+
      'void main(){vec2 uv=gl_FragCoord.xy/u_res;vec3 paper=vec3(0.965,0.949,0.914);\n'+
      'float n=fbm(uv*2.4+vec2(u_t*0.015,u_t*0.010));float m=fbm(uv*5.3-vec2(u_t*0.008,0.));\n'+
      'float ink=smoothstep(0.5,0.92,n)*0.10+smoothstep(0.55,0.95,m)*0.05;\n'+
      'vec3 col=paper-ink*vec3(0.13,0.11,0.09);\n'+
      'float ln=abs(fract(uv.y*38.0)-0.5);col-=(1.0-smoothstep(0.0,0.04,ln))*0.006;\n'+
      'o=vec4(col,1.0);}';
    function sh(type,src){const s=g.createShader(type);g.shaderSource(s,src);g.compileShader(s);
      if(!g.getShaderParameter(s,g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s));return s;}
    const p=g.createProgram();
    g.attachShader(p,sh(g.VERTEX_SHADER,vs));g.attachShader(p,sh(g.FRAGMENT_SHADER,fs));
    g.linkProgram(p); if(!g.getProgramParameter(p,g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(p));
    const buf=g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,buf);
    g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
    const loc=g.getAttribLocation(p,'a'); g.enableVertexAttribArray(loc);
    g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);
    bgProg=p; bgU.res=g.getUniformLocation(p,'u_res'); bgU.t=g.getUniformLocation(p,'u_t');
    gl=g; bgOk=true;
  }catch(e){ bgOk=false; const b=document.getElementById('bg'); if(b) b.style.display='none'; }
})();

/* ---------- 数据：来自 F-D 练考模块题目的知识笺（示例内容） ---------- */
const SUBJECTS=['行测·言语','行测·判断','行测·数量','申论·写作','专业·数媒','专业·艺术'];
const SLIPS=[
  {id:0,sub:'行测·判断',title:'逻辑矛盾型削弱',
   body:'削弱题优先找“直接否定结论”或“切断论据→结论”的桥。先定结论再找靶心，勿被无关选项带偏。',
   quote:'真题：某政策降低了犯罪率→结论“政策有效”。最能削弱？'},
  {id:1,sub:'行测·言语',title:'主旨概括三标志',
   body:'转折后、因果果、对策句是主旨高频落点。首尾句+高频词锁定主题词，选项须含主题词。',
   quote:'真题：“然而……”之后往往是作者真正想说的。'},
  {id:2,sub:'行测·数量',title:'工程问题赋值法',
   body:'给总量赋公倍数（如 60），算效率再求时间。比列分式方程更稳更快。',
   quote:'真题：甲 10 天、乙 15 天完成，合作几天？'},
  {id:3,sub:'申论·写作',title:'总分总段落结构',
   body:'段首亮观点（一句话），中段 2–3 个论据（数据/案例/名言），段尾回扣观点。',
   quote:'范句：……由此可见，XXX 是关键之举。'},
  {id:4,sub:'专业·数媒',title:'帧率与流畅度',
   body:'24fps 电影感、30fps 基础流畅、60fps 顺滑。游戏/交互界面优先 60fps 以上。',
   quote:'考点：为何交互界面要 ≥60fps？'},
  {id:5,sub:'专业·艺术',title:'黄金分割与构图',
   body:'主体落于 0.618 分割线附近更和谐；三分法是其简化版，适用于版式与镜头。',
   quote:'真题：版式主视觉最佳落点？'},
  {id:6,sub:'行测·判断',title:'类比推理二级辨析',
   body:'一级看语义/逻辑，二级看词性、感情色彩、程度。两词皆可时，取“关系更近”的一项。',
   quote:'真题：医生∶病人 ≈ ？'},
  {id:7,sub:'申论·写作',title:'对策可行性四问',
   body:'主体是谁、资源从哪来、可执行否、可评估否。空喊口号的对策一律低分。',
   quote:'范句：由 XX 牵头，设立 XX 机制，定期考核。'},
  {id:8,sub:'专业·数媒',title:'RGB 与 CMYK',
   body:'RGB 加色（屏显）、CMYK 减色（印刷）。跨媒介交付须做色彩空间转换。',
   quote:'考点：印刷物料用什么色彩模式？'},
  {id:9,sub:'行测·数量',title:'容斥原理两集合',
   body:'|A∪B|=|A|+|B|−|A∩B|。画韦恩图比死记公式更不易错。',
   quote:'真题：会 A 的 20 人、会 B 的 15 人、都会 5 人，至少会一种？'},
  {id:10,sub:'行测·言语',title:'逻辑填空语境法',
   body:'不看选项先猜空义，再回选项匹配；递进/并列决定词性方向，感情色彩定褒贬。',
   quote:'真题：他的演讲_____（鼓舞/鼓动）了全场。'},
  {id:11,sub:'专业·艺术',title:'蒙太奇与叙事',
   body:'蒙太奇通过镜头组接创造新含义（1+1>2）。对比/平行/积累是常考类型。',
   quote:'考点：两组镜头并列属于哪种蒙太奇？'},
  {id:12,sub:'申论·写作',title:'材料要点归纳',
   body:'先分层（问题/原因/影响/对策），再同义合并；用材料原词而非自造词。',
   quote:'范句：综上，问题集中在……三方面。'},
  {id:13,sub:'行测·判断',title:'加强型论证',
   body:'加强三路：补前提、举例子、排除他因。优先选“建立论据与结论联系”的项。',
   quote:'真题：哪项最能支持研究结论？'}
];
const N=SLIPS.length;

/* ---------- 状态 ---------- */
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
const cvs=document.getElementById('bg');
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(bgOk){cvs.width=W*DPR;cvs.height=H*DPR;gl.viewport(0,0,cvs.width,cvs.height);}
}
resize();

let collected=[],pending=[],todayCount=0;
let phase='idle';            // idle | rise | read | archive | discard
let cur=null,t0=0,riseFromY=0,targetY=0;
let archToX=0,archToY=0,archType=null;
let alpha=1, reveal=0, slipX=0, slipY=0, slipScale=1, drawCX=0, drawCY=0;
let cursor={x:W/2,y:H/2};
const SLIP_W=300, SLIP_H=420;

function boxRect(){const w=240,h=86,bx=W/2,bY=H-70;return {x:bx-w/2,y:bY-h/2,w:w,h:h,cx:bx,cy:bY};}
function shelf(){return {x:W-72,y0:150,y1:H-180};}
function stampRects(){const r=boxRect();return null;}
function slipRect(){return {w:SLIP_W,h:SLIP_H,cx:drawCX,cy:drawCY};}

function chooseSlip(){
  const done=new Set(collected.concat(pending));
  let pool=SLIPS.filter(s=>!done.has(s.id));
  if(pool.length===0) pool=SLIPS.filter(s=>pending.includes(s.id)); // 自适应重抽待巩固
  if(pool.length===0) pool=SLIPS.slice();
  return pool[Math.floor(Math.random()*pool.length)];
}
function startDraw(){
  if(phase!=='idle') return;
  cur=chooseSlip(); phase='rise'; t0=performance.now();
  riseFromY=boxRect().cy; targetY=H/2-30; slipX=W/2; slipY=riseFromY;
  alpha=1; reveal=0; slipScale=1;
}
function markCurrent(type){
  if(phase!=='read'||!cur) return;
  archType=type;
  const sh=shelf();
  archToX=sh.x; archToY=sh.y0+ (collected.length+pending.length)*14;
  if(type==='known') collected.push(cur.id); else pending.push(cur.id);
  todayCount++;
  phase='archive'; t0=performance.now();
}
function keyEsc(){ if(phase==='read'){phase='discard';t0=performance.now();} }

/* ease */
function ease(t){return t<0?0:t>1?1:t*t*(3-2*t);}
function lerp(a,b,t){return a+(b-a)*t;}

/* hit testing for real clicks */
function hitStamp(p){
  if(phase!=='read') return null;
  const r=slipRect(); const cy=r.cy, w=r.w,h=r.h;
  const known={x:r.cx-72,y:cy+h/2-40,w:128,h:42};
  const rev  ={x:r.cx+72,y:cy+h/2-40,w:128,h:42};
  function inR(b){return p.x>=b.x-b.w/2&&p.x<=b.x+b.w/2&&p.y>=b.y-b.h/2&&p.y<=b.y+b.h/2;}
  if(inR(known))return 'known'; if(inR(rev))return 'review'; return null;
}
function onDown(e){const p=evPos(e);cursor=p;const st=hitStamp(p);if(st){markCurrent(st);return;}
  if(phase==='idle'){const b=boxRect();if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)startDraw();}}
function onMove(e){cursor=evPos(e);}
function onUp(e){}
function onWheel(e){} // 固定取景，无缩放
function onKey(e){if(e.key==='Escape')keyEsc();}
function evPos(e){const t=e.touches?e.touches[0]:e;return {x:t.clientX,y:t.clientY};}

/* ---------- 渲染 ---------- */
let last=performance.now(), nan=false, onScreen=0;
function drawBG(t){
  if(!bgOk)return;
  gl.useProgram(bgProg);
  gl.uniform2f(bgU.res,cvs.width,cvs.height);
  gl.uniform1f(bgU.t,t*0.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function wrapText(text,x,y,maxW,lh){
  const chars=text.split('');let line='',yy=y;
  for(let i=0;i<chars.length;i++){
    const test=line+chars[i];
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=chars[i];yy+=lh;}
    else line=test;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy+lh;
}

function drawTopBar(){
  ctx.fillStyle='rgba(35,33,28,0.92)';ctx.fillRect(0,0,W,46);
  ctx.fillStyle=PAPER;ctx.font='600 16px "Songti SC",serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('芙洛理',18,23);
  const tabs=['知识库','练考','复盘','抽笺'];const active=3;
  ctx.font='15px "Songti SC",serif';let x=92;
  tabs.forEach((t,i)=>{const w=ctx.measureText(t).width+26;
    if(i===active){ctx.fillStyle=JADE;roundRect(x-6,12,w,22,6);ctx.fill();ctx.fillStyle=PAPER;}
    else{ctx.fillStyle='rgba(246,242,233,0.72)';}
    ctx.textAlign='left';ctx.fillText(t,x+7,24);x+=w+6;});
  // avatar (ink outline, not colorful fill)
  ctx.strokeStyle='rgba(246,242,233,0.8)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(W-30,23,13,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(246,242,233,0.85)';ctx.font='12px "Songti SC",serif';ctx.textAlign='center';
  ctx.fillText('律',W-30,24);
  onScreen++;
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle=INK;ctx.font='600 22px "Songti SC",serif';
  ctx.fillText('抽笺 · 知识笺匣',24,84);
  ctx.fillStyle=INK_SOFT;ctx.font='13px "Songti SC",serif';
  ctx.fillText('点笺匣抽一笺 · 阅毕标记 已会 / 待巩固 · 知识入册',24,108);
  ctx.textAlign='right';
  ctx.fillStyle=INK;ctx.font='600 15px "Songti SC",serif';
  ctx.fillText('已习 '+collected.length+' 笺 · 今日抽 '+todayCount+' 笺 · 待巩固 '+pending.length, W-24, 92);
  ctx.fillStyle=INK_FAINT;ctx.font='12px "Songti SC",serif';
  ctx.fillText('娱乐化随机复习 · 待巩固将加权重抽', W-24, 112);
  ctx.textAlign='left';
}

function drawBox(){
  const b=boxRect();
  // stack of slips behind
  ctx.save();
  for(let i=3;i>=1;i--){ctx.strokeStyle='rgba(35,33,28,'+(0.18+i*0.05)+')';
    ctx.lineWidth=1.2;roundRect(b.x-6+i*3,b.y-10-i*6,b.w,b.h,8);ctx.stroke();}
  // tray
  ctx.strokeStyle=INK;ctx.lineWidth=2;roundRect(b.x,b.y,b.w,b.h,10);ctx.stroke();
  ctx.strokeStyle=INK_SOFT;ctx.lineWidth=1;roundRect(b.x+8,b.y+8,b.w-16,b.h-16,6);ctx.stroke();
  // hint
  ctx.fillStyle=INK_SOFT;ctx.font='14px "Songti SC",serif';ctx.textAlign='center';
  ctx.fillText('笺匣',b.cx,b.cy-4);
  ctx.fillStyle=INK_FAINT;ctx.font='12px "Songti SC",serif';
  ctx.fillText(phase==='idle'?'点此抽一笺':'……',b.cx,b.cy+16);
  ctx.restore();
  onScreen++;
}

function drawShelf(){
  const sh=shelf();
  ctx.strokeStyle=INK_SOFT;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(sh.x,sh.y0-14);ctx.lineTo(sh.x,sh.y1+14);ctx.stroke();
  ctx.fillStyle=INK_SOFT;ctx.font='13px "Songti SC",serif';ctx.textAlign='center';
  ctx.fillText('已习',sh.x,sh.y0-22);ctx.fillText('笺册',sh.x,sh.y0-6);
  // ticks
  const total=collected.length+pending.length;
  for(let i=0;i<total;i++){
    const y=sh.y0+i*14; const isK=i<collected.length;
    ctx.strokeStyle=isK?JADE:CYAN;ctx.lineWidth=isK?2:1.2;
    ctx.beginPath();ctx.moveTo(sh.x,y);ctx.lineTo(sh.x+(isK?22:14),y);ctx.stroke();
  }
  onScreen++;
}

function drawSlip(){
  if(phase==='idle')return;
  const r=slipRect(); const w=r.w*slipScale,h=r.h*slipScale;
  const top=r.cy-h/2;
  // ink-bleed hint at reveal edge
  const visBottom=top+h*reveal;
  ctx.save();
  ctx.globalAlpha=alpha;
  // paper
  ctx.fillStyle=SLIP_PAPER;ctx.strokeStyle=INK;ctx.lineWidth=2;
  roundRect(r.cx-w/2,top,w,h,12);ctx.fill();ctx.stroke();
  // clip to revealed region
  ctx.save();
  ctx.beginPath();ctx.rect(r.cx-w/2,top,w,Math.max(0,visBottom-top));ctx.clip();
  // content
  const pad=24;let y=top+44;
  ctx.fillStyle=CYAN;ctx.font='13px "Songti SC",serif';ctx.textAlign='left';
  ctx.fillText(cur.sub, r.cx-w/2+pad, y); y+=18;
  ctx.fillStyle=INK;ctx.font='600 22px "Songti SC",serif';
  ctx.fillText(cur.title, r.cx-w/2+pad, y); y+=14;
  ctx.strokeStyle=INK_SOFT;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(r.cx-w/2+pad,y+4);ctx.lineTo(r.cx+w/2-pad,y+4);ctx.stroke(); y+=30;
  ctx.fillStyle=INK;ctx.font='15px "Songti SC",serif';
  y=wrapText(cur.body, r.cx-w/2+pad, y, w-2*pad, 26); y+=22;
  ctx.fillStyle=INK_FAINT;ctx.font='italic 13px "Songti SC",serif';
  y=wrapText(cur.quote, r.cx-w/2+pad, y, w-2*pad, 22);
  ctx.restore();
  // reveal edge ink dots
  if(reveal<1){
    ctx.fillStyle='rgba(35,33,28,0.5)';
    for(let i=0;i<5;i++){const dx=(i/4-0.5)*w*0.9;const dy=(Math.sin(i*1.7)*4);
      ctx.beginPath();ctx.arc(r.cx+dx,visBottom+dy,1.6,0,Math.PI*2);ctx.fill();}
  }
  // stamps (only when read)
  if(phase==='read'){
    const sy=r.cy+h/2-40;
    drawStamp(r.cx-72,sy,'已会 ✔',JADE);
    drawStamp(r.cx+72,sy,'待巩固 ↺',CYAN);
  }
  ctx.restore();
  onScreen++;
}
function drawStamp(x,y,label,color){
  const w=128,h=42;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.strokeStyle=color;ctx.lineWidth=1.6;roundRect(x-w/2,y-h/2,w,h,8);ctx.stroke();
  ctx.fillStyle=color;ctx.font='600 15px "Songti SC",serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x,y);
  ctx.restore();
}

/* update */
function update(now){
  const dt=Math.min(50,now-last);last=now;
  drawCX=slipX; drawCY=slipY;
  if(phase==='rise'){
    const t=ease((now-t0)/560); slipY=lerp(riseFromY,targetY,t); reveal=t;
    if((now-t0)>=560){phase='read';reveal=1;slipY=targetY;}
  }else if(phase==='archive'){
    const t=ease((now-t0)/560); slipX=lerp(W/2,archToX,t); slipY=lerp(targetY,archToY,t);
    slipScale=lerp(1,0.16,t); alpha=1-t;
    if((now-t0)>=560){phase='idle';alpha=1;slipScale=1;slipX=W/2;slipY=targetY;cur=null;}
  }else if(phase==='discard'){
    const t=ease((now-t0)/220); alpha=1-t;
    if((now-t0)>=220){phase='idle';alpha=1;cur=null;}
  }
}

function frame(now){
  onScreen=0; nan=false;
  if(bgOk) drawBG(now);
  ctx.clearRect(0,0,W,H);
  drawTopBar(); drawHUD(); drawShelf(); drawBox(); drawSlip();
  update(now);
  // NaN guard
  if(!isFinite(slipX)||!isFinite(slipY)||!isFinite(reveal)||!isFinite(alpha)||!isFinite(slipScale)) nan=true;
  if(!isFinite(collected.length)||!isFinite(pending.length)||!isFinite(todayCount)) nan=true;
  window.__nan=nan; window.__onScreen=onScreen;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Probe API（无头校验用） ---------- */
window.__api={
  onDown,onMove,onUp,onWheel,onKey,startDraw,
  mark:(t)=>markCurrent(t),
  getProbe:()=>({nan:window.__nan||false,onScreen:window.__onScreen||0,
    phase,collected:collected.length,pending:pending.length,today:todayCount,
    curId:cur?cur.id:null,lightBg:true,colorfulCircles:window.__colorful||0}),
  setSize:(w,h)=>{window.innerWidth=w;window.innerHeight=h;resize();}
};
window.__ready=true;
})();
</script>
</body>
</html>
