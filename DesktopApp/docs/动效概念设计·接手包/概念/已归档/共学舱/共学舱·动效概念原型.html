<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芙洛理 · 概念15 共学舱 · 动效概念原型</title>
<style>
  :root{
    --bg0:#fbfaf6; --bg1:#eef0ea; --ink:#1c2b29; --mut:#5e716e;
    --line:#d7ddd8; --accent:#0f9e86; --topbg:rgba(255,255,255,.94);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg0);color:var(--ink);
    font:13px/1.5 "Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
  #c{position:fixed;inset:0;display:block;cursor:default;}

  #top{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;
    gap:6px;padding:0 16px;background:linear-gradient(180deg,var(--topbg),rgba(255,255,255,.72));
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px);z-index:8;transition:background .3s,border-color .3s;}
  #top .brand{font-weight:600;letter-spacing:.4px;color:var(--accent);margin-right:14px;display:flex;align-items:center;gap:7px;}
  #top .brand .gem{width:13px;height:13px;border:1.5px solid var(--accent);transform:rotate(45deg);border-radius:2px;}
  #top .tab{padding:6px 12px;border-radius:7px;color:var(--mut);cursor:pointer;user-select:none;
    border:1px solid transparent;transition:.18s;}
  #top .tab:hover{color:var(--ink);background:rgba(15,158,134,.10);}
  #top .tab.on{color:#fff;background:var(--accent);font-weight:600;}
  #top .sp{flex:1;}
  #top .avatar{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#9ff0d8,#2f6f63);border:1px solid var(--line);}

  #kpi{position:fixed;top:54px;left:0;right:0;display:flex;gap:26px;padding:8px 18px;
    color:var(--mut);z-index:7;font-size:12px;pointer-events:none;transition:color .3s;}
  #kpi b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;transition:color .3s;}

  #chips{position:fixed;top:54px;right:14px;z-index:8;display:flex;flex-wrap:wrap;gap:6px;
    justify-content:flex-end;max-width:46vw;}
  #chips .lab{width:100%;text-align:right;color:var(--mut);font-size:11px;margin-bottom:1px;}
  #chips .chip{padding:3px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--mut);
    cursor:pointer;user-select:none;font-size:11.5px;transition:.14s;}
  #chips .chip:hover{color:var(--ink);}
  #chips .chip.on{color:#fff;background:var(--accent);border-color:transparent;}

  #panel{position:fixed;min-width:200px;padding:11px 13px;border-radius:11px;z-index:9;
    background:rgba(255,255,255,.96);border:1px solid var(--line);
    box-shadow:0 10px 34px rgba(40,60,55,.18);opacity:0;transform:translateY(6px);
    transition:opacity .14s,transform .14s;pointer-events:none;}
  #panel.show{opacity:1;transform:translateY(0);}
  #panel .t{font-weight:600;color:var(--ink);margin-bottom:7px;font-size:13px;display:flex;align-items:center;gap:7px;}
  #panel .t .sw{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(127,127,127,.3);}
  #panel .row{display:flex;justify-content:space-between;gap:18px;color:var(--mut);font-size:12px;margin:3px 0;}
  #panel .row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}

  #hint{position:fixed;left:16px;bottom:14px;color:var(--mut);font-size:12px;
    line-height:1.7;z-index:6;pointer-events:none;max-width:380px;transition:color .3s;}
  #hint kbd{background:rgba(15,158,134,.10);border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;color:var(--ink);font-size:11px;}

  #legend{position:fixed;right:14px;bottom:14px;color:var(--mut);font-size:11px;z-index:6;
    pointer-events:none;line-height:1.85;text-align:right;}
  #legend .ttl{font-weight:600;color:var(--ink);font-size:11.5px;margin-bottom:3px;}
  #legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px;vertical-align:middle;border:1px solid rgba(127,127,127,.3);}
  #legend .sz{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px;vertical-align:middle;background:var(--accent);border:1px solid rgba(127,127,127,.3);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="brand"><span class="gem"></span>芙洛理 · 共学舱</div>
  <div class="tab">知识库</div>
  <div class="tab">练考</div>
  <div class="tab">复盘</div>
  <div class="tab on">自习室</div>
  <div class="sp"></div>
  <div class="avatar"></div>
</div>
<div id="kpi">
  <span>在场 <b id="k_on">0</b></span>
  <span>平均今日专注 <b id="k_avg">0</b> 分</span>
  <span>今日总专注 <b id="k_tot">0</b> 分</span>
  <span>自习室占比 <b id="k_ratio">0%</b></span>
  <span id="k_hover">悬停 —</span>
</div>
<div id="chips">
  <div class="lab">状态筛选</div>
  <div class="chip on" data-f="all">全部</div>
  <div class="chip" data-f="focus">专注中</div>
  <div class="chip" data-f="rest">休息</div>
</div>
<div id="panel">
  <div class="t"><span class="sw" id="p_sw"></span><span id="p_name">—</span></div>
  <div class="row"><span>学科</span><b id="p_subj">—</b></div>
  <div class="row"><span>今日专注</span><b id="p_focus">—</b></div>
  <div class="row"><span>状态</span><b id="p_state">—</b></div>
  <div class="row"><span>连续到房</span><b id="p_streak">—</b></div>
  <div class="row"><span>在房时长</span><b id="p_dur">—</b></div>
</div>
<div id="legend">
  <div class="ttl">席位 · 信息编码</div>
  <div>光圈大小 = 今日专注时长<span class="sz"></span></div>
  <div>色相 = 学科 · 明暗 = 状态</div>
  <div>专注中<span class="dot" style="background:#0f9e86"></span>休息<span class="dot" style="background:#c9a13b"></span>离开<span class="dot" style="background:#b9c2bd"></span></div>
</div>
<div id="hint">
  <kbd>悬停</kbd> 看同学专注详情 · <kbd>单击</kbd> 聚焦共学（其余淡出）<br>
  席位稳定不跳位 · 实时在场/状态/聊天以涟漪与呼吸呈现 · 静置自动演示在场动态
</div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function resize(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
resize(); window.addEventListener('resize',resize);

// ---- 主题（仅亮色） ----
const THEME = {
  ring:'rgba(120,135,130,.22)', line:'rgba(127,140,135,.16)',
  coreFill:'rgba(47,111,99,.10)', coreLine:'#2f6f63', text:'#1c2b29', mut:'#5e716e',
  stateCol:{ focus:'#0f9e86', rest:'#c9a13b', away:'#b9c2bd' }
};

// ---- 学科色相（复用数据着色豁免） ----
const SUBJ = [
  {name:'政治理论',h:158},{name:'常识判断',h:188},{name:'言语理解',h:208},
  {name:'数量关系',h:230},{name:'判断推理',h:262},{name:'资料分析',h:286},
  {name:'申论写作',h:14},{name:'面试实战',h:38}
];

// ---- 确定性随机 ----
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const rnd = mulberry32(20260817);
const NAMES = ['阿岚','小满','砚秋','知行','怀瑾','见微','清和','执一','南风','素白','景行','听澜','守拙','云栖','方圻','归砚'];

// ---- 构建在场同学（确定性；模拟 RT-ROOM presence + focus.json） ----
const STATES = ['focus','focus','focus','rest','away']; // 偏向专注中
const peers = [];
const N = 13;
for(let i=0;i<N;i++){
  const subj = SUBJ[Math.floor(rnd()*SUBJ.length)];
  const focus = 12 + Math.floor(rnd()*168);            // 今日专注分钟 12~180
  const state = STATES[Math.floor(rnd()*STATES.length)];
  // 席位角度：均匀分位 + 极小抖动 → 稳定不跳位、永不错位重叠（围坐共学中庭）
  const slot = 2*Math.PI/N;
  const ang = i*slot + (rnd()-0.5)*0.12;
  peers.push({
    id:i, name:NAMES[i%NAMES.length], subj, focus, state,
    streak:1+Math.floor(rnd()*21), durMin:8+Math.floor(rnd()*150),
    ang, r:0,            // r = 入场弹簧缩放（0→1）
    pulse:0, breath:rnd()*Math.PI*2,
    x:0,y:0, baseR:0
  });
}

// ---- 交互状态 ----
let hovered=-1, selected=-1, filter='all', lastInteract=performance.now();
const ripples=[];   // 聊天/状态涟漪（确定性、阻尼）

function seatRadius(p){ return 9 + (p.focus/180)*20; }   // 光圈大小 = 今日专注
function stateAlpha(p){ return p.state==='away'?0.42 : p.state==='rest'?0.72 : 1; }

function frame(){
  const now=performance.now();
  // 入场弹簧（确定性收敛）
  for(const p of peers){ if(p.r<0.999) p.r += (1-p.r)*Math.min(1,0.10); if(p.r>0.999)p.r=1; if(p.pulse>0.001)p.pulse*=0.93; else p.pulse=0; p.breath+=0.02; }

  // 背景（纸感径向，非辉光）
  const g=ctx.createRadialGradient(W/2,H*0.46,40,W/2,H*0.46,Math.max(W,H)*0.72);
  g.addColorStop(0,'#fdfcf8'); g.addColorStop(0.7,'#eef0ea'); g.addColorStop(1,'#e6e9e3');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const cx=W/2, cy=H/2+6, R=Math.min(W,H)*0.30;

  // 舱核（中心：共享氛围 / 在场人数）
  ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2);
  ctx.fillStyle=THEME.coreFill; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle=THEME.coreLine; ctx.stroke();
  ctx.fillStyle=THEME.coreLine; ctx.font='600 11px system-ui'; ctx.textAlign='center';
  ctx.fillText('共学舱', cx, cy-4);
  const onCount = peers.filter(p=>p.state!=='away').length;
  ctx.fillStyle=THEME.mut; ctx.font='10px system-ui';
  ctx.fillText('在场 '+onCount, cx, cy+9);

  // 席位环（淡引导圈）
  ctx.beginPath(); ctx.arc(cx,cy,R+34,0,Math.PI*2);
  ctx.strokeStyle=THEME.ring; ctx.lineWidth=1; ctx.stroke();

  // 涟漪（聊天/状态，确定性阻尼）
  for(let i=ripples.length-1;i>=0;i--){ const rp=ripples[i];
    rp.rad += rp.spd; rp.life -= 0.012; if(rp.life<=0){ ripples.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.rad,0,Math.PI*2);
    ctx.strokeStyle='hsla('+rp.h+',45%,'+rp.l+'%,'+(rp.life*0.5).toFixed(3)+')'; ctx.lineWidth=1.2; ctx.stroke();
  }

  // 席位（在场同学）
  for(const p of peers){
    const x=cx+Math.cos(p.ang)*R, y=cy+Math.sin(p.ang)*R;
    p.x=x; p.y=y; p.baseR=seatRadius(p);
    const isH=(p.id===hovered)||(p.id===selected);
    const dim = (selected>=0 && p.id!==selected) || (filter!=='all' && p.state!==filter);
    const a = stateAlpha(p) * (dim?0.16:1);
    const breath = p.state==='focus' ? 1 : (p.state==='rest' ? 0.86+0.14*Math.sin(p.breath) : 1);
    const rr = p.baseR * p.r * breath + p.pulse*10;
    const col='hsl('+p.subj.h+',46%,'+(p.state==='away'?62:46)+'%)';
    ctx.save(); ctx.globalAlpha=a;
    // 主体席位（平涂，零辉光）
    ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
    // 状态描边
    ctx.lineWidth=isH?2:1.4; ctx.strokeStyle=THEME.stateCol[p.state]; ctx.stroke();
    // 昵称首字
    ctx.globalAlpha=a*0.9; ctx.fillStyle='#fff'; ctx.font='600 '+(rr*0.8).toFixed(0)+'px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.name[0], x, y);
    // 悬停/选中光环
    if(isH){ ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(x,y,rr+5,0,Math.PI*2); ctx.strokeStyle=THEME.stateCol[p.state]; ctx.lineWidth=1; ctx.stroke(); }
    ctx.restore();
  }

  // 连线：选中者 → 舱核（共学脉络）
  if(selected>=0){ const p=peers[selected];
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(cx,cy);
    ctx.strokeStyle='rgba(15,158,134,.35)'; ctx.lineWidth=1.2; ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);
  }

  // 自动演示：静置时模拟在场动态（进出/状态/聊天涟漪），交互即停
  if(now-lastInteract>3500){
    if(!frame._t) frame._t=now;
    if(now-frame._t>1800){
      frame._t=now;
      const r=Math.floor(rnd()*peers.length); const p=peers[r];
      const acts=['chat','state','join']; const act=acts[Math.floor(rnd()*acts.length)];
      if(act==='chat'){ const x=p.x,y=p.y; ripples.push({x,y,rad:p.baseR,spd:0.9,life:1,h:p.subj.h,l:48}); }
      else if(act==='state'){ const opts=['focus','rest','away']; p.state=opts[Math.floor(rnd()*3)]; p.pulse=1; }
      else { // 离开/回到在场
        p.state = p.state==='away' ? 'focus' : 'away'; p.pulse=1;
      }
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- 命中测试 ----
function hit(mx,my){ let best=-1,bd=1e9;
  for(const p of peers){ const d=Math.hypot(p.x-mx,p.y-my); const rr=p.baseR*p.r+6; if(d<rr&&d<bd){bd=d;best=p.id;} }
  return best; }

// ---- 鼠标 ----
cv.addEventListener('mousemove',e=>{ const x=e.clientX,y=e.clientY; const id=hit(x,y); hovered=id;
  if(id>=0){ showPanel(peers[id],x,y); } else hidePanel(); });
cv.addEventListener('click',e=>{ const x=e.clientX,y=e.clientY; const id=hit(x,y);
  selected = (id>=0 && id!==selected) ? id : -1; lastInteract=performance.now(); });
cv.addEventListener('mouseleave',()=>{ hovered=-1; hidePanel(); });

// ---- 面板 ----
const panel=document.getElementById('panel');
function showPanel(p,x,y){
  document.getElementById('p_sw').style.background=THEME.stateCol[p.state];
  document.getElementById('p_name').textContent=p.name;
  document.getElementById('p_subj').textContent=p.subj.name;
  document.getElementById('p_focus').textContent=p.focus+' 分';
  document.getElementById('p_state').textContent=p.state==='focus'?'专注中':p.state==='rest'?'休息':'离开';
  document.getElementById('p_streak').textContent=p.streak+' 天';
  document.getElementById('p_dur').textContent=p.durMin+' 分';
  const px = x>W-230 ? x-216 : x+16;
  panel.style.left=px+'px'; panel.style.top=Math.min(y+12,H-170)+'px';
  panel.classList.add('show');
  document.getElementById('k_hover').textContent='悬停 '+p.name+' · '+p.subj.name;
}
function hidePanel(){ panel.classList.remove('show'); document.getElementById('k_hover').textContent='悬停 —'; }

// ---- 状态筛选 ----
const chips=document.getElementById('chips');
chips.querySelectorAll('.chip').forEach(c=>{ c.onclick=()=>{ filter=c.dataset.f;
  chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); lastInteract=performance.now(); }; });

// ---- KPI ----
function updateKPI(){ let tot=0,on=0,focusTot=0;
  for(const p of peers){ tot+=p.focus; if(p.state!=='away'){ on++; focusTot+=p.focus; } }
  document.getElementById('k_on').textContent=on;
  document.getElementById('k_avg').textContent=on?Math.round(focusTot/on):0;
  document.getElementById('k_tot').textContent=tot;
  document.getElementById('k_ratio').textContent=Math.round((focusTot/Math.max(1,tot))*100)+'%';
}
setInterval(updateKPI,400); updateKPI();

// ---- 校验钩 ----
window.__probe=function(){ let nan=0;
  for(const p of peers){ if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(p.baseR)) nan++; }
  const on=peers.filter(p=>p.state!=='away').length;
  return { peers:N, on, nan, seatStable:true, ripples:ripples.length,
    filter, selected, anyNaN:nan===0, radiusBounded:peers.every(p=>p.baseR>=9&&p.baseR<=29) };
};
</script>
</body>
</html>
