<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>识悬·知识悬衡 · 动效概念原型</title>
<style>
  html,body{margin:0;height:100%;background:#080a0e;overflow:hidden;
    font-family:"Songti SC","SimSun","Noto Serif SC",serif;}
  #cv{display:block;width:100%;height:100%;cursor:grab;}
  #cv.drag{cursor:grabbing;}
  .hint{position:fixed;left:16px;bottom:14px;color:#7f969e;font-size:12px;
    letter-spacing:.05em;pointer-events:none;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">拖挂牌·重新分配学时（系统确定性重平衡）　悬停·读学科　点击·聚焦该臂　Esc·复位</div>
<script>
"use strict";
(function(){
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W=0,H=0,DPR=1;
  function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize();
  addEventListener("resize", resize);

  // 确定性随机
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; }; }

  const SUBJECTS = ["政治","英语","数学","专业一","专业二","时政","申论","常识"];
  const N = SUBJECTS.length;            // 8 学科
  const NB = 4;                          // 4 条主臂，每臂两端各挂 1 牌 = 8 牌

  // 每学科：掌握度 / 重要性 / 已分配学时(0..1)
  const rnd = mulberry32(20260818);
  const nodes = [];
  for(let i=0;i<N;i++){
    const mastery = Math.max(0.05, Math.min(0.97, 0.25 + rnd()*0.7));
    const imp = 0.7 + rnd()*0.6;
    nodes.push({ id:i, subject:SUBJECTS[i], mastery, imp,
      alloc: Math.max(0, Math.min(1, 0.35 + rnd()*0.4)),
      weak:false, bar: i>>1, side:(i&1)?1:-1,    // 每两学科共一主臂
      x:0,y:0,z:0, baseAlloc:0 });
    nodes[i].baseAlloc = nodes[i].alloc;
  }
  // 权重：掌握越低、分配越少 → 越重（悬得更低）
  function weight(n){ return n.imp * (1 - n.mastery) * (1 - 0.8*n.alloc); }
  function recalc(){ for(const n of nodes) n.weak = n.mastery < 0.45; }

  // 主臂结构
  const R = [0, 9.0, 0];     // 顶部悬挂点
  const O = [0, 6.4, 0];     // 中央枢纽（臂的发射点）
  const WIRE = R[1]-O[1];    // 悬丝长度
  const ARM = 3.4;           // 半臂长
  const DROP = 2.2;          // 挂牌下垂丝长
  const bars = [];
  for(let b=0;b<NB;b++){
    bars.push({ id:b, hangYaw: b/NB*Math.PI*2,
      tilt:0, sway: rnd()*Math.PI*2,
      lx:0,ly:0,lz:0, rx:0,ry:0,rz:0 }); // 两端世界坐标（每帧更新）
  }

  // 相机（复用识墟三段式 + 聚焦飞入）
  const cam = { yaw:0.5, pitch:-0.18, camDist:38, target:[0,5.2,0],
    tYaw:0.5, tPitch:-0.18, tDist:38, tTarget:[0,5.2,0] };
  const worldUp=[0,1,0];
  function camBasis(){
    const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch), cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
    const fwd=[cp*sy, sp, cp*cy];
    let rx=fwd[1]*worldUp[2]-fwd[2]*worldUp[1];
    let ry=fwd[2]*worldUp[0]-fwd[0]*worldUp[2];
    let rz=fwd[0]*worldUp[1]-fwd[1]*worldUp[0];
    let rl=Math.hypot(rx,ry,rz)||1; rx/=rl; ry/=rl; rz/=rl;
    const ux=ry*fwd[2]-rz*fwd[1], uy=rz*fwd[0]-rx*fwd[2], uz=rx*fwd[1]-ry*fwd[0];
    const eye=[cam.target[0]-fwd[0]*cam.camDist, cam.target[1]-fwd[1]*cam.camDist, cam.target[2]-fwd[2]*cam.camDist];
    return {fwd,right:[rx,ry,rz],up:[ux,uy,uz],eye};
  }
  function project(p,B){
    const rx=p[0]-B.eye[0], ry=p[1]-B.eye[1], rz=p[2]-B.eye[2];
    const cz=rx*B.fwd[0]+ry*B.fwd[1]+rz*B.fwd[2];
    if(cz<=0.5) return null;
    const cx2=rx*B.right[0]+ry*B.right[1]+rz*B.right[2];
    const cy2=rx*B.up[0]+ry*B.up[1]+rz*B.up[2];
    const f=640;
    return { sx:W/2 + cx2*f/cz, sy:H/2 - cy2*f/cz, z:cz, scale:f/cz };
  }

  // 运动学（每帧）
  let T=0;
  function updateKin(){
    recalc();
    // 全局确定性微摆（有界、稳定，非 idle 乱飞）
    const gYaw = 0.16*Math.sin(T*0.0006) + 0.09*Math.sin(T*0.0011+1.3);
    const gPitch = 0.05*Math.sin(T*0.0009+0.7);
    for(const bar of bars){
      const left = nodes[bar.id*2], right = nodes[bar.id*2+1];
      // 目标倾角由两端权重差驱动（确定性）
      const tTilt = Math.max(-0.5, Math.min(0.5, 0.55*(weight(left)-weight(right))));
      bar.tilt += (tTilt - bar.tilt)*0.08;                 // 弹簧缓动
      const yaw = bar.hangYaw + gYaw + 0.05*Math.sin(T*0.0013 + bar.sway);
      const d=[Math.cos(yaw),0,Math.sin(yaw)];
      const lift = ARM*Math.sin(bar.tilt)*0.92;
      // 两端 = O ± ARM*d，并按倾角上下错开
      bar.lx=O[0]+d[0]*ARM; bar.ly=O[1]+lift; bar.lz=O[2]+d[2]*ARM;
      bar.rx=O[0]-d[0]*ARM; bar.ry=O[1]-lift; bar.rz=O[2]-d[2]*ARM;
      // 挂牌下垂（含 gPitch 全局俯仰微摆）
      const dropL = DROP + 0.25*Math.sin(T*0.0017+bar.sway);
      const dropR = DROP + 0.25*Math.sin(T*0.0017+bar.sway+2.1);
      left.x = bar.lx;  left.y = bar.ly - dropL;  left.z = bar.lz;
      right.x= bar.rx;  right.y= bar.ry - dropR; right.z= bar.rz;
    }
  }

  // 交互
  let dragging=false, dragId=-1, lastY=0, mouse={x:-1,y:-1};
  let hoverId=-1, lockId=-1, focusBar=-1, adjusted=new Set();
  function pick(){ const B=camBasis(); let best=-1,bd=24;
    for(const n of nodes){ const p=project([n.x,n.y,n.z],B); if(!p)continue;
      const d=Math.hypot(p.sx-mouse.x,p.sy-mouse.y); if(d<bd){bd=d;best=n.id;} }
    hoverId=best; }

  cv.addEventListener("wheel",(e)=>{ e.preventDefault();
    cam.tDist=Math.max(16,Math.min(80,cam.tDist*(e.deltaY<0?0.92:1.08))); },{passive:false});
  cv.addEventListener("pointerdown",(e)=>{
    const B=camBasis(); let hit=-1,bd=24;
    for(const n of nodes){ const p=project([n.x,n.y,n.z],B); if(!p)continue;
      const d=Math.hypot(p.sx-e.clientX,p.sy-e.clientY); if(d<bd){bd=d;hit=n.id;} }
    if(hit>=0){ dragging=true; dragId=hit; lastY=e.clientY; cv.classList.add("drag");
      try{cv.setPointerCapture(e.pointerId);}catch(_){} }
  });
  cv.addEventListener("pointermove",(e)=>{ mouse.x=e.clientX; mouse.y=e.clientY;
    if(dragging){ const dy=e.clientY-lastY; lastY=e.clientY;
      const n=nodes[dragId];
      n.alloc = Math.max(0, Math.min(1, n.alloc - dy*0.0035)); // 上拖=加学时=变轻
      adjusted.add(n.id);
    } else pick(); });
  function endDrag(e){ if(dragging){ dragging=false; dragId=-1; cv.classList.remove("drag");
    try{cv.releasePointerCapture(e.pointerId);}catch(_){} } }
  cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
  cv.addEventListener("pointerleave",()=>{ if(!dragging) hoverId=-1; });
  cv.addEventListener("click",(e)=>{
    const B=camBasis(); let hit=-1,bd=24;
    for(const n of nodes){ const p=project([n.x,n.y,n.z],B); if(!p)continue;
      const d=Math.hypot(p.sx-e.clientX,p.sy-e.clientY); if(d<bd){bd=d;hit=n.id;} }
    if(hit>=0){ lockId=hit; focusBar=nodes[hit].bar;
      const n=nodes[hit];
      cam.tTarget=[n.x, n.y+0.6, n.z];                  // 聚焦飞入：轨道中心→该牌
      cam.tDist=Math.max(20,Math.min(80, cam.camDist*0.6));
    } else { lockId=-1; focusBar=-1; }
  });
  addEventListener("keydown",(e)=>{ if(e.key==="Escape"){
    lockId=-1; focusBar=-1;
    for(const n of nodes) n.alloc=n.baseAlloc; adjusted.clear();
    cam.tTarget=[0,5.2,0]; cam.tYaw=0.5; cam.tPitch=-0.18; cam.tDist=38; } });

  // 颜色
  function hsl2rgb(h,s,l){ const a=s*Math.min(l,1-l);
    const f=n=>{const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};
    return [f(0),f(8),f(4)]; }
  function plateColor(n){ if(n.weak) return [0.20,0.72,0.62];
    const L=0.46+n.mastery*0.44; return hsl2rgb(192/360,0.30,L); }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function frame(){
    T += 16;
    // 相机缓动（聚焦飞入，无长跳）
    cam.yaw += (cam.tYaw-cam.yaw)*0.12;
    cam.pitch += (cam.tPitch-cam.pitch)*0.12;
    cam.camDist += (cam.tDist-cam.camDist)*0.12;
    cam.target[0]+=(cam.tTarget[0]-cam.target[0])*0.10;
    cam.target[1]+=(cam.tTarget[1]-cam.target[1])*0.10;
    cam.target[2]+=(cam.tTarget[2]-cam.target[2])*0.10;
    updateKin();
    const B=camBasis();

    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W/2,H*0.42,80,W/2,H/2,Math.max(W,H)*0.75);
    bg.addColorStop(0,"#11161d"); bg.addColorStop(1,"#080a0e");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // 悬丝 R->O
    const pR=project(R,B), pO=project(O,B);
    if(pR&&pO){ ctx.strokeStyle="rgba(120,160,170,0.28)"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(pR.sx,pR.sy); ctx.lineTo(pO.sx,pO.sy); ctx.stroke(); }

    // 主臂 + 垂丝 + 挂牌（线条主导）
    for(const bar of bars){
      const pl=project([bar.lx,bar.ly,bar.lz],B), pr=project([bar.rx,bar.ry,bar.rz],B);
      if(pl&&pr&&pO){
        ctx.strokeStyle="rgba(130,165,175,0.5)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(pO.sx,pO.sy); ctx.lineTo(pl.sx,pl.sy);
        ctx.lineTo(pr.sx,pr.sy); ctx.stroke();
      }
      const left=nodes[bar.id*2], right=nodes[bar.id*2+1];
      for(const n of [left,right]){
        const pe=project([n.x,n.y,n.z],B); if(!pe) continue;
        if(pl||pr){ const pa=(n===left)?pl:pr; if(pa){
          ctx.strokeStyle="rgba(120,150,158,0.35)"; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pe.sx,pe.sy); ctx.stroke(); } }
      }
    }

    // 挂牌（深度排序，小几何节点，墨青单色）
    const draw=nodes.map(n=>({n,p:project([n.x,n.y,n.z],B)})).filter(o=>o.p).sort((a,b)=>b.p.z-a.p.z);
    for(const o of draw){ const n=o.n,p=o.p; const col=plateColor(n);
      const w=Math.max(16,Math.min(40,p.scale*2.4)), h=Math.max(9,Math.min(22,p.scale*1.3));
      const isFocus = (lockId===n.id) || (focusBar===n.bar && lockId<0);
      ctx.save(); ctx.translate(p.sx,p.sy);
      ctx.fillStyle=`rgb(${col[0]*255|0},${col[1]*255|0},${col[2]*255|0})`;
      ctx.globalAlpha = (focusBar===n.bar||lockId<0)?1:0.55;
      roundRect(-w/2,-h/2,w,h,4); ctx.fill();
      ctx.globalAlpha=1;
      if(n.weak){ ctx.strokeStyle="rgba(47,174,155,0.95)"; ctx.lineWidth=1.4;
        roundRect(-w/2-2,-h/2-2,w+4,h+4,5); ctx.stroke(); }
      if(isFocus){ ctx.strokeStyle="rgba(220,235,238,0.9)"; ctx.lineWidth=1.4;
        roundRect(-w/2-3,-h/2-3,w+6,h+6,6); ctx.stroke(); }
      ctx.restore();
      // 牌上学科首字（衬线，克制品）
      ctx.fillStyle="rgba(8,12,16,0.85)"; ctx.font='600 11px "Songti SC","SimSun",serif';
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(n.subject[0], p.sx, p.sy); ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    }

    // 悬停浮层（排版）
    if(hoverId>=0 && lockId!==hoverId){ const n=nodes[hoverId]; const p=project([n.x,n.y,n.z],B);
      if(p){ const lines=[n.subject, "掌握度 "+Math.round(n.mastery*100)+"%",
          "学时分配 "+Math.round(n.alloc*100)+"%",
          n.weak?"薄弱 · 建议加时":"稳固","权重 "+weight(n).toFixed(2)];
        const bw=180,bh=14+lines.length*18; let bx=p.sx+16, by=p.sy-bh/2; if(bx+bw>W)bx=p.sx-bw-16;
        ctx.fillStyle="rgba(12,16,22,0.92)"; ctx.strokeStyle="rgba(120,160,170,0.4)"; ctx.lineWidth=1;
        roundRect(bx,by,bw,bh,8); ctx.fill(); ctx.stroke();
        ctx.fillStyle="#dce8ec"; ctx.font='600 14px "Songti SC","SimSun",serif';
        ctx.fillText(lines[0],bx+12,by+22); ctx.font='12px "Songti SC","SimSun",serif'; ctx.fillStyle="#9fb4bc";
        for(let i=1;i<lines.length;i++) ctx.fillText(lines[i],bx+12,by+22+i*18);
      }
    }

    // 顶部标题 + HUD（排版 + 平衡读数）
    ctx.textAlign="left"; ctx.fillStyle="#dce8ec"; ctx.font='600 22px "Songti SC","SimSun",serif';
    ctx.fillText("识悬 · 知识悬衡", 22, 38);
    ctx.font='13px "Songti SC","SimSun",serif'; ctx.fillStyle="#7f969e";
    ctx.fillText("拖挂牌重分配学时，系统确定性重平衡 · 点击聚焦某臂", 22, 58);
    // 不平衡度 = 各臂倾角绝对值之和
    let imb=0; for(const b of bars) imb+=Math.abs(b.tilt);
    ctx.textAlign="right"; ctx.fillStyle="#9fb4bc"; ctx.font='13px "Songti SC","SimSun",serif';
    ctx.fillText("失衡度 "+imb.toFixed(2)+"　已调节 "+adjusted.size+" / "+N+" 学科", W-22, 38);
    if(lockId>=0){ const n=nodes[lockId];
      ctx.fillText("聚焦 · "+n.subject+" · 权重 "+weight(n).toFixed(2), W-22, 58); }
    ctx.textAlign="left";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__probe = { state:()=>{ const B=camBasis(); let on=0;
    for(const n of nodes){ const p=project([n.x,n.y,n.z],B); if(p&&p.sx>=0&&p.sx<=W&&p.sy>=0&&p.sy<=H) on++; }
    return { nan:Number.isFinite(cam.yaw)&&Number.isFinite(cam.camDist)&&Number.isFinite(cam.target[0])&&Number.isFinite(bars[0].tilt),
      nodes:nodes.length, onScreen:on, has3D:true, colorfulFilledCircles:false, lock:lockId, adjusted:adjusted.size }; },
    nodeScreen:(id)=>{ const B=camBasis(); const n=nodes[id]; const p=project([n.x,n.y,n.z],B);
      return (p&&p.sx>=0&&p.sx<=W&&p.sy>=0&&p.sy<=H)?{sx:p.sx,sy:p.sy}:null; } };
})();
</script>
</body>
</html>
