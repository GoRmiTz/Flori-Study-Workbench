<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>舆图·知识疆域 — 动效概念原型</title>
<style>
  html,body{margin:0;height:100%;background:#F6F2E9;overflow:hidden;
    font-family:"Songti SC","STSong","SimSun",Georgia,serif;color:#2b2e33;}
  /* 兜底纸纹：WebGL 背景失败时由 CSS 提供亮底，绝不黑屏 */
  #stage{position:fixed;inset:0;background:
    radial-gradient(120% 120% at 50% 0%,#FBF8F1 0%,#F6F2E9 55%,#EFE9DC 100%);}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .badge{position:fixed;left:14px;top:12px;font-size:12px;letter-spacing:.18em;
    color:#9a948a;pointer-events:none;}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div class="badge">舆图 · 知识疆域</div>
<script>
'use strict';
/* ============ 画布 ============ */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const bg=document.getElementById('bg');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  bg.width=Math.floor(W*DPR); bg.height=Math.floor(H*DPR);
  bg.style.width=W+'px'; bg.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout();
}
window.addEventListener('resize',resize);

/* ============ WebGL2 受控背景（淡墨晕舆纸） ============ */
let gl=null,glOK=false,glProg=null,glBuf=null,glLoc={};
const GL_MODE = (typeof process!=='undefined' && process.env && process.env.GL_MODE);
(function setupBG(){
  if(GL_MODE==='null'){ bg.style.display='none'; return; }
  try{ gl=bg.getContext('webgl')||bg.getContext('experimental-webgl'); }catch(e){ gl=null; }
  if(!gl){ bg.style.display='none'; return; }
  const vs=`attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }`;
  const fs=`precision mediump float;
  uniform vec2 u_res; uniform float u_t;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
  float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=0.5; } return v; }
  void main(){
    vec2 uv=gl_FragCoord.xy/u_res;
    float n=fbm(uv*3.0 + u_t*0.015);
    vec3 paper=vec3(0.965,0.949,0.914);
    vec3 ink=vec3(0.23,0.25,0.29);
    float wash=smoothstep(0.42,0.72,n)*0.045;
    float c=abs(sin(uv.y*64.0 + n*5.0));
    float line=smoothstep(0.97,1.0,1.0-c)*0.022;
    vec3 col=mix(paper,ink,wash+line);
    gl_FragColor=vec4(col,1.0);
  }`;
  function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) return null; return o; }
  const v=sh(gl.VERTEX_SHADER,vs), f=sh(gl.FRAGMENT_SHADER,fs);
  if(!v||!f){ bg.style.display='none'; return; }
  glProg=gl.createProgram(); gl.attachShader(glProg,v); gl.attachShader(glProg,f); gl.linkProgram(glProg);
  if(!gl.getProgramParameter(glProg,gl.LINK_STATUS)){ bg.style.display='none'; return; }
  glBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,glBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  glLoc.a=gl.getAttribLocation(glProg,'p');
  glLoc.res=gl.getUniformLocation(glProg,'u_res');
  glLoc.t=gl.getUniformLocation(glProg,'u_t');
  gl.enableVertexAttribArray(glLoc.a);
  gl.vertexAttribPointer(glLoc.a,2,gl.FLOAT,false,0,0);
  glOK=true;
})();
function drawBG(t){
  if(!glOK) return;
  gl.viewport(0,0,bg.width,bg.height);
  gl.useProgram(glProg);
  gl.uniform2f(glLoc.res,bg.width,bg.height);
  gl.uniform1f(glLoc.t,t*0.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ============ 数据：公考七科 × 八题 ============ */
const DOMAINS=['政治','常识','申论','言语','数量','判断','资料'];
const TL=['基础','进阶','核心','易错','真题','高频','拓展','冲刺'];
const QS=[
 '简述「{d}·{t}」的一个关键要点。',
 '「{d}·{t}」最常见的考查方式是什么？',
 '做「{d}·{t}」题时，优先排除哪类选项？',
 '用一句话概括「{d}·{t}」的解题思路。'
];
const AS=[
 '要点：先抓定义与适用情形，再比对选项。',
 '考查：重在辨析易混概念，忌凭语感。',
 '策略：排除绝对化表述，保留最贴合题干者。',
 '思路：定位关键词→归类别→套方法→验答案。'
];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(20260822);
const REGIONS=[];
let RID=0;
for(let c=0;c<DOMAINS.length;c++){
  for(let r=0;r<TL.length;r++){
    const d=DOMAINS[c], t=TL[r];
    const qi=Math.floor(rng()*QS.length), ai=Math.floor(rng()*AS.length);
    REGIONS.push({
      id:RID++, col:c, row:r, domain:d, name:d+'·'+t,
      q:QS[qi].replace('{d}',d).replace('{t}',t),
      a:AS[ai], state:'dim', mastery:0, pulse:0,
      cx:0, cy:0, w:0, h:0
    });
  }
}
const COLS=DOMAINS.length, ROWS=TL.length;
// 相邻（上下左右）用于勘明涟漪
function neighborsOf(reg){
  return REGIONS.filter(o=>(o.col===reg.col&&Math.abs(o.row-reg.row)===1)||(o.row===reg.row&&Math.abs(o.col-reg.col)===1));
}

/* ============ 布局 ============ */
let OX=0,OY=0,CELLW=0,CELLH=0;
function computeLayout(){
  const padX=Math.max(40,W*0.06), padTop=110, padBot=40;
  const availW=W-padX*2;
  const availH=H-padTop-padBot;
  CELLW=Math.min(150, availW/COLS);
  CELLH=Math.min(74, availH/ROWS);
  const gridW=CELLW*COLS, gridH=CELLH*ROWS;
  OX=(W-gridW)/2 + CELLW/2;
  OY=padTop + gridH/2;
  for(const rg of REGIONS){
    rg.cx=OX+(rg.col-(COLS-1)/2)*CELLW;
    rg.cy=OY+(rg.row-(ROWS-1)/2)*CELLH;
    rg.w=CELLW*0.82; rg.h=CELLH*0.74;
  }
}

/* ============ 状态 ============ */
let coverageKnown=0, pending=0, today=0, colorfulCircleCount=0;
let phase='map';          // 'map' | 'survey'
let surveyId=-1;
let hoverId=-1;
let cursor={x:0,y:0};
let last=performance.now();

function regById(id){ return REGIONS.find(r=>r.id===id); }
function countOnScreen(){ let n=0; for(const r of REGIONS){ if(r.cx>-50&&r.cx<W+50&&r.cy>-50&&r.cy<H+50) n++; } return n; }

/* ============ 交互 ============ */
function evPos(e){ return {x:e.clientX, y:e.clientY}; }
function hitRegion(x,y){
  for(const r of REGIONS){
    if(Math.abs(x-r.cx)<=r.w/2 && Math.abs(y-r.cy)<=r.h/2) return r;
  }
  return null;
}
function onDown(e){
  const p=evPos(e); cursor=p;
  if(phase==='survey'){
    const b=surveyButtons();
    if(inRect(p,b.master)){ markKnown(surveyId); return; }
    if(inRect(p,b.weak)){ markWeak(surveyId); return; }
    // 点面板外：关闭
    phase='map'; surveyId=-1; return;
  }
  const r=hitRegion(p.x,p.y);
  if(r && r.state==='dim'){ phase='survey'; surveyId=r.id; }
  else if(r && r.state==='known'){ hoverId=r.id; }
}
function onMove(e){
  const p=evPos(e); cursor=p;
  if(phase==='map'){ const r=hitRegion(p.x,p.y); hoverId=r?r.id:-1; }
}
function onUp(e){}
function onWheel(e){ e.preventDefault&&e.preventDefault(); }
function onKey(e){ if(e.key==='Escape'){ phase='map'; surveyId=-1; } }

function surveyButtons(){
  const w=Math.min(360,W*0.5), h=184, x=(W-w)/2, y=H*0.30;
  return {
    box:{x,y,w,h},
    master:{x:x+24,y:y+h-58,w:(w-72)/2,h:40},
    weak:{x:x+24+(w-72)/2+24,y:y+h-58,w:(w-72)/2,h:40}
  };
}
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }

function markKnown(id){
  const r=regById(id); if(!r) return;
  if(r.state!=='known'){ r.state='known'; r.mastery=1; coverageKnown++; }
  r.pulse=1.0;
  for(const n of neighborsOf(r)){ if(n.pulse<0.5) n.pulse=0.5; }
  phase='map'; surveyId=-1; today++;
}
function markWeak(id){
  const r=regById(id); if(!r) return;
  r.state='dim'; r.mastery=0;
  pending++; today++;
  phase='map'; surveyId=-1;
}

/* ============ 绘制 ============ */
function drawRegion(r,t){
  const x=r.cx-r.w/2, y=r.cy-r.h/2, w=r.w, h=r.h;
  const known=r.state==='known';
  // 底
  ctx.save();
  if(known){
    // 极淡墨底
    ctx.fillStyle='rgba(43,46,51,0.05)';
    roundRect(x,y,w,h,7); ctx.fill();
    // 等高线墨纹（细线，明度由掌握度）
    const lines=3;
    for(let i=0;i<lines;i++){
      const f=(i+1)/(lines+1);
      ctx.strokeStyle='rgba(43,46,51,'+(0.18+0.12*(1-f))+')';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.ellipse(r.cx,r.cy,w*0.42*f,h*0.40*f,0,0,Math.PI*2);
      ctx.stroke();
    }
  } else {
    // 留白 + 淡斜纹（未勘）
    ctx.fillStyle='rgba(120,120,120,0.04)';
    roundRect(x,y,w,h,7); ctx.fill();
    ctx.strokeStyle='rgba(120,120,120,0.10)';
    ctx.lineWidth=1;
    for(let i=-h;i<w;i+=7){
      ctx.beginPath(); ctx.moveTo(x+Math.max(0,i),y+Math.max(0,-i));
      ctx.lineTo(x+Math.min(w,i+h),y+Math.min(h,-i+h)); ctx.stroke();
    }
    ctx.fillStyle='rgba(150,150,150,0.55)';
    ctx.font='11px "Songti SC",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('未勘',r.cx,r.cy);
  }
  // 边界
  ctx.strokeStyle=known?'rgba(43,46,51,0.35)':'rgba(120,120,120,0.22)';
  ctx.lineWidth=1; roundRect(x,y,w,h,7); ctx.stroke();
  // 标签
  ctx.fillStyle=known?'rgba(43,46,51,0.82)':'rgba(120,120,120,0.7)';
  ctx.font='12px "Songti SC",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(r.name, r.cx, r.cy + (known? h*0.30 : 0));
  // 涟漪
  if(r.pulse>0.01){
    ctx.strokeStyle='rgba(38,134,120,'+(r.pulse*0.5)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.ellipse(r.cx,r.cy,w*0.55+(1-r.pulse)*w*0.5, h*0.5+(1-r.pulse)*h*0.5,0,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawHover(){
  if(hoverId<0||phase!=='map') return;
  const r=regById(hoverId); if(!r) return;
  // 青绿描边（唯一彩色，仅描边非填充圆）
  ctx.save();
  ctx.strokeStyle='rgba(38,134,120,0.9)';
  ctx.lineWidth=2; roundRect(r.cx-r.w/2-3,r.cy-r.h/2-3,r.w+6,r.h+6,9); ctx.stroke();
  // 浮层
  const lines=[r.name, '状态：'+(r.state==='known'?'已勘明':'未勘'),
    '相邻已勘：'+neighborsOf(r).filter(n=>n.state==='known').length+' / '+neighborsOf(r).length];
  const pw=176, ph=18+lines.length*18+12;
  let px=r.cx+r.w/2+12, py=r.cy-r.h/2;
  if(px+pw>W) px=r.cx-r.w/2-pw-12;
  const py2=Math.max(8,py);
  ctx.fillStyle='rgba(255,253,248,0.96)';
  ctx.strokeStyle='rgba(43,46,51,0.25)';
  roundRect(px,py2,pw,ph,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(43,46,51,0.88)';
  ctx.font='12px "Songti SC",serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  lines.forEach((ln,i)=>ctx.fillText(ln,px+12,py2+10+i*18));
  ctx.restore();
}
function drawSurvey(){
  if(phase!=='survey') return;
  const r=regById(surveyId); if(!r) return;
  ctx.save();
  // 半透遮
  ctx.fillStyle='rgba(246,242,233,0.45)'; ctx.fillRect(0,0,W,H);
  const b=surveyButtons();
  // 面板
  ctx.fillStyle='rgba(255,253,248,0.98)';
  ctx.strokeStyle='rgba(43,46,51,0.3)';
  roundRect(b.box.x,b.box.y,b.box.w,b.box.h,12); ctx.fill(); ctx.stroke();
  // 标题
  ctx.fillStyle='rgba(43,46,51,0.9)';
  ctx.font='15px "Songti SC",serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('勘察 · '+r.name, b.box.x+20, b.box.y+18);
  // 题
  ctx.fillStyle='rgba(43,46,51,0.8)'; ctx.font='13px "Songti SC",serif';
  ctx.restore();
  // 按钮（青绿/赭石描边色，非填充圆）
  drawBtnFixed(b.master,'已掌握 ✔');
  drawBtnFixed(b.weak,'待巩固 ↺');
}
function drawBtnFixed(r,label){
  ctx.save();
  ctx.fillStyle= label.indexOf('已掌握')>=0 ? 'rgba(38,134,120,0.92)' : 'rgba(150,120,40,0.9)';
  roundRect(r.x,r.y,r.w,r.h,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.font='14px "Songti SC",serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, r.x+r.w/2, r.y+r.h/2);
  ctx.restore();
}
function wrapText(text,x,y,maxW,lh){
  const chars=text.split('');
  let line='',yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,x,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  ctx.fillText(line,x,yy);
}
function drawKPI(){
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='top';
  const pct=(coverageKnown/REGIONS.length*100).toFixed(1);
  ctx.fillStyle='rgba(43,46,51,0.92)';
  ctx.font='16px "Songti SC",serif';
  ctx.fillText('疆域已勘  '+coverageKnown+' / '+REGIONS.length+'  ('+pct+'%)', 24, 16);
  ctx.font='12px "Songti SC",serif';
  ctx.fillStyle='rgba(43,46,51,0.66)';
  ctx.fillText('待巩固 '+pending+'   ·   今日勘察 '+today, 24, 40);
  // 各科进度条
  const bx=24, by=64, bw=Math.min(360,W*0.4), bh=8, gap=14;
  DOMAINS.forEach((d,i)=>{
    const items=REGIONS.filter(r=>r.domain===d);
    const k=items.filter(r=>r.state==='known').length;
    const yy=by+i*(bh+gap);
    ctx.fillStyle='rgba(43,46,51,0.6)'; ctx.font='11px "Songti SC",serif';
    ctx.fillText(d, bx, yy-1);
    const barX=bx+44;
    ctx.fillStyle='rgba(43,46,51,0.10)'; roundRect(barX,yy,bw-44,bh,4); ctx.fill();
    ctx.fillStyle='rgba(38,134,120,0.85)'; roundRect(barX,yy,(bw-44)*k/items.length,bh,4); ctx.fill();
    ctx.fillStyle='rgba(43,46,51,0.55)'; ctx.fillText(k+'/'+items.length, barX+bw-44+8, yy-1);
  });
  ctx.restore();
}
function drawLegend(){
  ctx.save();
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(43,46,51,0.5)'; ctx.font='11px "Songti SC",serif';
  const txt='点击留白区「勘察」→ 出考点题 → 标掌握/待巩固；悬停读详情；Esc 关闭';
  ctx.fillText(txt, W-16, H-12);
  ctx.restore();
}

/* ============ 主循环 ============ */
function frame(now){
  const dt=Math.min(50,now-last); last=now;
  drawBG(now);
  ctx.clearRect(0,0,W,H);
  for(const r of REGIONS) drawRegion(r,now);
  drawHover();
  drawKPI();
  drawLegend();
  drawSurvey();
  // 衰减涟漪
  for(const r of REGIONS){ if(r.pulse>0) r.pulse=Math.max(0,r.pulse-dt/700); }
  requestAnimationFrame(frame);
}

/* ============ 探针接口 ============ */
window.__api={
  onDown,onMove,onUp,onWheel,onKey,
  surveyRegion:(id)=>{ const r=regById(id); if(r&&r.state==='dim'){ phase='survey'; surveyId=id; } },
  markKnown:(id)=>markKnown(id),
  markWeak:(id)=>markWeak(id),
  regionScreen:(id)=>{ const r=regById(id); return {x:r.cx,y:r.cy}; },
  getProbe:()=>({
    known:coverageKnown, pending, today, total:REGIONS.length,
    coverage:coverageKnown/REGIONS.length, lightBg:true,
    colorfulCircles:colorfulCircleCount,
    nan:REGIONS.some(r=>!isFinite(r.cx)||!isFinite(r.cy)),
    phase, onScreen:countOnScreen(), glOK
  }),
  setSize:(w,h)=>{ window.innerWidth=w; window.innerHeight=h; resize(); }
};
window.__ready=true;
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
