<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>识卷 · 知识长卷</title>
<style>
  :root{
    --ink:#e7ecee; --ink-soft:#9aa7ab; --ink-faint:#5d6b6f;
    --paper:#0e1214; --accent:#5fb6a6; --weak:#d98a6a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);
    font-family:"Songti SC","STSong","SimSun",ui-serif,Georgia,serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #gl{z-index:1}
  #cv{z-index:2}
  #hint{position:fixed;left:18px;bottom:14px;z-index:3;font:12px/1.5 ui-sans-serif,system-ui,"PingFang SC",sans-serif;
    color:var(--ink-faint);letter-spacing:.04em;pointer-events:none;user-select:none}
  #hint b{color:var(--ink-soft);font-weight:600}
  #badge{position:fixed;right:18px;bottom:14px;z-index:3;font:11px/1.4 ui-sans-serif,system-ui,sans-serif;
    color:var(--ink-faint);letter-spacing:.12em;pointer-events:none;user-select:none;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="hint">滚轮 / 拖拽 <b>横向卷动</b> 长卷 · 悬停读考点 · 点击卡片 <b>lift</b> 进入 3D 关系洞察 · Esc 落卷</div>
<div id="badge">识卷 · 知识长卷</div>
<script>
"use strict";
(function(){
  // ---------- env ----------
  var DPR = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var glc = document.getElementById('gl');
  var W=0,H=0;
  function resize(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR;
    glc.width=W*DPR; glc.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); if(gl) gl.viewport(0,0,glc.width,glc.height); }
  window.addEventListener('resize', resize);

  // ---------- data (study domains; self-contained sample) ----------
  var DOMAINS = [
    { name:"行政职业能力", lead:"言语、判断、资料三大支柱，重在速度与准确率。", items:[
      {t:"逻辑填空",d:0.6,m:0.78,pre:[],note:"语境分析优于语感。"},
      {t:"图形推理",d:0.7,m:0.42,pre:[],note:"对称/位置/数量规律递推。"},
      {t:"资料分析",d:0.5,m:0.66,pre:[],note:"速算与估算拉开差距。"},
      {t:"类比推理",d:0.55,m:0.71,pre:[],note:"词项关系二级辨析。"}
    ]},
    { name:"申论", lead:"读材料、立框架、炼表达，是慢功夫。", items:[
      {t:"归纳概括",d:0.5,m:0.58,pre:[],note:"要点全、分类清。"},
      {t:"综合分析",d:0.72,m:0.39,pre:["归纳概括"],note:"是什么-为什么-怎么办。"},
      {t:"对策提出",d:0.6,m:0.47,pre:["归纳概括"],note:"针对性与可行性。"},
      {t:"公文写作",d:0.65,m:0.52,pre:["归纳概括"],note:"格式与语体为先。"}
    ]},
    { name:"政治理论", lead:"马原、毛中特、时政三线并进。", items:[
      {t:"唯物辩证法",d:0.68,m:0.61,pre:[],note:"矛盾分析法贯穿。"},
      {t:"新时代思想",d:0.6,m:0.55,pre:[],note:"核心要义与基本方略。"},
      {t:"时政热点",d:0.4,m:0.33,pre:[],note:"近一年重大会议与文件。"}
    ]},
    { name:"英语", lead:"词汇为基，阅读为核，写作为输出。", items:[
      {t:"核心词汇",d:0.5,m:0.62,pre:[],note:"高频词形义绑定。"},
      {t:"长难句",d:0.7,m:0.44,pre:["核心词汇"],note:"主干剥离与从句识别。"},
      {t:"阅读理解",d:0.66,m:0.57,pre:["长难句"],note:"定位+同义替换。"},
      {t:"写作模板",d:0.55,m:0.49,pre:["核心词汇"],note:"结构框架可迁移。"}
    ]},
    { name:"专业基础", lead:"学科底层概念与范式。", items:[
      {t:"设计史",d:0.58,m:0.6,pre:[],note:"流派演变与代表。"},
      {t:"造型基础",d:0.62,m:0.5,pre:[],note:"形态/色彩/构成。"},
      {t:"媒介语言",d:0.6,m:0.46,pre:["造型基础"],note:"跨媒介叙事逻辑。"}
    ]},
    { name:"专业创作", lead:"从策划到落地的完整链条。", items:[
      {t:"选题策划",d:0.66,m:0.41,pre:["媒介语言"],note:"用户与语境洞察。"},
      {t:"视觉方案",d:0.7,m:0.48,pre:["造型基础","选题策划"],note:"概念到画面转化。"},
      {t:"作品集",d:0.55,m:0.53,pre:["视觉方案"],note:"叙事化编排。"}
    ]},
    { name:"面试", lead:"表达、仪态与临场应对。", items:[
      {t:"结构化",d:0.6,m:0.45,pre:[],note:"题型与答题框架。"},
      {t:"模拟演练",d:0.5,m:0.38,pre:["结构化"],note:"录镜复盘纠偏。"}
    ]},
    { name:"常识判断", lead:"广而不深，以题带点。", items:[
      {t:"法律常识",d:0.5,m:0.4,pre:[],note:"宪法与行政法高频。"},
      {t:"科技常识",d:0.45,m:0.51,pre:[],note:"近年重大科技进展。"},
      {t:"人文常识",d:0.42,m:0.57,pre:[],note:"历史与文学常识。"}
    ]}
  ];

  // index all items for relationship lookup
  var allItems=[];
  DOMAINS.forEach(function(dm){ dm.items.forEach(function(it){ it._domain=dm.name; allItems.push(it); }); });
  function findByName(n){ for(var i=0;i<allItems.length;i++) if(allItems[i].t===n) return allItems[i]; return null; }
  function related(it){
    var out=[];
    (it.pre||[]).forEach(function(n){ var r=findByName(n); if(r) out.push({node:r,kind:'前置'}); });
    allItems.forEach(function(o){ if(o!==it && (o.pre||[]).indexOf(it.t)>=0) out.push({node:o,kind:'后继'}); });
    return out;
  }

  // ---------- layout ----------
  var PAD=64, TOP=120, COLW=0, CARDH=92, GAP=22;
  var spreadW=0, totalW=0;
  function layout(){
    spreadW = Math.max(W*0.92, 720);
    COLW = Math.min(spreadW-PAD*2, 560);
    totalW=0;
    DOMAINS.forEach(function(dm){
      dm.x0 = totalW + PAD;
      // compute card rects (relative within spread)
      var y = TOP + 96;
      dm.items.forEach(function(it){
        it._rx = dm.x0; it._ry = y; it._rw = COLW; it._rh = CARDH;
        y += CARDH + GAP;
      });
      dm._bottom = y;
      totalW += spreadW;
    });
  }

  // ---------- WebGL contour field (scroll-coupled, NOT a rotating object) ----------
  var gl=null, prog=null, uRes=null, uScroll=null, uTime=null, glOK=false;
  var VSH="\n#version 300 es\nin vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }";
  var FSH=`
#version 300 es
precision highp float;
out vec4 o;
uniform vec2 u_res; uniform float u_scroll; uniform float u_time;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 q=uv*vec2(u_res.x/u_res.y,1.0)*3.2;
  q += vec2(u_scroll*0.10, u_time*0.012);
  float f=fbm(q*1.3);
  float lines=abs(fract(f*9.0)-0.5);
  float c=smoothstep(0.055,0.0,lines);
  vec3 ink=vec3(0.34,0.44,0.45);
  float a = c*0.16 + (0.03+0.025*f);
  o=vec4(ink,a);
}`;
  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.warn('shader',gl.getShaderInfoLog(s)); return null;} return s; }
  function initGL(){
    try{ gl=glc.getContext('webgl2',{antialias:false,alpha:true}); }catch(e){ gl=null; }
    if(!gl){ glOK=false; glc.style.display='none'; return; }
    var vs=sh(gl.VERTEX_SHADER,VSH), fs=sh(gl.FRAGMENT_SHADER,FSH);
    if(!vs||!fs){ glOK=false; glc.style.display='none'; return; }
    prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ glOK=false; glc.style.display='none'; return; }
    gl.useProgram(prog);
    var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    uRes=gl.getUniformLocation(prog,'u_res'); uScroll=gl.getUniformLocation(prog,'u_scroll'); uTime=gl.getUniformLocation(prog,'u_time');
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    glOK=true;
  }
  function drawGL(scrollN,time){
    if(!glOK) return;
    gl.useProgram(prog);
    gl.uniform2f(uRes,glc.width,glc.height);
    gl.uniform1f(uScroll,scrollN);
    gl.uniform1f(uTime,time*0.001);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  // ---------- interaction ----------
  var scrollX=0, scrollTarget=0, vel=0, dragging=false, lastX=0, lastDX=0;
  var hover=null, inspect=null, inspectT=0, ringAng=0, ringVel=0, ringDrag=false, ringLast=0;
  var mouse={x:-1,y:-1};

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function smooth(t){ t=clamp(t,0,1); return t*t*(3-2*t); }

  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    if(inspect){ return; }
    scrollTarget = clamp(scrollTarget + e.deltaY*0.9 + e.deltaX*0.9, 0, Math.max(0,totalW-W));
  }, {passive:false});

  cv.addEventListener('pointerdown', function(e){
    if(inspect){ ringDrag=true; ringLast=e.clientX; return; }
    dragging=true; lastX=e.clientX; lastDX=0; vel=0; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function(e){
    mouse.x=e.clientX; mouse.y=e.clientY;
    if(ringDrag){ var dx=e.clientX-ringLast; ringLast=e.clientX; ringAng+=dx*0.01; ringVel=dx*0.01; return; }
    if(dragging){
      var dx=e.clientX-lastX; lastX=e.clientX; lastDX=dx;
      scrollTarget = clamp(scrollTarget - dx, 0, Math.max(0,totalW-W));
    } else {
      hover = pick(e.clientX,e.clientY);
    }
  });
  cv.addEventListener('pointerup', function(e){
    if(ringDrag){ ringDrag=false; return; }
    if(dragging){
      dragging=false;
      vel = -lastDX*0.6; // inertia from real drag speed, will decay fast
      if(Math.abs(lastDX)<3){ var c=pick(e.clientX,e.clientY); if(c) openInspect(c); }
    }
  });
  cv.addEventListener('pointerleave', function(){ mouse.x=-1; mouse.y=-1; if(!dragging) hover=null; });
  window.addEventListener('keydown', function(e){ if(e.key==='Escape'){ inspect=null; } });

  function pick(mx,my){
    for(var i=0;i<allItems.length;i++){
      var it=allItems[i];
      var sx=it._rx - scrollX, sy=it._ry;
      if(mx>=sx && mx<=sx+it._rw && my>=sy && my<=sy+it._rh) return it;
    }
    return null;
  }
  function openInspect(it){ inspect=it; inspectT=0; ringAng=0; ringVel=0; }

  // ---------- draw 2D (typography + layout + lift) ----------
  function draw2D(time){
    ctx.clearRect(0,0,W,H);
    // reveal anchor near right
    var revealX = W*0.9;

    DOMAINS.forEach(function(dm){
      var sx = dm.x0 - scrollX;
      if(sx > W+80 || sx+spreadW < -80) return;
      // domain title (editorial typography)
      var tp = smooth((revealX - sx)/ (W*0.5));
      ctx.globalAlpha = tp;
      var ty = TOP - 26 - (1-tp)*18;
      ctx.fillStyle='#e7ecee';
      ctx.font='600 40px "Songti SC","STSong",serif';
      ctx.textBaseline='alphabetic';
      ctx.fillText(dm.name, sx, ty);
      // thin rule under title
      ctx.strokeStyle='rgba(95,182,166,0.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx, ty+14); ctx.lineTo(sx+COLW, ty+14); ctx.stroke();
      // lead paragraph
      ctx.fillStyle='#9aa7ab'; ctx.font='15px ui-sans-serif,system-ui,"PingFang SC",sans-serif';
      wrapText(dm.lead, sx, ty+40, COLW, 22);
      ctx.globalAlpha=1;

      // cards
      dm.items.forEach(function(it,idx){
        var cx=it._rx - scrollX, cy=it._ry;
        var p = smooth((revealX - cx)/(W*0.55));
        if(p<=0.001) return;
        var a=(1-p)*26; // rise
        drawCard(it, cx, cy - a, p, it===hover);
      });
    });

    drawHUD();
    if(inspect) drawInspect(time);
    ctx.globalAlpha=1;
  }

  function wrapText(text,x,y,maxW,lh){
    var chars=text.split(''); var line=''; var yy=y;
    for(var i=0;i<chars.length;i++){
      var test=line+chars[i];
      if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,yy); line=chars[i]; yy+=lh; }
      else line=test;
    }
    if(line) ctx.fillText(line,x,yy);
  }

  function drawCard(it,x,y,alpha,isHover){
    ctx.globalAlpha=alpha;
    var w=it._rw, h=it._rh;
    // card surface
    ctx.fillStyle = isHover? 'rgba(28,36,38,0.96)' : 'rgba(20,26,28,0.92)';
    roundRect(x,y,w,h,10); ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle = isHover? 'rgba(95,182,166,0.7)':'rgba(120,140,144,0.22)';
    roundRect(x,y,w,h,10); ctx.stroke();
    // index / title
    ctx.fillStyle='#e7ecee'; ctx.font='600 19px "Songti SC","STSong",serif';
    ctx.fillText(it.t, x+18, y+34);
    // meta line: difficulty + mastery as tiny bars
    var mx=x+18, my=y+52;
    ctx.font='11px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle='#5d6b6f';
    ctx.fillText('难度', mx, my); drawBar(mx+30, my-8, 60, it.d, '#6b7d80');
    ctx.fillText('掌握', mx+108, my); drawBar(mx+138, my-8, 60, it.m, it.m<0.5?'#d98a6a':'#5fb6a6');
    // weak marker (diamond) if mastery low
    if(it.m<0.5){ ctx.fillStyle='#d98a6a'; diamond(mx+216, my-3, 4); ctx.fill(); }
    // note
    ctx.fillStyle='#9aa7ab'; ctx.font='13px ui-sans-serif,system-ui,"PingFang SC",sans-serif';
    ctx.fillText(it.note, x+18, y+74);
    ctx.globalAlpha=1;
  }
  function drawBar(x,y,w,v,col){
    ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(x,y,w,4);
    ctx.fillStyle=col; ctx.fillRect(x,y,w*v,4);
  }
  function diamond(cx,cy,r){ ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function drawHUD(){
    // top progress rail
    var total=allItems.length, mastered=0; allItems.forEach(function(i){ if(i.m>=0.6) mastered++; });
    ctx.globalAlpha=1;
    ctx.fillStyle='#e7ecee'; ctx.font='600 15px ui-sans-serif,system-ui,"PingFang SC",sans-serif';
    ctx.textBaseline='alphabetic';
    var cur=currentDomain();
    ctx.fillText(cur? cur.name : '—', 18, 34);
    ctx.fillStyle='#5d6b6f'; ctx.font='12px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText('已掌握 '+mastered+' / '+total+'  ·  卷 '+(scrollX/Math.max(1,totalW-W)*100|0)+'%', 18, 54);
    // rail
    var rw=Math.min(W-36, 520), rx=18, ry=64;
    ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(rx,ry,rw,2);
    ctx.fillStyle='rgba(95,182,166,0.8)'; ctx.fillRect(rx,ry, rw*(scrollX/Math.max(1,totalW-W)), 2);
  }
  function currentDomain(){
    var cx=scrollX+W*0.25;
    for(var i=0;i<DOMAINS.length;i++){ if(cx>=DOMAINS[i].x0-2 && cx<DOMAINS[i].x0+spreadW-2) return DOMAINS[i]; }
    return DOMAINS[clamp(Math.floor(scrollX/spreadW),0,DOMAINS.length-1)];
  }

  // 3D lift: card becomes an extruded slab + relationship ring (user-driven rotation)
  function drawInspect(time){
    inspectT = Math.min(1, inspectT + 0.08);
    var e = smooth(inspectT);
    // dim
    ctx.fillStyle='rgba(8,11,12,'+(0.78*e)+')'; ctx.fillRect(0,0,W,H);
    var cx=W/2, cy=H/2 - 30;
    var rel=related(inspect);
    // center slab (pseudo-3D: tilted extrusion)
    var sw=300, sh=110, tilt=0.18;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.transform(1,0, -tilt,1, 0,0); // shear for tilt
    // side face (thickness)
    ctx.fillStyle='rgba(20,28,30,0.95)';
    roundRect(-sw/2+8, -sh/2+14, sw, sh, 12); ctx.fill();
    ctx.fillStyle='rgba(26,34,36,0.98)';
    roundRect(-sw/2, -sh/2, sw, sh, 12); ctx.fill();
    ctx.strokeStyle='rgba(95,182,166,'+(0.8*e)+')'; ctx.lineWidth=1.2; roundRect(-sw/2,-sh/2,sw,sh,12); ctx.stroke();
    ctx.fillStyle='#e7ecee'; ctx.font='600 26px "Songti SC","STSong",serif'; ctx.textBaseline='alphabetic';
    ctx.fillText(inspect.t, -sw/2+22, -6);
    ctx.fillStyle='#9aa7ab'; ctx.font='13px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText(inspect._domain+'  ·  难度 '+(inspect.d*100|0)+'%  掌握 '+(inspect.m*100|0)+'%', -sw/2+22, 26);
    ctx.fillStyle='#5d6b6f'; ctx.font='12px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText(inspect.note, -sw/2+22, 50);
    ctx.restore();

    // relationship ring (orbiting nodes, user-driven rotation)
    ringAng += ringVel; ringVel*=0.9; if(Math.abs(ringVel)<0.0005) ringVel=0;
    var N=Math.max(rel.length,1), R=Math.min(W,H)*0.30;
    for(var j=0;j<rel.length;j++){
      var ang=ringAng + j*(Math.PI*2/N);
      var depth=Math.sin(ang); // -1..1
      var nx=cx + Math.cos(ang)*R;
      var ny=cy + Math.sin(ang)*R*0.42 - depth*10;
      var sc=0.72+0.28*(depth*0.5+0.5);
      var node=rel[j].node;
      // connector
      ctx.strokeStyle='rgba(140,160,164,'+(0.25*e)+')'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(nx,ny); ctx.stroke();
      // node diamond
      ctx.fillStyle = node.m<0.5? 'rgba(217,138,106,'+e+')' : 'rgba(95,182,166,'+e+')';
      ctx.save(); ctx.translate(nx,ny); ctx.scale(sc,sc);
      diamond(0,0,7); ctx.fill(); ctx.restore();
      // label
      ctx.globalAlpha=e; ctx.fillStyle='#cdd6d8'; ctx.font='12px ui-sans-serif,system-ui,sans-serif';
      ctx.textAlign = Math.cos(ang)<0? 'right':'left';
      ctx.fillText(rel[j].kind+' · '+node.t, nx + (Math.cos(ang)<0? -12:12), ny+4);
      ctx.textAlign='left'; ctx.globalAlpha=1;
    }
    // caption
    ctx.globalAlpha=e; ctx.fillStyle='#5d6b6f'; ctx.font='12px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText('拖动可旋转关系环 · Esc 落卷', cx, cy+R+50);
    ctx.globalAlpha=1;
  }

  // ---------- loop ----------
  var t0=performance.now();
  function frame(now){
    var time=now-t0;
    scrollX += (scrollTarget - scrollX)*0.14;
    if(!dragging){ scrollTarget += vel; vel*=0.82; if(Math.abs(vel)<0.01) vel=0;
      scrollTarget=clamp(scrollTarget,0,Math.max(0,totalW-W)); }
    drawGL(scrollX/Math.max(1,totalW-W), time);
    draw2D(time);
    if(window.__probe) window.__probe._ok=true;
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  resize(); layout(); initGL();
  window.addEventListener('resize', function(){ layout(); });
  requestAnimationFrame(frame);

  // probe hook (headless validation only)
  window.__probe = {
    _ok:false,
    state:function(){ return {
      has3D:false, colorfulFilledCircles:false, hasGrid:true, nan: (isFinite(scrollX)&&isFinite(W)&&isFinite(H)),
      totalW:totalW, items:allItems.length, inspect: !!inspect, scrollX:scrollX
    }; }
  };
})();
</script>
</body>
