<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>墨脉 · 芙洛理知识脉络动效概念原型</title>
<style>
  :root{
    --paper:#f3ecdc; --paper2:#ece2cd; --ink:#23232b; --ink2:#6c6c76;
    --jade:#13857a; --seal:#cf2a1f; --gold:#b6882f; --line:#d9cdb2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:var(--paper);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }
  /* WebGL ink-wash background (guarded; hidden on failure, CSS shows through) */
  #bg{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:none; }
  body::before{ content:""; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(1200px 800px at 70% -10%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(900px 700px at 12% 110%, rgba(19,133,122,.05), transparent 60%),
      linear-gradient(180deg,var(--paper),var(--paper2)); }
  #app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }
  .topbar{ height:56px; flex:0 0 56px; display:flex; align-items:center; gap:22px;
    padding:0 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0)); }
  .brand{ font-weight:700; letter-spacing:2px; font-size:16px; }
  .brand b{ color:var(--jade); }
  .tabs{ display:flex; gap:6px; }
  .tab{ font-size:14px; padding:7px 14px; border-radius:9px; cursor:pointer; color:var(--ink2);
    transition:color .25s, background .25s; user-select:none; }
  .tab:hover{ color:var(--ink); }
  .tab.on{ color:#fff; background:var(--ink); }
  .spacer{ flex:1; }
  .toggle{ font-size:13px; padding:7px 13px; border-radius:9px; cursor:pointer; user-select:none;
    border:1px solid var(--line); color:var(--ink2); background:rgba(255,255,255,.4); transition:all .25s; }
  .toggle.on{ color:#fff; background:var(--jade); border-color:var(--jade); }
  .side{ flex:1 1 0; min-height:0; position:relative; overflow:hidden; }
  #stage{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud{ position:absolute; left:18px; bottom:16px; max-width:330px; font-size:12px; line-height:1.7;
    color:var(--ink2); background:rgba(255,255,255,.55); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; backdrop-filter:blur(3px); }
  .hud b{ color:var(--ink); }
  .hud .k{ color:var(--jade); font-weight:600; }
  .counter{ position:absolute; right:18px; top:14px; font-size:13px; color:var(--ink2);
    background:rgba(255,255,255,.55); border:1px solid var(--line); border-radius:10px; padding:7px 12px; }
  .counter b{ color:var(--seal); }
  #err{ position:fixed; left:0; right:0; top:0; z-index:9; display:none; padding:8px 14px;
    background:#cf2a1f; color:#fff; font-size:13px; text-align:center; }
</style>
</head>
<body>
<div id="err"></div>
<canvas id="bg"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand">律<b>己</b></div>
    <div class="tabs">
      <div class="tab on" data-tab="lib">知识库</div>
      <div class="tab" data-tab="quiz">练考</div>
      <div class="tab" data-tab="review">复盘</div>
    </div>
    <div class="spacer"></div>
    <div class="toggle on" id="demoBtn">演示 开</div>
    <div class="toggle" id="resetBtn">复位脉络</div>
    <div class="brand" style="width:30px;height:30px;border-radius:50%;background:var(--seal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">吾</div>
  </div>
  <div class="side">
    <canvas id="stage"></canvas>
    <div class="counter">已通脉络 <b id="cnt">0</b> / <span id="tot">0</span></div>
    <div class="hud">
      <b>墨脉 · 概念原型</b>（落点：知识库 / 复盘）<br/>
      <span class="k">悬停</span> 节点 → 脉气沿脉络流动、点亮关联；
      <span class="k">点击</span> 节点 → 通此脉络（深化并记一笔）；
      <span class="k">拖拽</span> 平移、<span class="k">滚轮</span> 缩放；
      <span class="k">切换</span> 知识库 / 复盘 → 整张脉络编排式重排。<br/>
      全部由你的真实操作驱动，无问答、无计分、无自动乱跑。
    </div>
  </div>
</div>

<script>
"use strict";
const PAL = {
  paper:[0.953,0.925,0.863], paper2:[0.925,0.886,0.804],
  ink:[0.137,0.137,0.169], ink2:[0.424,0.424,0.463],
  jade:[0.075,0.520,0.478], seal:[0.812,0.165,0.122], gold:[0.714,0.533,0.184],
  line:[0.851,0.804,0.698]
};
const GROUP_COL = [
  PAL.jade,            // 行测
  [0.18,0.22,0.30],    // 申论（墨蓝）
  PAL.gold,            // 常识
  [0.20,0.42,0.46],    // 时政（青灰）
  [0.30,0.33,0.42]     // 公基（灰蓝）
];

// ---- 知识点图谱（考公语境） ----
const NODES = [
  {id:'yan', label:'行测', g:0, hub:true},
  {id:'yan1',label:'言语', g:0, parent:'yan'},
  {id:'yan2',label:'数量', g:0, parent:'yan'},
  {id:'yan3',label:'判断', g:0, parent:'yan'},
  {id:'yan4',label:'资料', g:0, parent:'yan'},
  {id:'shen',label:'申论', g:1, hub:true},
  {id:'shen1',label:'归纳', g:1, parent:'shen'},
  {id:'shen2',label:'对策', g:1, parent:'shen'},
  {id:'chang',label:'常识', g:2, hub:true},
  {id:'chang1',label:'法律', g:2, parent:'chang'},
  {id:'chang2',label:'科技', g:2, parent:'chang'},
  {id:'shiz',label:'时政', g:3, hub:true},
  {id:'shiz1',label:'国内', g:3, parent:'shiz'},
  {id:'shiz2',label:'国际', g:3, parent:'shiz'},
  {id:'gong',label:'公基', g:4, hub:true},
  {id:'gong1',label:'政治', g:4, parent:'gong'},
  {id:'gong2',label:'管理', g:4, parent:'gong'}
];
const EDGES = [
  ['yan','yan1'],['yan','yan2'],['yan','yan3'],['yan','yan4'],
  ['shen','shen1'],['shen','shen2'],
  ['chang','chang1'],['chang','chang2'],
  ['shiz','shiz1'],['shiz','shiz2'],
  ['gong','gong1'],['gong','gong2'],
  // 跨脉络桥
  ['yan4','shen'],   // 资料分析 → 申论写作
  ['yan3','chang'],  // 判断推理 → 常识法律
  ['shiz','chang'],  // 时政 → 常识
  ['shen','gong'],   // 申论 → 公基
  ['shiz','gong']    // 时政 → 公基
];

// 邻接表
const ADJ = {}; NODES.forEach(n=>ADJ[n.id]=[]);
EDGES.forEach(([a,b])=>{ ADJ[a].push(b); ADJ[b].push(a); });

// 运行状态
const S = {
  tab:'lib', demo:true, pan:{x:0,y:0}, panV:{x:0,y:0}, zoom:1, zoomTarget:1,
  hover:null, drag:false, last:{x:0,y:0}, master:new Set(),
  pulses:[], pid:0, demoT:0, W:0, H:0, dpr:1, userMoved:false, glow:[]
};
NODES.forEach((n,i)=>{ n.x=0; n.y=0; n.tx=0; n.ty=0; n.flash=0; n.scale=1; n.spd=0.05+0.04*((i%5)/5); });

// ---- 布局：A 放射（知识库） / B 分组列（复盘） ----
function layout(){
  const W=S.W, H=S.H, cx=W/2, cy=H/2;
  const hubs = NODES.filter(n=>n.hub);
  const R = Math.min(W,H)*0.38;
  hubs.forEach((h,i)=>{
    const a = -Math.PI/2 + i/hubs.length*Math.PI*2;
    h.home = { x: cx + Math.cos(a)*R, y: cy + Math.sin(a)*R };
  });
  // 子节点围绕父 hub 小弧
  NODES.filter(n=>!n.hub).forEach(n=>{
    const p = NODES.find(m=>m.id===n.parent);
    const siblings = NODES.filter(m=>m.parent===n.parent);
    const idx = siblings.indexOf(n), k = siblings.length;
    const baseA = Math.atan2(p.home.y-cy, p.home.x-cx);
    const spread = 0.8, off = (idx-(k-1)/2)*spread;
    const a = baseA + off;
    const rr = Math.min(W,H)*0.16;
    n.home = { x: p.home.x + Math.cos(a)*rr, y: p.home.y + Math.sin(a)*rr };
  });
  // 布局 B：按 group 分列（复盘视图：纵向堆叠）
  const groups = [[],[],[],[],[]];
  NODES.forEach(n=>groups[n.g].push(n));
  const colW = W/Math.max(groups.length,1);
  groups.forEach((g,gi)=>{
    const x = colW*(gi+0.5);
    const step = Math.min(H/(g.length+1), 90);
    g.forEach((n,ni)=>{ n.work = { x:x, y: H*0.12 + step*(ni+1) }; });
  });
  // 设定初始目标
  NODES.forEach(n=>{
    const tgt = (S.tab==='lib')? n.home : n.work;
    n.tx=tgt.x; n.ty=tgt.y;
    if(n.x===0&&n.y===0){ n.x=tgt.x; n.y=tgt.y; }
  });
}
function setTab(t){
  S.tab=t;
  NODES.forEach((n,i)=>{ const tgt=(t==='lib')?n.home:n.work; n.tx=tgt.x; n.ty=tgt.y; });
  fitView();
}
// 自动把整图缩放居中铺满视口（解决「显示不全 / 太密集」）
function fitView(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  NODES.forEach(n=>{ const x=n.tx,y=n.ty;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; });
  const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
  const pad=0.84;
  let z=Math.min(S.W*pad/bw, S.H*pad/bh, 1.6); z=Math.max(0.5,z);
  S.zoom=z; S.zoomTarget=z;
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  S.pan.x=S.W/2 - cx*z; S.pan.y=S.H/2 - cy*z; S.panV.x=0; S.panV.y=0;
}

// ---- 画布 ----
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
function resize(){
  S.dpr = Math.min(window.devicePixelRatio||1, 2);
  const r = stage.getBoundingClientRect();
  let w = r.width, h = r.height;
  // 兜底：若布局尚未 flush 拿到异常尺寸，用窗口尺寸估算（顶栏 56px）
  if(w < 2 || h < 2){ w = (window.innerWidth || 960); h = (window.innerHeight || 640) - 56; }
  S.W = w; S.H = h;
  stage.width = Math.max(1,Math.floor(w*S.dpr));
  stage.height = Math.max(1,Math.floor(h*S.dpr));
  ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  layout();
  if(!S.userMoved) fitView();
}
window.addEventListener('resize', resize);

// ---- 受控 WebGL 墨晕背景（失败则隐藏，CSS 纸纹透出） ----
let gl=null, glProg=null, glOK=false;
const bg = document.getElementById('bg');
function initGL(){
  try{
    gl = bg.getContext('webgl', {antialias:false, alpha:false, premultipliedAlpha:false});
    if(!gl) return;
    const vs='attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
    const fs=[
      'precision highp float;',
      'uniform vec2 u_res; uniform float u_time;',
      'float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }',
      'float noise(vec2 p){ vec2 i=floor(p),f=fract(p);',
      ' float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));',
      ' vec2 u=f*f*(3.-2.*f); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }',
      'void main(){ vec2 uv=gl_FragCoord.xy/u_res;',
      ' float n=0.6*noise(uv*3.0+vec2(u_time*0.03,-u_time*0.02));',
      ' n+=0.4*noise(uv*6.0-vec2(u_time*0.02,u_time*0.015));',
      ' vec3 paper=vec3(0.953,0.925,0.863); vec3 ink=vec3(0.075,0.32,0.30);',
      ' vec3 col=mix(paper,ink,smoothstep(0.55,0.95,n)*0.05);',
      ' float d=distance(uv,vec2(0.5)); col*=1.0-0.06*d;',
      ' gl_FragColor=vec4(col,1.0); }'
    ].join('\n');
    const cv=gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(cv,vs); gl.compileShader(cv);
    if(!gl.getShaderParameter(cv,gl.COMPILE_STATUS)) return;
    const cf=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(cf,fs); gl.compileShader(cf);
    if(!gl.getShaderParameter(cf,gl.COMPILE_STATUS)) return;
    glProg=gl.createProgram(); gl.attachShader(glProg,cv); gl.attachShader(glProg,cf);
    gl.linkProgram(glProg);
    if(!gl.getProgramParameter(glProg,gl.LINK_STATUS)) return;
    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(glProg,'p'); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.useProgram(glProg);
    gl.uniform1i(gl.getUniformLocation(glProg,'u_res'),0);
    glOK=true; bg.style.display='block';
  }catch(e){ glOK=false; bg.style.display='none'; }
}
function drawGL(t){
  if(!glOK) return;
  try{
    const w=bg.width=Math.floor(S.W*S.dpr), h=bg.height=Math.floor(S.H*S.dpr);
    gl.viewport(0,0,w,h); gl.useProgram(glProg);
    gl.uniform2f(gl.getUniformLocation(glProg,'u_res'),w,h);
    gl.uniform1f(gl.getUniformLocation(glProg,'u_time'),t);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }catch(e){ glOK=false; bg.style.display='none'; }
}

function err(msg){ const e=document.getElementById('err'); e.style.display='block'; e.textContent='⚠ '+msg; }

// ---- 坐标转换 ----
function toWorld(sx,sy){ return { x:(sx - S.pan.x)/S.zoom, y:(sy - S.pan.y)/S.zoom }; }
function nodeAt(sx,sy){
  const w=toWorld(sx,sy);
  for(let i=NODES.length-1;i>=0;i--){ const n=NODES[i];
    const dx=w.x-n.x, dy=w.y-n.y; if(dx*dx+dy*dy < 22*22) return n; }
  return null;
}

// ---- 脉冲（脉络流动） ----
function sendPulse(fromId){
  const id=++S.pid; const visited=new Set([fromId]);
  ADJ[fromId].forEach(to=>{ S.pulses.push({a:fromId,b:to,t:0,dur:0.6,depth:0,id,visited}); });
  flash(fromId,1.0);
}
function flash(id,v){ const n=NODES.find(m=>m.id===id); if(n) n.flash=Math.max(n.flash,v); }
function updatePulses(dt){
  const MAXD=2, SPEED=260; // px/sec 沿脉络
  for(let i=S.pulses.length-1;i>=0;i--){ const p=S.pulses[i];
    const A=NODES.find(m=>m.id===p.a), B=NODES.find(m=>m.id===p.b);
    if(!A||!B){ S.pulses.splice(i,1); continue; }
    const len=Math.hypot(B.x-A.x,B.y-A.y)||1;
    p.t += (SPEED*dt)/len;
    if(p.t>=1){ flash(p.b, 1.0 - p.depth*0.28);
      if(p.depth<MAXD){ ADJ[p.b].forEach(to=>{ if(!p.visited.has(to)){ p.visited.add(to);
        S.pulses.push({a:p.b,b:to,t:0,dur:0.6,depth:p.depth+1,id:p.id,visited:new Set(p.visited)}); } }); }
      S.pulses.splice(i,1);
    }
  }
}

// 二次贝塞尔控制点（脉络弯曲）
function veinCtrl(a,b){ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L; const bow=Math.min(L*0.18, 36);
  return {cx:mx+nx*bow, cy:my+ny*bow}; }
function bez(a,c,b,t){ const u=1-t; return { x:u*u*a.x+2*u*t*c.cx+t*t*b.x, y:u*u*a.y+2*u*t*c.cy+t*t*b.y }; }

// ---- 渲染 ----
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  // 平移惯性 + 缩放弹簧
  S.pan.x += S.panV.x*dt*60*0.016; S.pan.y += S.panV.y*dt*60*0.016;
  S.panV.x*=0.9; S.panV.y*=0.9;
  S.zoom += (S.zoomTarget-S.zoom)*0.12;
  // 节点弹簧到目标（编排式：各自速度不同 → 错位抵达）
  NODES.forEach(n=>{ n.x += (n.tx-n.x)*n.spd; n.y += (n.ty-n.y)*n.spd;
    n.flash*=Math.pow(0.94, dt*60); n.scale += ((n.master?1.18:1.0)-n.scale)*0.15; });
  updatePulses(dt);
  // 自动演示
  if(S.demo && !S.drag){ S.demoT-=dt; if(S.demoT<=0){ S.demoT=1.8;
    const pick=NODES[Math.floor(Math.random()*NODES.length)]; sendPulse(pick.id); } }

  drawGL(now/1000);
  draw();
  requestAnimationFrame(frame);
}

function draw(){
  ctx.clearRect(0,0,S.W,S.H);
  ctx.save();
  ctx.translate(S.pan.x,S.pan.y); ctx.scale(S.zoom,S.zoom);

  // 脉络（先暗后亮脉冲）
  EDGES.forEach(([a,b])=>{
    const A=NODES.find(m=>m.id===a), B=NODES.find(m=>m.id===b); if(!A||!B) return;
    const c=veinCtrl(A,B);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(c.cx,c.cy,B.x,B.y);
    ctx.strokeStyle='rgba(120,110,92,0.22)'; ctx.lineWidth=1.4; ctx.stroke();
  });
  // 脉冲流光
  S.pulses.forEach(p=>{ const A=NODES.find(m=>m.id===p.a), B=NODES.find(m=>m.id===p.b); if(!A||!B)return;
    const c=veinCtrl(A,B);
    for(let s=0;s<=7;s++){ const t=Math.min(1,p.t*s/7); const pt=bez(A,c,B,t);
      const al=(1-s/7)*0.45; ctx.beginPath(); ctx.arc(pt.x,pt.y,2.4,0,7);
      ctx.fillStyle='rgba(19,133,122,'+al.toFixed(3)+')'; ctx.fill(); }
    const head=bez(A,c,B,Math.min(1,p.t));
    const g=ctx.createRadialGradient(head.x,head.y,0,head.x,head.y,9);
    g.addColorStop(0,'rgba(19,133,122,0.9)'); g.addColorStop(1,'rgba(19,133,122,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(head.x,head.y,9,0,7); ctx.fill();
  });

  // 节点
  NODES.forEach(n=>{
    const r=(n.hub?14:10)*n.scale;
    const base=GROUP_COL[n.g]||PAL.jade;
    // 光晕
    if(n.flash>0.02){ const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r+18);
      g.addColorStop(0,'rgba(19,133,122,'+(0.5*n.flash).toFixed(3)+')');
      g.addColorStop(1,'rgba(19,133,122,0)'); ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(n.x,n.y,r+18,0,7); ctx.fill(); }
    // 已通：深化 + 朱砂环
    if(n.master){ ctx.beginPath(); ctx.arc(n.x,n.y,r+5,0,7);
      ctx.strokeStyle='rgba(207,42,31,0.8)'; ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7);
    const col = n.master ? 'rgb('+Math.round(base[0]*90)+','+Math.round(base[1]*90)+','+Math.round(base[2]*90)+')' : 'rgb('+Math.round(base[0]*255)+','+Math.round(base[1]*255)+','+Math.round(base[2]*255)+')';
    ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=1.2; ctx.strokeStyle= n.hub?'rgba(35,35,43,0.6)':'rgba(255,255,255,0.7)'; ctx.stroke();
    // 标签
    ctx.fillStyle='rgba(35,35,43,0.92)'; ctx.font=(n.hub?'600 13px':'500 11px')+' "PingFang SC",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n.label, n.x, n.y + r + 11);
  });

  ctx.restore();
}

// ---- 交互 ----
stage.addEventListener('mousedown', e=>{ S.drag=true; S.last={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup', ()=>{ S.drag=false; });
stage.addEventListener('mousemove', e=>{
  const r=stage.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top;
  if(S.drag){ const dx=e.clientX-S.last.x, dy=e.clientY-S.last.y;
    S.userMoved=true;
    S.pan.x+=dx; S.pan.y+=dy; S.panV.x=dx; S.panV.y=dy; S.last={x:e.clientX,y:e.clientY}; return; }
  const n=nodeAt(sx,sy); S.hover=n;
  stage.style.cursor = n? 'pointer':'default';
  if(n && n._hover!==true){ n._hover=true; sendPulse(n.id); }
  if(!n){ NODES.forEach(m=>m._hover=false); }
});
stage.addEventListener('click', e=>{
  const r=stage.getBoundingClientRect(); const n=nodeAt(e.clientX-r.left, e.clientY-r.top);
  if(n){ if(S.master.has(n.id)) S.master.delete(n.id); else S.master.add(n.id);
    n.master=S.master.has(n.id); sendPulse(n.id); updateCount(); }
});
stage.addEventListener('wheel', e=>{ e.preventDefault();
  S.userMoved=true;
  const f=e.deltaY<0?1.1:0.9; S.zoomTarget=Math.max(0.5,Math.min(2.2,S.zoomTarget*f)); }, {passive:false});

// tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); setTab(t.dataset.tab);
}));
document.getElementById('demoBtn').addEventListener('click', e=>{ S.demo=!S.demo;
  e.target.classList.toggle('on',S.demo); e.target.textContent='演示 '+(S.demo?'开':'关'); });
document.getElementById('resetBtn').addEventListener('click', ()=>{ S.master.clear();
  NODES.forEach(n=>n.master=false); S.pan.x=0;S.pan.y=0;S.zoomTarget=1; updateCount(); });

function updateCount(){ document.getElementById('cnt').textContent=S.master.size;
  document.getElementById('tot').textContent=NODES.length; }

// ---- 启动（延迟到布局就绪后再测量，避免拿到 canvas 默认 300x150 尺寸） ----
function boot(){
  try{ resize(); initGL(); updateCount(); requestAnimationFrame(frame); }
  catch(e){ err('原型初始化失败：'+e.message); }
}
if(document.readyState==='complete') requestAnimationFrame(boot);
else window.addEventListener('load', ()=>requestAnimationFrame(boot));
</script>
</body>
</html>
