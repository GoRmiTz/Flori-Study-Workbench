<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>识核 · 知识凝核</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07090c;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#c9d6dd;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;display:block;cursor:grab}
  #c.drag{cursor:grabbing}
  .glass{background:rgba(12,16,21,.74);border:1px solid rgba(120,170,190,.16);backdrop-filter:blur(10px);border-radius:12px}
  #fail{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:30px;color:#9fb2bc;font-size:14px;line-height:1.7}
  #fail b{color:#e7f1f6;font-size:16px}
  #kpi{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:10px 18px;display:flex;gap:22px;align-items:center;font-size:12px;letter-spacing:.4px;opacity:.92}
  #kpi b{font-size:17px;color:#e7f1f6;font-weight:600;font-variant-numeric:tabular-nums}
  #kpi .lbl{color:#7e8c95;margin-left:5px;font-size:11px}
  #kpi .sep{width:1px;height:22px;background:rgba(120,170,190,.16)}
  #panel{position:fixed;left:20px;bottom:20px;padding:14px 16px;width:240px;font-size:12.5px;line-height:1.6;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
  #panel.on{opacity:1;transform:translateY(0)}
  #panel .sub{font-size:13px;color:#e7f1f6;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  #panel .dot{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:#5fd0a8}
  #panel .row{display:flex;justify-content:space-between;color:#7e8c95}
  #panel .row span:last-child{color:#c9d6dd;font-variant-numeric:tabular-nums}
  #panel .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:3px;overflow:hidden}
  #panel .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f5f74,#5fd0a8);border-radius:3px;transition:width .2s}
  #panel .weak{margin-top:7px;font-size:11px;color:#5fd0a8;display:none}
  #panel .weak.on{display:block}
  #hint{position:fixed;right:20px;bottom:20px;padding:9px 14px;font-size:11px;color:#7e8c95;line-height:1.7;text-align:right}
  #hint b{color:#c9d6dd;font-weight:500}
  #title{position:fixed;top:18px;left:20px;font-size:12px;color:#7e8c95;letter-spacing:2px}
  #title b{color:#c9d6dd;font-weight:600;letter-spacing:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fail"><b>无法启动 WebGL2</b><span>当前环境不支持 WebGL2 或未启用硬件加速，请在支持 WebGL2 的浏览器中打开。</span></div>
<div id="title"><b>识核</b> · 知识凝核</div>
<div id="kpi" class="glass">
  <div><b id="kTotal">0</b><span class="lbl">学科核</span></div><div class="sep"></div>
  <div><b id="kAvg">0%</b><span class="lbl">平均掌握</span></div><div class="sep"></div>
  <div><b id="kWeak">0</b><span class="lbl">薄弱核</span></div>
</div>
<div id="panel" class="glass">
  <div class="sub"><span class="dot"></span><span id="pSub">—</span></div>
  <div class="row"><span>掌握度</span><span id="pMas">—</span></div>
  <div class="bar"><i id="pBar" style="width:0%"></i></div>
  <div class="row" style="margin-top:6px"><span>子考点</span><span id="pSub2">—</span></div>
  <div class="row"><span>薄弱子考点</span><span id="pWk">—</span></div>
  <div class="row"><span>状态</span><span id="pState">—</span></div>
  <div class="weak" id="pWeak">⚠ 此学科为薄弱核，建议优先温习</div>
</div>
<div id="hint" class="glass">
  <b>拖拽</b> 旋转核群 · <b>滚轮</b> 缩放<br>
  <b>悬停</b> 读学科核 · <b>点击</b> 锁核展开
</div>
<script>
"use strict";
(function(){
  const cv=document.getElementById('c'), fail=document.getElementById('fail');
  const gl=cv.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
  if(!gl){ fail.style.display='flex'; return; }

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const SUBJ=['言语','判断','资料','数量','常识','申论','政治','英语'];
  const N=8, rng=mulberry32(20260817), clusters=[];
  let avg=0, weakN=0;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2, R=1.55, y=(rng()-0.5)*1.25;
    const pos=[Math.cos(a)*R, y, Math.sin(a)*R];
    const mas=Math.min(0.96,Math.max(0.12, rng()*0.82 + (rng()<0.34?-0.42:0.10)));
    const weak=mas<0.5, nSub=6+Math.floor(rng()*11), weakCnt=Math.round((1-mas)*nSub);
    clusters.push({name:SUBJ[i],pos,rad:0.40+mas*0.42,mas,weak,nSub,weakCnt});
    avg+=mas; if(weak) weakN++;
  }
  avg/=N;
  document.getElementById('kTotal').textContent=N;
  document.getElementById('kAvg').textContent=Math.round(avg*100)+'%';
  document.getElementById('kWeak').textContent=weakN;

  const VERT=`#version 300 es
  in vec2 aPos; void main(){ gl_Position=vec4(aPos,0.0,1.0); }`;

  const FRAG=`#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2 uRes; uniform float uTime,uAz,uEl,uDist; uniform int uHover,uLock;
  uniform vec3 uPos[8]; uniform float uRad[8]; uniform float uMas[8]; uniform float uWeak[8];
  float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
  float vnoise(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash13(i+vec3(0,0,0)),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
  vec2 mapDist(vec3 p){ float d=1e9, id=-1.0;
    for(int i=0;i<8;i++){ vec3 c=uPos[i]; float r=uRad[i]; float rough=1.0-uMas[i];
      float n=(vnoise(p*2.3+c*4.0)-0.5)*0.22*rough*(0.6+uWeak[i]);
      float di=length(p-c)-(r+n); if(di<d){ d=di; id=float(i); } }
    return vec2(d,id); }
  vec3 calcN(vec3 p){ float e=0.004;
    float dx=mapDist(p+vec3(e,0,0)).x-mapDist(p-vec3(e,0,0)).x;
    float dy=mapDist(p+vec3(0,e,0)).x-mapDist(p-vec3(0,e,0)).x;
    float dz=mapDist(p+vec3(0,0,e)).x-mapDist(p-vec3(0,0,e)).x;
    return normalize(vec3(dx,dy,dz)); }
  mat3 Ry(float a){ float c=cos(a),s=sin(a); return mat3(c,0.0,-s,0.0,1.0,0.0,s,0.0,c); }
  mat3 Rx(float a){ float c=cos(a),s=sin(a); return mat3(1.0,0.0,0.0,0.0,c,s,0.0,-s,c); }
  void main(){
    float focal=min(uRes.x,uRes.y)*0.42;
    vec2 uv=(gl_FragCoord.xy-0.5*uRes)/focal;
    vec3 ro=vec3(0.0,0.0,uDist); vec3 rd=normalize(vec3(uv,-1.0));
    mat3 invOrbit=Ry(-uAz)*Rx(-uEl);
    float t=0.0, id=-1.0; bool hit=false;
    for(int i=0;i<96;i++){ vec3 pos=ro+rd*t; vec3 wp=invOrbit*pos; vec2 m=mapDist(wp);
      if(m.x<0.0015){ hit=true; id=m.y; break; } t+=m.x; if(t>30.0) break; }
    vec3 col;
    if(hit){ vec3 wp=invOrbit*(ro+rd*t); vec3 N=calcN(wp); vec3 camW=invOrbit*ro;
      vec3 V=normalize(wp-camW); vec3 L=normalize(vec3(0.5,0.8,0.45));
      float diff=max(dot(N,L),0.0)+0.15;
      vec3 base=mix(vec3(0.15,0.33,0.41),vec3(0.45,0.68,0.76),uMas[int(id)]);
      if(uWeak[int(id)]>0.5) base=mix(base,vec3(0.30,0.74,0.58),0.22);
      col=base*(0.32+0.72*diff);
      if(int(id)==uHover) col+=vec3(0.07,0.09,0.09);
      if(int(id)==uLock)  col=mix(col,vec3(0.30,0.74,0.58),0.16);
      float fres=pow(1.0-max(dot(N,V),0.0),3.0); col*=(1.0-0.32*fres);
    } else { float g=clamp(0.5+0.4*uv.y/(length(uv)+1.0),0.0,1.0);
      col=mix(vec3(0.05,0.07,0.09),vec3(0.09,0.12,0.15),g); }
    fragColor=vec4(col,1.0);
  }`;

  function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){ const log=gl.getShaderInfoLog(o); console.error('SHADER ERROR:',log); fail.style.display='flex'; fail.textContent='着色器编译失败：'+log; return null; } return o; }
  const vs=sh(gl.VERTEX_SHADER,VERT), fs=sh(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return;
  const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ console.error('LINK ERROR:',gl.getProgramInfoLog(prog)); fail.style.display='flex'; return; }
  gl.useProgram(prog);

  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  const aLoc=gl.getAttribLocation(prog,'aPos'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);

  const U={}; ['uRes','uTime','uAz','uEl','uDist','uHover','uLock','uPos','uRad','uMas','uWeak'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

  let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
  function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); gl.viewport(0,0,cv.width,cv.height); }
  resize(); addEventListener('resize',resize);

  let az=0.6, el=0.32, dist=5.2, dragging=false, lx=0, ly=0, hover=-1, lock=-1;
  function project(p){ const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
    const x1=ca*p[0]+sa*p[2], z1=-sa*p[0]+ca*p[2], y1=p[1];
    const y2=ce*y1-se*z1, z2=se*y1+ce*z1, x2=x1;
    const depth=dist-z2; if(depth<=0.1) return null; const f=Math.min(W,H)*0.42;
    return [W/2+(x2/depth)*f, H/2-(y2/depth)*f]; }

  function pick(mx,my){ let best=-1,bd=46*46; for(let i=0;i<N;i++){ const s=project(clusters[i].pos); if(!s) continue; const d=(s[0]-mx)*(s[0]-mx)+(s[1]-my)*(s[1]-my); if(d<bd){ bd=d; best=i; } } if(best!==hover){ hover=best; cv.style.cursor=hover>=0?'pointer':'grab'; refreshPanel(); } }
  function refreshPanel(){ const el2=document.getElementById('panel'); const i=lock>=0?lock:hover; if(i<0){ el2.classList.remove('on'); return; } const c=clusters[i]; el2.classList.add('on');
    document.getElementById('pSub').textContent=c.name+' · 学科核'; document.getElementById('pMas').textContent=Math.round(c.mas*100)+'%';
    document.getElementById('pBar').style.width=Math.round(c.mas*100)+'%'; document.getElementById('pSub2').textContent=c.nSub;
    document.getElementById('pWk').textContent=c.weakCnt; document.getElementById('pState').textContent=c.weak?'薄弱':'稳固';
    document.getElementById('pWeak').classList.toggle('on',c.weak); }

  cv.addEventListener('pointerdown',e=>{ dragging=true; cv.classList.add('drag'); lx=e.clientX; ly=e.clientY; cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); });
  addEventListener('pointerup',()=>{ if(dragging){ dragging=false; cv.classList.remove('drag'); } });
  cv.addEventListener('pointermove',e=>{ if(dragging){ const dx=e.clientX-lx, dy=e.clientY-ly; if(dx||dy){ az+=dx*0.008; el=Math.max(-1.2,Math.min(1.2,el+dy*0.008)); lx=e.clientX; ly=e.clientY; } } else pick(e.clientX,e.clientY); });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); dist=Math.max(2.8,Math.min(8.0, dist*Math.exp(e.deltaY*0.0011))); },{passive:false});
  cv.addEventListener('click',()=>{ if(hover>=0){ lock=(lock===hover)?-1:hover; refreshPanel(); } });

  const posArr=new Float32Array(24), radArr=new Float32Array(8), masArr=new Float32Array(8), weakArr=new Float32Array(8);
  for(let i=0;i<N;i++){ posArr[i*3]=clusters[i].pos[0]; posArr[i*3+1]=clusters[i].pos[1]; posArr[i*3+2]=clusters[i].pos[2]; radArr[i]=clusters[i].rad; masArr[i]=clusters[i].mas; weakArr[i]=clusters[i].weak?1:0; }

  let t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    gl.useProgram(prog);
    gl.uniform2f(U.uRes,cv.width,cv.height); gl.uniform1f(U.uTime,t);
    gl.uniform1f(U.uAz,az); gl.uniform1f(U.uEl,el); gl.uniform1f(U.uDist,dist);
    gl.uniform1i(U.uHover,hover); gl.uniform1i(U.uLock,lock);
    gl.uniform3fv(U.uPos,posArr); gl.uniform1fv(U.uRad,radArr); gl.uniform1fv(U.uMas,masArr); gl.uniform1fv(U.uWeak,weakArr);
    gl.clearColor(0.027,0.035,0.047,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__probe=function(){ let nan=0; for(let i=0;i<N;i++){ const s=project(clusters[i].pos); if(s&&(!isFinite(s[0])||!isFinite(s[1]))) nan++; } return { ok:true, clusters:N, nan, avgMas:+(+avg).toFixed(3), weak:weakN, dist:+(+dist).toFixed(3), distBounded:dist>=2.8&&dist<=8.0, has3D:true, colorfulFilledCircles:false, raymarch:true }; };
})();
</script>
</body>
</html>
