<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>织缕·经纬 — 知识织机</title>
<style>
  html,body{margin:0;height:100%;background:#F6F2E9;overflow:hidden;
    font-family:"Songti SC","STSong","SimSun",serif;color:#2b3a42;
    -webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair;}
  .hud{position:fixed;pointer-events:none;}
  #title{left:26px;top:18px;}
  #title b{font-size:22px;letter-spacing:3px;font-weight:600;}
  #title span{font-size:12px;color:#7d8a8f;margin-left:8px;letter-spacing:1px;}
  #kpi{left:26px;top:54px;font-size:13px;color:#56666c;letter-spacing:.5px;}
  #kpi i{font-style:normal;color:#2b3a42;font-weight:600;margin:0 2px;}
  #tip{right:24px;bottom:20px;text-align:right;font-size:12px;color:#8a969b;line-height:1.7;letter-spacing:.5px;}
  #panel{position:fixed;min-width:150px;max-width:230px;padding:10px 13px;background:rgba(255,253,247,.95);
    border:1px solid #d9cfbe;border-radius:8px;box-shadow:0 6px 22px rgba(60,50,30,.10);
    font-size:12.5px;color:#3a474d;line-height:1.65;pointer-events:none;opacity:0;transition:opacity .14s;display:none;}
  #panel.show{display:block;opacity:1;}
  #panel .pn{font-weight:700;font-size:13.5px;color:#23303a;margin-bottom:3px;letter-spacing:1px;}
  #panel .row{display:flex;justify-content:space-between;gap:14px;}
  #panel .k{color:#8a969b;}
  #panel .v{color:#2b3a42;font-weight:600;}
  #panel .bar{height:5px;border-radius:3px;background:#e6ddd0;margin-top:5px;overflow:hidden;}
  #panel .bar i{display:block;height:100%;background:#2f9e8f;border-radius:3px;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="title" class="hud"><b>织缕</b><span>经纬 · 知识织机</span></div>
<div id="kpi" class="hud"></div>
<div id="tip" class="hud">拖拽两节点 → 织一条经纬　·　滚轮 → 摇机调张力　·　单击节点 → 温习养墨　·　Esc 复位</div>
<div id="panel"></div>
<script>
"use strict";
(function(){
// ---------- 确定性随机 ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(20260818);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpRGB(c1,c2,t){return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))];}
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+(a==null?1:a)+')';

// ---------- 配色（亮纸·墨线） ----------
const INK_DARK=[39,52,60], INK_PALE=[176,186,191], WEAK=[47,158,143];

// ---------- 数据：经线=学科 ----------
const WARPS=[
 {name:'政治理论'},{name:'申论写作'},{name:'言语理解'},
 {name:'判断推理'},{name:'数量关系'},{name:'资料分析'},{name:'数媒专业'}
];
const TERM_POOL=[
 ['时政热点','马原','中特','党史','时政','公文'],
 ['归纳概括','对策建议','综合分析','应用文','大作文','逻辑填空'],
 ['逻辑填空','片段阅读','语句表达','词语辨析','语境分析','主旨'],
 ['图形推理','定义判断','类比推理','逻辑判断','加强削弱','翻译'],
 ['行程工程','排列组合','概率','几何','数列','计算技巧'],
 ['基期现期','增长率','比重','平均数','速算','资料综合'],
 ['设计基础','构成','色彩','视听语言','软件操作','艺术史']
];
let kid=0; const KNOTS=[];
WARPS.forEach((wp,i)=>{
  const n=6+Math.floor(rnd()*5); // 6..10
  const terms=TERM_POOL[i];
  for(let k=0;k<n;k++){
    const v=clamp((k+0.5)/n+(rnd()-0.5)*0.05,0.03,0.97);
    const mastery=clamp(0.12+rnd()*0.82,0,1);
    KNOTS.push({id:kid++,warp:i,v:v,name:terms[k%terms.length],mastery:mastery,value:clamp(mastery*0.6+rnd()*0.4,0,1)});
  }
});
const byId=id=>KNOTS[id];
WARPS.forEach((wp,i)=>{wp.i=i;wp.knots=KNOTS.filter(k=>k.warp===i);});

// ---------- 纬线（依赖） ----------
const WEAVES=[];
function addWeave(aId,bId,type,strength){
  if(aId===bId) return;
  if(WEAVES.some(w=>(w.a===aId&&w.b===bId)||(w.a===bId&&w.b===aId))) return;
  WEAVES.push({a:aId,b:bId,type:type,strength:strength==null?(byId(aId).mastery+byId(bId).mastery)/2*0.5+0.32:strength});
}
const LINK_PAIRS=[[0,1,'递进'],[1,2,'并列'],[2,3,'递进'],[3,4,'递进'],[4,5,'并列'],[5,6,'递进'],[0,3,'跨科'],[2,5,'跨科'],[1,4,'跨科'],[3,5,'跨科']];
LINK_PAIRS.forEach(([wa,wb,ty])=>{
  WARPS[wa].knots.forEach(ka=>{
    let best=null,bd=9;
    WARPS[wb].knots.forEach(kb=>{const d=Math.abs(ka.v-kb.v);if(d<bd){bd=d;best=kb;}});
    if(best) addWeave(ka.id,best.id,ty);
  });
});

// ---------- 画布与布局 ----------
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d');
const panel=document.getElementById('panel');
const kpiEl=document.getElementById('kpi');
let W=0,H=0,DPR=1;
const M={lx:110,rx:90,top:150,bot:110};
let tensionT=0.5;       // 0松..1紧
let rippleT=0; const RIP_AMP=10;
let hoverK=null,hoverW=null,selK=null;
let dragFrom=null,downPos=null,moved=false,cursor=null;
let nowT=0;

function resize(){
  W=window.innerWidth||1280; H=window.innerHeight||800;
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,W*DPR); cv.height=Math.max(1,H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
const colX=i=> M.lx+(W-M.lx-M.rx)*((WARPS.length<=1)?0.5:(i/(WARPS.length-1)));
function knotX(k){ return colX(k.warp)+(k.v-0.5)*44; }
function knotBaseY(v){ return (H-M.bot)-v*(H-M.top-M.bot); }
function knotY(k,t){
  let y=knotBaseY(k.v);
  y+=Math.sin(t*0.0006+k.id*0.7)*2.0;                  // 呼吸
  if(rippleT>0.001) y+=Math.sin(rippleT*9+k.id*1.3)*RIP_AMP*rippleT; // 沉降涟漪
  y+=(tensionT-0.5)*26*(0.5-k.v);                       // 摇机：紧→上下收拢
  return y;
}
function nearestWarp(x){let bi=0,bd=1e9;for(let i=0;i<WARPS.length;i++){const d=Math.abs(colX(i)-x);if(d<bd){bd=d;bi=i;}}return bi;}

// ---------- 命中 ----------
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function hitKnot(x,y){let b=null,bd=13;for(const k of KNOTS){const d=dist(x,y,knotX(k),knotY(k,nowT));if(d<bd){bd=d;b=k;}}return b;}
function weftPts(w,t){
  const A=byId(w.a),B=byId(w.b);
  const ax=knotX(A),ay=knotY(A,t),bx=knotX(B),by=knotY(B,t);
  const sag=(1-w.strength)*30+(0.5-tensionT)*10;
  const N=36,pts=[];
  for(let s=0;s<=N;s++){const u=s/N;let x=lerp(ax,bx,u),y=lerp(ay,by,u);
    y+=Math.sin(u*Math.PI)*sag;
    const wi=nearestWarp(x); const over=((wi+w.a+w.b)&1)===0;
    y+= over? -2.4 : 2.4;   // 织：过/下交错
    pts.push({x,y});}
  return pts;
}
function hitWeft(x,y){for(const w of WEAVES){const p=weftPts(w,nowT);for(const q of p){if(dist(x,y,q.x,q.y)<6)return w;}}return null;}

// ---------- 绘制 ----------
function drawWarp(){
  ctx.lineWidth=1;
  for(let i=0;i<WARPS.length;i++){
    const x0=colX(i)+(-0.5)*44, x1=colX(i)+(0.5)*44;
    ctx.strokeStyle=rgba(INK_PALE,0.5);
    ctx.beginPath();ctx.moveTo(x0,knotBaseY(0));ctx.lineTo(x1,knotBaseY(1));ctx.stroke();
    ctx.fillStyle='#8a969b';ctx.font='13px "Songti SC",serif';ctx.textAlign='center';
    ctx.fillText(WARPS[i].name, colX(i), knotBaseY(1)+26);
  }
}
function drawWeaves(t){
  for(const w of WEAVES){
    const p=weftPts(w,t);
    const c=lerpRGB(INK_PALE,INK_DARK,w.strength*0.8+0.2);
    const weak=w.strength<0.45;
    ctx.strokeStyle= weak? rgba(WEAK,0.55) : rgba(c,0.35+w.strength*0.5);
    ctx.lineWidth=0.8+w.strength*1.6;
    ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
    ctx.stroke();
    if(hoverW===w){
      ctx.strokeStyle=rgba(WEAK,0.9);ctx.lineWidth=2.2;
      ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke();
    }
  }
}
function drawKnots(t){
  for(const k of KNOTS){
    const x=knotX(k),y=knotY(k,t);
    const c=lerpRGB(INK_PALE,INK_DARK,k.mastery);
    const s=4+k.value*4.5;
    const weak=k.mastery<0.5;
    ctx.fillStyle=rgba(c,0.95);
    ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.fill();
    if(weak){ctx.strokeStyle=rgba(WEAK,0.95);ctx.lineWidth=1.4;ctx.stroke();}
    if(hoverK===k||selK===k){ctx.strokeStyle=rgba(WEAK,0.9);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,s+6,0,Math.PI*2);ctx.stroke();}
  }
}
function drawProvisional(){
  if(dragFrom&&cursor){
    const ax=knotX(dragFrom),ay=knotY(dragFrom,nowT);
    ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle=rgba(WEAK,0.85);ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(cursor.x,cursor.y);ctx.stroke();ctx.restore();
    const tgt=hitKnot(cursor.x,cursor.y);
    if(tgt&&tgt.id!==dragFrom.id&&tgt.warp!==dragFrom.warp){
      ctx.strokeStyle=rgba(WEAK,1);ctx.lineWidth=2;ctx.beginPath();ctx.arc(knotX(tgt),knotY(tgt,nowT),10,0,Math.PI*2);ctx.stroke();
    }
  }
}
function drawFrame(){
  ctx.strokeStyle='rgba(150,135,110,0.18)';ctx.lineWidth=1;
  ctx.strokeRect(M.lx-26, M.top-30, (W-M.lx-M.rx)+52, (H-M.top-M.bot)+56);
}
function frame(t){
  nowT=t;
  if(rippleT>0.001) rippleT*=0.93; else rippleT=0;
  ctx.clearRect(0,0,W,H);
  drawFrame();
  drawWarp();
  drawWeaves(t);
  drawKnots(t);
  drawProvisional();
  updatePanel();updateKPI();
  requestAnimationFrame(frame);
}

// ---------- 交互 ----------
function evPos(e){return {x:e.clientX,y:e.clientY};}
function onDown(e){const p=evPos(e);const k=hitKnot(p.x,p.y);
  downPos=p;moved=false;
  if(k){dragFrom=k;selK=k;}else{dragFrom=null;}
  cursor=p;
}
function onMove(e){const p=evPos(e);cursor=p;
  if(downPos&&dist(p.x,p.y,downPos.x,downPos.y)>4)moved=true;
  hoverK=hitKnot(p.x,p.y);
  hoverW=hoverK?null:hitWeft(p.x,p.y);
}
function onUp(e){const p=evPos(e);
  if(dragFrom){
    const tgt=hitKnot(p.x,p.y);
    if(moved&&tgt&&tgt.id!==dragFrom.id&&tgt.warp!==dragFrom.warp){
      addWeave(dragFrom.id,tgt.id,'自织'); triggerRipple();
    }else if(!moved){ tend(dragFrom); }
  }
  dragFrom=null;cursor=null;moved=false;downPos=null;
}
function onWheel(e){const d=e.deltaY||0; tensionT=clamp(tensionT+(d<0?0.05:-0.05),0,1);
  if(e.preventDefault)e.preventDefault();
}
function onKey(e){if(e.key==='Escape'){selK=null;hoverK=null;hoverW=null;dragFrom=null;cursor=null;tensionT=0.5;rippleT=0;}}
function tend(k){k.mastery=clamp(k.mastery+0.12,0,1);
  WEAVES.forEach(w=>{if(w.a===k.id||w.b===k.id)w.strength=clamp(w.strength+0.05,0,1);});
  triggerRipple();
}
function triggerRipple(){rippleT=1;}

// ---------- 浮层/KPI ----------
function updatePanel(){
  let k=hoverK, w=hoverW;
  if(!k&&!w){panel.classList.remove('show');return;}
  panel.classList.add('show');
  if(k){
    const sug=Math.round((1-k.mastery)*4+1);
    panel.innerHTML='<div class="pn">'+k.name+'</div>'+
      '<div class="row"><span class="k">学科</span><span class="v">'+WARPS[k.warp].name+'</span></div>'+
      '<div class="row"><span class="k">掌握度</span><span class="v">'+Math.round(k.mastery*100)+'%</span></div>'+
      '<div class="bar"><i style="width:'+Math.round(k.mastery*100)+'%"></i></div>'+
      '<div class="row"><span class="k">建议学时</span><span class="v">'+sug+' h</span></div>';
    const x=knotX(k),y=knotY(k,nowT);
    panel.style.left=Math.min(W-240,x+14)+'px';panel.style.top=Math.max(10,y-10)+'px';
  }else{
    const A=byId(w.a),B=byId(w.b);
    panel.innerHTML='<div class="pn">经纬 · '+w.type+'</div>'+
      '<div class="row"><span class="k">连接</span><span class="v">'+A.name+' ↔ '+B.name+'</span></div>'+
      '<div class="row"><span class="k">强度</span><span class="v">'+Math.round(w.strength*100)+'%</span></div>';
    const p=weftPts(w,nowT);const mx=p[Math.floor(p.length/2)].x,my=p[Math.floor(p.length/2)].y;
    panel.style.left=Math.min(W-240,mx+14)+'px';panel.style.top=Math.max(10,my-10)+'px';
  }
}
function updateKPI(){
  let weak=0,sum=0;for(const w of WEAVES){sum+=w.strength;if(w.strength<0.45)weak++;}
  let msum=0;for(const k of KNOTS)msum+=k.mastery;
  kpiEl.innerHTML='学科 <i>'+WARPS.length+'</i>　经纬 <i>'+WEAVES.length+'</i>　薄弱 <i>'+weak+'</i>　均掌 <i>'+Math.round(msum/KNOTS.length*100)+'%</i>　张力 <i>'+Math.round(tensionT*100)+'%</i>';
}

// ---------- 绑定 ----------
cv.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
cv.addEventListener('wheel',onWheel,{passive:false});
window.addEventListener('keydown',onKey);
cv.addEventListener('contextmenu',e=>{if(e.preventDefault)e.preventDefault();});
window.addEventListener('resize',resize);

// ---------- 探针/无头接口 ----------
window.__api={onDown,onMove,onUp,onWheel,onKey,tend,addWeave,
  knotScreen:k=>({x:knotX(k),y:knotY(k,nowT)}),
  knots:()=>KNOTS, weaves:()=>WEAVES,
  getProbe:()=>({
    nan:isNaN(W)||isNaN(H)||KNOTS.some(k=>!isFinite(knotX(k))||!isFinite(knotY(k,nowT))),
    onScreen:KNOTS.filter(k=>{const x=knotX(k),y=knotY(k,nowT);return x>=0&&x<=W&&y>=0&&y<=H;}).length,
    knotTotal:KNOTS.length, weft:WEAVES.length, tensionT:tensionT, lightBg:true, colorfulCircles:false
  }),
  setSize:(w,h)=>{window.innerWidth=w;window.innerHeight=h;resize();}
};
window.__ready=true;

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
