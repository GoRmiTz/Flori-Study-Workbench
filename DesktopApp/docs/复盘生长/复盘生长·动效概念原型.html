<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>复盘 · 生长 — 复习生长年轮概念原型 v1</title>
<style>
  :root{
    --ink:#0E1418; --ink2:#070B0D;
    --paper:#E7E2D4; --muted:#7E8A86;
    --kg:#C8553D;  --ky:#3FB6A8;  --sy:#E8C16C;
    --gold:#E8C16C; --cold:#5FB8E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink2);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--paper);
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;}
  #stage{position:fixed;inset:0;background:#070B0D;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}

  #top{position:absolute;top:26px;left:30px;right:30px;display:flex;align-items:center;
    justify-content:space-between;pointer-events:none;z-index:5;}
  #brand{display:flex;align-items:baseline;gap:12px;}
  #brand .l{font-size:20px;letter-spacing:.32em;color:#DCE7E0;font-weight:600;}
  #brand .t{font-size:13px;letter-spacing:.14em;color:var(--muted);}
  #top .meta{font-size:12px;letter-spacing:.1em;color:var(--muted);}

  #panel{position:absolute;top:78px;right:30px;width:288px;z-index:6;
    background:rgba(10,16,18,.62);border:1px solid rgba(150,180,170,.14);
    border-radius:14px;padding:18px 20px;backdrop-filter:blur(8px);
    box-shadow:0 12px 40px rgba(0,0,0,.4);}
  #panel h2{margin:0 0 2px;font-size:15px;letter-spacing:.08em;color:#EAF1EC;font-weight:600;}
  #panel .sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:14px;min-height:15px;}
  .stat{display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;border-top:1px solid rgba(150,180,170,.08);}
  .stat .k{font-size:12.5px;color:#AEB9B4;letter-spacing:.04em;}
  .stat .v{font-size:15px;color:#E8C16C;font-weight:600;}
  .stat .v.cold{color:#7FD0F0;}
  #weak{margin-top:12px;}
  #weak .ttl{font-size:11.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:7px;}
  #weak .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C7D2CC;padding:3px 0;}
  #weak .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);flex:1;overflow:hidden;}
  #weak .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#5FB8E8,#C8553D);}
  #reviewBtn{margin-top:16px;width:100%;cursor:pointer;border:1px solid rgba(150,180,170,.28);
    background:linear-gradient(180deg,rgba(232,193,108,.18),rgba(232,193,108,.06));
    color:#F0E2BC;border-radius:10px;padding:10px;font-size:13px;letter-spacing:.1em;
    font-family:inherit;transition:.18s;}
  #reviewBtn:hover{color:#FFF; border-color:rgba(232,193,108,.6);}

  #legend{position:absolute;top:50%;left:34px;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;z-index:5;pointer-events:none;}
  #legend .it{display:flex;align-items:center;gap:9px;font-size:12px;color:#AEB9B4;letter-spacing:.08em;}
  #legend .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor;}

  #hud{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;z-index:5;
    background:rgba(12,18,20,.55);border:1px solid rgba(150,165,160,.12);
    padding:10px 18px;border-radius:999px;backdrop-filter:blur(6px);
    font-size:12.5px;letter-spacing:.06em;color:#C7D2CC;max-width:92vw;flex-wrap:wrap;justify-content:center;}
  #hud b{color:#EAF1EC;font-weight:600;}
  #hud .sep{width:1px;height:14px;background:rgba(150,165,160,.2);}
  #hud .hint{color:var(--muted);}

  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:#ff9a8a;font-size:15px;letter-spacing:.06em;text-align:center;padding:40px;line-height:1.7;z-index:10;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>

  <div id="top">
    <div id="brand"><span class="l">芙洛理</span><span class="t">复盘 · 生长</span></div>
    <div class="meta">努力随时间复利 · 一眼看见坚持</div>
  </div>

  <div id="legend">
    <div class="it"><span class="dot" style="color:var(--kg);background:var(--kg)"></span>考公考点</div>
    <div class="it"><span class="dot" style="color:var(--ky);background:var(--ky)"></span>考研考点</div>
    <div class="it"><span class="dot" style="color:var(--sy);background:var(--sy)"></span>事业考点</div>
    <div class="it"><span class="dot" style="color:var(--cold);background:var(--cold)"></span>薄弱预警</div>
  </div>

  <div id="panel">
    <h2>今日复盘</h2>
    <div class="sub" id="pdate">2026-08-16 · 周日</div>
    <div class="stat"><span class="k">连续打卡</span><span class="v" id="sStreak">—</span></div>
    <div class="stat"><span class="k">今日专注</span><span class="v" id="sFocus">—</span></div>
    <div class="stat"><span class="k">收集考点</span><span class="v" id="sPts">—</span></div>
    <div class="stat"><span class="k">模考正确率</span><span class="v cold" id="sAcc">—</span></div>
    <div class="stat"><span class="k">距国考</span><span class="v" id="sGap">—</span></div>
    <div id="weak">
      <div class="ttl">薄弱科目（模考偏低 · 冷光预警）</div>
      <div id="weakList"></div>
    </div>
    <button id="reviewBtn">标记今日已复盘 ✓</button>
  </div>

  <div id="hud">
    <span>悬停某圈 → 看当天复盘</span>
    <span class="sep"></span>
    <span class="hint">年轮=每天投入 · 冷光裂痕=薄弱科目 · 漂浮光点=你收集的考点</span>
  </div>

  <div id="fallback">当前环境不支持 WebGL，无法呈现「复盘·生长」动效原型。<br>请在 Chrome / Edge 中打开本文件。</div>
</div>

<script>
(function(){
  "use strict";
  const fbEl=document.getElementById('fallback');
  function showErr(s){ if(fbEl){ fbEl.style.display='flex'; fbEl.innerHTML=s; } }
  window.addEventListener('error', e=>{ showErr('脚本异常：'+(e.message||e.error||e)); });
  window.addEventListener('unhandledrejection', e=>{ showErr('异步异常：'+(e.reason&&e.reason.message||e.reason)); });
  const canvas = document.getElementById('gl');
  function acquireGL(){ return canvas.getContext('webgl',{antialias:true,alpha:false,premultipliedAlpha:false}) || canvas.getContext('experimental-webgl',{antialias:true,alpha:false,premultipliedAlpha:false}); }
  function main(gl){

  /* ===== 真实复习数据模型（芙洛理 F-D1 专注 / F-D5 收集考点 / 练考正确率 / F-D7 每日复盘） =====
     年轮 = 每一天（取最近 28 天 = 4 周）。每圈饱满度 = 当天投入；薄弱标记 = 模考/日练正确率偏低。
     漂浮光点 = 拖拽收集的考点（F-D5）。落地时由 复盘引擎(ReviewEngine) 真实喂入。 */
  const DAYS = 28, SEG = 120, TAU = 6.2831853;
  const R0 = 0.08, STEP = 0.0165, RW = 0.008;
  const COL = [[0.784,0.333,0.239],[0.247,0.714,0.659],[0.910,0.757,0.424]];
  let _s = 20260816;
  function rnd(){ _s = (_s*1103515245 + 12345) & 0x7fffffff; return _s/0x7fffffff; }

  const dayFill=[], dayWeak=[], dayAcc=[], dayPts=[], dayFocus=[];
  const subjects=['行测','申论','时政','常识','政治','英语','专业课','数学','公基','职测'];
  for(let d=0; d<DAYS; d++){
    const recency = d/(DAYS-1);
    const fill = Math.min(1, 0.28 + recency*0.55 + (rnd()-0.5)*0.34);
    const acc  = Math.round((0.45 + recency*0.32 + (rnd()-0.5)*0.30)*100);
    dayFill.push(fill); dayWeak.push(acc<58?1:0); dayAcc.push(acc);
    dayPts.push(Math.round(fill*9 + rnd()*4));
    dayFocus.push(Math.round(fill*95 + rnd()*30));
  }
  const TODAY = DAYS-1;
  dayFill[TODAY]=0.42; dayWeak[TODAY]=(dayAcc[TODAY]<58)?1:0;

  const weakSubjects=[];
  for(let i=0;i<subjects.length;i++){
    const acc=Math.round((0.40+rnd()*0.45)*100);
    if(acc<60) weakSubjects.push({name:subjects[i], acc});
  }
  weakSubjects.sort((a,b)=>a.acc-b.acc);

  /* ===== 几何：生长年轮（实心环带 TRIANGLES） ===== */
  const rPos=[],rDay=[],rFill=[],rWeak=[],rAng=[],rEdge=[];
  function pushRing(x,y,day,fill,weak,ang,edge){
    rPos.push(x,y); rDay.push(day); rFill.push(fill); rWeak.push(weak); rAng.push(ang); rEdge.push(edge);
  }
  for(let d=0; d<DAYS; d++){
    const r=R0+d*STEP, fill=dayFill[d], weak=dayWeak[d];
    for(let s=0;s<SEG;s++){
      const a0=s/SEG*TAU, a1=(s+1)/SEG*TAU;
      const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
      pushRing(c0*(r-RW),s0*(r-RW), d,fill,weak,a0,0);
      pushRing(c0*(r+RW),s0*(r+RW), d,fill,weak,a0,1);
      pushRing(c1*(r-RW),s1*(r-RW), d,fill,weak,a1,0);
      pushRing(c1*(r-RW),s1*(r-RW), d,fill,weak,a1,0);
      pushRing(c0*(r+RW),s0*(r+RW), d,fill,weak,a0,1);
      pushRing(c1*(r+RW),s1*(r+RW), d,fill,weak,a1,1);
    }
  }
  const RN = rPos.length/2;

  /* ===== 几何：漂浮考点光点（POINTS）+ 中心核心（连续打卡） ===== */
  const mCat=[],mAng0=[],mRad=[],mSpeed=[],mPhase=[],mSize=[],mInten=[];
  const MOTES = 52;
  for(let i=0;i<MOTES;i++){
    const cat=Math.floor(rnd()*3);
    const rad=R0+0.02 + rnd()*(R0+(DAYS-1)*STEP - R0 - 0.04);
    const speed=(0.04+rnd()*0.16)*(rnd()<0.5?-1:1);
    mCat.push(cat); mAng0.push(rnd()*TAU); mRad.push(rad); mSpeed.push(speed);
    mPhase.push(rnd()*TAU); mSize.push(7+rnd()*9); mInten.push(0.6+rnd()*0.4);
  }
  // 核心节点（连续打卡）：rad=0，最后绘制
  mCat.push(1); mAng0.push(0); mRad.push(0); mSpeed.push(0); mPhase.push(0);
  mSize.push(40); mInten.push(1.7);

  /* ===== 着色器 ===== */
  const RINGCOUNT = DAYS;
  const VS = `
    attribute vec2 aPos; attribute float aDay; attribute float aFill; attribute float aWeak;
    attribute float aAng; attribute float aEdge;
    uniform float uTime, uHoverDay, uHoverOn, uGrow, uAspect;
    varying float vGlow; varying vec3 vCol; varying float vEdge; varying float vWeak;
    void main(){
      gl_Position = vec4(aPos.x, aPos.y*uAspect, 0.0, 1.0);
      vEdge=aEdge; vWeak=aWeak;
      float fill = aFill;
      // 今日圈（最外）生长：未扫到的角度先压暗
      if(abs(aDay-((${RINGCOUNT.toFixed(1)})-1.0))<0.5){
        float swept = step(aAng, uGrow*6.28318);
        fill = fill * swept;
      }
      float glow = 0.16 + fill*0.62;
      if(uHoverOn>0.5 && abs(aDay-uHoverDay)<0.5){
        float pulse = max(sin(aAng*7.0 - uTime*3.2),0.0);
        glow += 0.55 + 0.45*pulse;
      }
      glow += 0.04*sin(uTime*1.4 + aDay*0.6);
      vec3 warm = vec3(0.93,0.76,0.40);
      vec3 cool = vec3(0.37,0.72,0.95);
      vec3 col = mix(warm, cool, aWeak*0.85);
      col = mix(col, cool, aWeak*0.6*(0.5+0.5*sin(uTime*3.0 + aDay)));
      vCol = col; vGlow = glow;
    }`;
  const FS = `
    precision mediump float;
    varying float vGlow; varying vec3 vCol; varying float vEdge; varying float vWeak;
    void main(){
      float band = 1.0 - abs(vEdge-0.5)*2.0;
      band = clamp(band,0.0,1.0);
      float g = vGlow * (0.35 + 0.65*band);
      gl_FragColor = vec4(vCol*g, clamp(g,0.0,1.0));
    }`;

  const MVS = `
    attribute float aCat; attribute float aAng0; attribute float aRad;
    attribute float aSpeed; attribute float aPhase; attribute float aSize; attribute float aInten;
    uniform float uTime, uDpr, uStreak, uAspect;
    varying vec3 vCol; varying float vInten;
    const vec3 C0=vec3(0.784,0.333,0.239);
    const vec3 C1=vec3(0.247,0.714,0.659);
    const vec3 C2=vec3(0.910,0.757,0.424);
    void main(){
      float ang = aAng0 + uTime*aSpeed;
      float r = (aRad<0.001)? 0.0 : (aRad + 0.02*sin(uTime*0.7 + aPhase));
      vec2 p = vec2(cos(ang),sin(ang))*r;
      gl_Position = vec4(p.x, p.y*uAspect, 0.0, 1.0);
      float core = (aRad<0.001)? (1.0+0.10*sin(uTime*2.0))*(0.9+0.10*min(uStreak,30.0)/30.0) : 1.0;
      gl_PointSize = aSize * uDpr * core;
      vCol = (aCat<0.5)?C0:(aCat<1.5)?C1:C2;
      vInten = aInten;
    }`;
  const MFS = `
    precision mediump float;
    varying vec3 vCol; varying float vInten;
    void main(){
      float d=length(gl_PointCoord-vec2(0.5))*2.0;
      if(d>1.0) discard;
      float core=smoothstep(1.0,0.0,d);
      float ring=smoothstep(0.72,0.80,d)-smoothstep(0.84,0.92,d);
      vec3 col=vCol*(vInten*core + ring*1.0);
      gl_FragColor=vec4(col, clamp(vInten*0.5+core,0.0,1.0));
    }`;
  const QVS = `
    attribute vec2 aPos; varying vec2 vUv;
    void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }`;
  const BLURFS = `
    precision mediump float;
    varying vec2 vUv; uniform sampler2D uTex; uniform vec2 uTexel; uniform vec2 uDir;
    vec3 bright(vec3 c){ return max(c-vec3(0.10),vec3(0.0)); }
    void main(){
      vec2 o=uTexel*uDir;
      vec3 a=bright(texture2D(uTex,vUv).rgb)*0.2270270270;
      a+=bright(texture2D(uTex,vUv+o*1.0).rgb)*0.1945945946;
      a+=bright(texture2D(uTex,vUv-o*1.0).rgb)*0.1945945946;
      a+=bright(texture2D(uTex,vUv+o*2.0).rgb)*0.1216216216;
      a+=bright(texture2D(uTex,vUv-o*2.0).rgb)*0.1216216216;
      a+=bright(texture2D(uTex,vUv+o*3.0).rgb)*0.0540540541;
      a+=bright(texture2D(uTex,vUv-o*3.0).rgb)*0.0540540541;
      a+=bright(texture2D(uTex,vUv+o*4.0).rgb)*0.0162162162;
      a+=bright(texture2D(uTex,vUv-o*4.0).rgb)*0.0162162162;
      gl_FragColor=vec4(a,1.0);
    }`;
  const COMPFS = `
    precision mediump float;
    varying vec2 vUv; uniform sampler2D uScene; uniform sampler2D uBloom; uniform float uStrength;
    void main(){
      vec3 s=texture2D(uScene,vUv).rgb;
      vec3 b=texture2D(uBloom,vUv).rgb;
      vec3 col=s + b*uStrength;
      vec2 d=vUv-0.5;
      float vig=1.0 - smoothstep(0.35,0.95,length(d)*1.25);
      col*=mix(0.74,1.0,vig);
      gl_FragColor=vec4(col,1.0);
    }`;

  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
    gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }

  let ringP,moteP,quadP,blurP,compP,locR,locM,locQ,locBlur,locComp;
  let bloom=false, scene=null, blurA=null, blurB=null;
  try{
    ringP=prog(VS,FS); moteP=prog(MVS,MFS); quadP=prog(QVS,BLURFS); blurP=quadP; compP=prog(QVS,COMPFS);
  }catch(e){ fbEl.style.display='flex'; fbEl.textContent='着色器编译失败：'+e.message; return; }

  locR={ aPos:gl.getAttribLocation(ringP,'aPos'), aDay:gl.getAttribLocation(ringP,'aDay'),
    aFill:gl.getAttribLocation(ringP,'aFill'), aWeak:gl.getAttribLocation(ringP,'aWeak'),
    aAng:gl.getAttribLocation(ringP,'aAng'), aEdge:gl.getAttribLocation(ringP,'aEdge'),
    uTime:gl.getUniformLocation(ringP,'uTime'), uHoverDay:gl.getUniformLocation(ringP,'uHoverDay'),
    uHoverOn:gl.getUniformLocation(ringP,'uHoverOn'), uGrow:gl.getUniformLocation(ringP,'uGrow'),
    uAspect:gl.getUniformLocation(ringP,'uAspect') };
  locM={ aCat:gl.getAttribLocation(moteP,'aCat'), aAng0:gl.getAttribLocation(moteP,'aAng0'),
    aRad:gl.getAttribLocation(moteP,'aRad'), aSpeed:gl.getAttribLocation(moteP,'aSpeed'),
    aPhase:gl.getAttribLocation(moteP,'aPhase'), aSize:gl.getAttribLocation(moteP,'aSize'),
    aInten:gl.getAttribLocation(moteP,'aInten'),
    uTime:gl.getUniformLocation(moteP,'uTime'), uDpr:gl.getUniformLocation(moteP,'uDpr'),
    uStreak:gl.getUniformLocation(moteP,'uStreak'), uAspect:gl.getUniformLocation(moteP,'uAspect') };
  locQ={ aPos:gl.getAttribLocation(quadP,'aPos') };
  locBlur={ uTex:gl.getUniformLocation(blurP,'uTex'), uTexel:gl.getUniformLocation(blurP,'uTexel'), uDir:gl.getUniformLocation(blurP,'uDir') };
  locComp={ uScene:gl.getUniformLocation(compP,'uScene'), uBloom:gl.getUniformLocation(compP,'uBloom'), uStrength:gl.getUniformLocation(compP,'uStrength'), aPos:gl.getAttribLocation(compP,'aPos') };

  function mkBuf(arr,usage){ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),usage||gl.STATIC_DRAW); return {b,size:1}; }
  const rPosBuf=mkBuf(rPos), rDayBuf=mkBuf(rDay), rFillBuf=mkBuf(rFill), rWeakBuf=mkBuf(rWeak),
        rAngBuf=mkBuf(rAng), rEdgeBuf=mkBuf(rEdge);
  const mCatBuf=mkBuf(mCat), mAngBuf=mkBuf(mAng0), mRadBuf=mkBuf(mRad),
        mSpeedBuf=mkBuf(mSpeed), mPhaseBuf=mkBuf(mPhase), mSizeBuf=mkBuf(mSize), mIntenBuf=mkBuf(mInten);
  const quadBuf=mkBuf([-1,-1, 1,-1, -1,1, 1,1]);

  /* ===== FBO（bloom 后处理，带降级） ===== */
  function makeTarget(w,h){
    try{
      const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
      const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      return {tex,fbo,ok,w,h};
    }catch(e){ return {tex:null,fbo:null,ok:false,w,h}; }
  }
  function initBloom(w,h){
    const bw=Math.max(2,Math.floor(w/2)), bh=Math.max(2,Math.floor(h/2));
    if(scene){ gl.deleteTexture(scene.tex); gl.deleteFramebuffer(scene.fbo); }
    if(blurA){ gl.deleteTexture(blurA.tex); gl.deleteFramebuffer(blurA.fbo); }
    if(blurB){ gl.deleteTexture(blurB.tex); gl.deleteFramebuffer(blurB.fbo); }
    scene=makeTarget(w,h); blurA=makeTarget(bw,bh); blurB=makeTarget(bw,bh);
    bloom = scene.ok && blurA.ok && blurB.ok;
  }

  /* ===== 尺寸 ===== */
  let dpr=1, cssW=1, cssH=1, aspect=1;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    cssW=canvas.clientWidth||window.innerWidth; cssH=canvas.clientHeight||window.innerHeight;
    canvas.width=Math.max(2,Math.floor(cssW*dpr)); canvas.height=Math.max(2,Math.floor(cssH*dpr));
    aspect = cssW / cssH;
    try{ initBloom(canvas.width,canvas.height); }catch(e){ bloom=false; }
  }
  window.addEventListener('resize',resize);

  /* ===== 交互 ===== */
  let hoverDay=-1, grow=0, growStart=0, streak=12, reviewedToday=false;
  function ndcFromEvent(e){ const r=canvas.getBoundingClientRect();
    return { x:((e.clientX-r.left)/cssW)*2-1, y:1-((e.clientY-r.top)/cssH)*2 }; }
  function dayAt(ndc){
    const rad=Math.hypot(ndc.x,ndc.y);
    const d=Math.round((rad-R0)/STEP);
    if(d<0||d>DAYS-1) return -1;
    if(Math.abs(rad-(R0+d*STEP))>RW*2.4) return -1;
    return d;
  }
  canvas.addEventListener('pointermove',e=>{
    const p=ndcFromEvent(e); const d=dayAt(p);
    if(d!==hoverDay){ hoverDay=d; updatePanelDay(d); canvas.style.cursor=d>=0?'pointer':'crosshair'; }
  });
  canvas.addEventListener('pointerleave',()=>{ hoverDay=-1; updatePanelDay(-1); });
  document.getElementById('reviewBtn').addEventListener('click',()=>{
    if(reviewedToday) return; reviewedToday=true;
    dayFill[TODAY]=Math.min(1, dayFill[TODAY]+0.4);
    if(dayAcc[TODAY]<58) dayWeak[TODAY]=0;
    streak++; growStart=performance.now()/1000; grow=0; // 今日圈重新"生长"一圈辉光
    updatePanel();
    const btn=document.getElementById('reviewBtn'); btn.textContent='今日已复盘 ✓'; btn.style.opacity=.6;
  });

  /* ===== 面板（mock 真实复盘 UI：F-D7 本地复盘 + 每日21:00 nudge） ===== */
  function updatePanelDay(d){
    const sub=document.getElementById('pdate');
    if(d>=0){
      sub.textContent = `第 ${d+1} 天 · 专注 ${dayFocus[d]}分 · 收集 ${dayPts[d]} 点 · 正确率 ${dayAcc[d]}%`
        + (dayWeak[d]?' · 薄弱':'');
    } else { sub.textContent='2026-08-16 · 周日'; }
  }
  function updatePanel(){
    document.getElementById('sStreak').textContent = streak+' 天';
    document.getElementById('sFocus').textContent  = dayFocus[TODAY]+' 分';
    document.getElementById('sPts').textContent    = dayPts[TODAY]+' 点';
    document.getElementById('sAcc').textContent   = dayAcc[TODAY]+'%';
    document.getElementById('sGap').textContent   = '105 天';
    const wl=document.getElementById('weakList'); wl.innerHTML='';
    if(weakSubjects.length===0){ wl.innerHTML='<div class="row">暂无 · 继续保持</div>'; }
    weakSubjects.slice(0,4).forEach(w=>{
      const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<span style="width:54px">${w.name}</span>
        <span class="bar"><i style="width:${w.acc}%"></i></span>
        <span style="color:#7FD0F0;width:34px;text-align:right">${w.acc}%</span>`;
      wl.appendChild(row);
    });
  }

  /* ===== 绘制 ===== */
  function drawRings(now){
    gl.useProgram(ringP);
    gl.uniform1f(locR.uTime,now);
    gl.uniform1f(locR.uHoverDay,hoverDay);
    gl.uniform1f(locR.uHoverOn, hoverDay>=0?1:0);
    gl.uniform1f(locR.uGrow, grow);
    gl.uniform1f(locR.uAspect, aspect);
    gl.bindBuffer(gl.ARRAY_BUFFER,rPosBuf.b);  gl.enableVertexAttribArray(locR.aPos);  gl.vertexAttribPointer(locR.aPos,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,rDayBuf.b);  gl.enableVertexAttribArray(locR.aDay);  gl.vertexAttribPointer(locR.aDay,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,rFillBuf.b); gl.enableVertexAttribArray(locR.aFill); gl.vertexAttribPointer(locR.aFill,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,rWeakBuf.b); gl.enableVertexAttribArray(locR.aWeak); gl.vertexAttribPointer(locR.aWeak,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,rAngBuf.b);  gl.enableVertexAttribArray(locR.aAng);  gl.vertexAttribPointer(locR.aAng,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,rEdgeBuf.b); gl.enableVertexAttribArray(locR.aEdge); gl.vertexAttribPointer(locR.aEdge,1,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,RN);
  }
  function drawMotes(now){
    gl.useProgram(moteP);
    gl.uniform1f(locM.uTime,now); gl.uniform1f(locM.uDpr,dpr); gl.uniform1f(locM.uStreak,streak); gl.uniform1f(locM.uAspect, aspect);
    gl.bindBuffer(gl.ARRAY_BUFFER,mCatBuf.b);  gl.enableVertexAttribArray(locM.aCat);  gl.vertexAttribPointer(locM.aCat,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mAngBuf.b);  gl.enableVertexAttribArray(locM.aAng0); gl.vertexAttribPointer(locM.aAng0,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mRadBuf.b);  gl.enableVertexAttribArray(locM.aRad);  gl.vertexAttribPointer(locM.aRad,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mSpeedBuf.b);gl.enableVertexAttribArray(locM.aSpeed);gl.vertexAttribPointer(locM.aSpeed,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mPhaseBuf.b);gl.enableVertexAttribArray(locM.aPhase);gl.vertexAttribPointer(locM.aPhase,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mSizeBuf.b); gl.enableVertexAttribArray(locM.aSize); gl.vertexAttribPointer(locM.aSize,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,mIntenBuf.b);gl.enableVertexAttribArray(locM.aInten);gl.vertexAttribPointer(locM.aInten,1,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.POINTS,0,MOTES+1);
  }
  function drawQuad(attrLoc){
    gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf.b); gl.enableVertexAttribArray(attrLoc);
    gl.vertexAttribPointer(attrLoc,2,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function drawBlur(src,tw,th,dx,dy){
    gl.useProgram(blurP);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src);
    gl.uniform1i(locBlur.uTex,0); gl.uniform2f(locBlur.uTexel,1/tw,1/th); gl.uniform2f(locBlur.uDir,dx,dy);
    drawQuad(locQ.aPos);
  }
  function drawComposite(){
    gl.useProgram(compP);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,scene.tex); gl.uniform1i(locComp.uScene,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,blurB.tex); gl.uniform1i(locComp.uBloom,1);
    gl.uniform1f(locComp.uStrength,1.25);
    drawQuad(locComp.aPos);
  }

  function frame(){
    try{
      const now=performance.now()/1000;
      if(grow<1){ grow=Math.min(1,(now-growStart)/1.4); }
      gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
      if(bloom){
        gl.bindFramebuffer(gl.FRAMEBUFFER,scene.fbo); gl.viewport(0,0,scene.w,scene.h);
        gl.clearColor(0.027,0.043,0.051,1); gl.clear(gl.COLOR_BUFFER_BIT);
        drawRings(now); drawMotes(now);
        gl.disable(gl.BLEND);
        gl.bindFramebuffer(gl.FRAMEBUFFER,blurA.fbo); gl.viewport(0,0,blurA.w,blurA.h);
        drawBlur(scene.tex, scene.w, scene.h, 1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER,blurB.fbo); gl.viewport(0,0,blurB.w,blurB.h);
        drawBlur(blurA.tex, blurA.w, blurA.h, 0, 1);
        gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
        drawComposite();
      }else{
        gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
        gl.clearColor(0.027,0.043,0.051,1); gl.clear(gl.COLOR_BUFFER_BIT);
        drawRings(now); drawMotes(now);
      }
    }catch(err){
      if(!frame._err){ frame._err=true; fbEl.style.display='flex';
        fbEl.textContent='渲染异常：'+((err&&err.message)||err); }
      return;
    }
    requestAnimationFrame(frame);
  }

  function boot(){
    resize();
    growStart=performance.now()/1000; grow=0;
    updatePanel(); updatePanelDay(-1);
    requestAnimationFrame(frame);
  }
  if(document.readyState==='complete') boot();
  else window.addEventListener('load',boot);
  }

  function run(){
    const gl = acquireGL();
    if(gl){ main(gl); return; }
    if(run._t===undefined) run._t=0;
    if(++run._t<150) requestAnimationFrame(run);
    else fbEl.style.display='flex';
  }
  run();
})();
</script>
</body>
</html>
