<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>层积 · 岩芯时序 — 芙洛理复盘动效概念原型</title>
<style>
  :root{
    --bg:#0e0f12; --txt:#c9cdd4; --muted:#8a8f98; --line:#262a31;
    --amber:#d8a657; --slate:#8a93a0; --terra:#c06a4d; --khaki:#9a8f7a; --weak:#b5564f;
    --tabOn:#d8a657;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;}
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#15171c,#101115);}
  .brand{font-size:15px;letter-spacing:.18em;color:var(--amber);font-weight:600}
  .brand small{color:var(--muted);letter-spacing:.1em;font-weight:400;margin-left:8px;font-size:12px}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tab{font-size:13px;padding:6px 14px;border-radius:2px;color:var(--muted);border:1px solid transparent;cursor:pointer}
  .tab.on{color:#0e0f12;background:var(--tabOn);font-weight:600}
  .tab:hover:not(.on){color:var(--txt);border-color:var(--line)}
  .spacer{flex:1}
  .countdown{font-size:12px;color:var(--muted);letter-spacing:.05em}
  .countdown b{color:var(--amber);font-weight:600;font-size:14px}
  .stage{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  .hint{position:absolute;left:0;right:0;bottom:0;padding:8px 22px;font-size:11.5px;
    color:#5f656e;letter-spacing:.04em;background:linear-gradient(0deg,rgba(14,15,18,.92),rgba(14,15,18,0));pointer-events:none}
  .hint b{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">律 ZHI<small>复盘 · 层积时序</small></div>
    <div class="tabs"><div class="tab on">复盘</div><div class="tab">知识库</div><div class="tab">练考</div></div>
    <div class="spacer"></div>
    <div class="countdown">距国考 <b id="cd">105</b> 天 · 今日已复盘 <b id="st">0</b> 天连续</div>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hint">悬停 <b>看当天数值</b> · 拖动 <b>框选区间→实时聚合读数</b> · 单击 <b>标记今日(+42生长)</b> · 滚轮 <b>平移</b> · Esc <b>清除选区</b></div>
  </div>
</div>
<script>
"use strict";
(function(){
  var canvas=document.getElementById("cv"), ctx=canvas.getContext("2d");
  if(!ctx){document.body.innerHTML="<p style='color:#d8a657;padding:40px'>当前环境不支持 Canvas2D。</p>";return;}

  // ---------- 确定性演示数据 ----------
  var _s=20260816; function rnd(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;}
  var TOTAL=90, N_VIEW=28, FOCUS_MAX=300, THRESH=50;
  var days=[]; var streak=0;
  for(var d=0;d<TOTAL;d++){
    var focus=Math.round(40+rnd()*240);
    if(rnd()<0.16) focus=0;
    var points=rnd()<0.7?Math.round(rnd()*11):0;
    var quiz=Math.round(rnd()*100); if(focus===0) quiz=0;
    var weak=(focus>0 && quiz<THRESH)?1:0;
    if(focus>0) streak++; else streak=0;
    days.push({focus:focus,points:points,quiz:quiz,weak:weak,streakRun:streak});
  }
  var TODAY=TOTAL-1; days[TODAY].focus=Math.max(days[TODAY].focus,99);

  // ---------- 布局 ----------
  var DPR=1,W=0,H=0;
  var pad={left:66,right:26,top:92,bottom:40};
  var plot={x0:0,y0:0,x1:0,y1:0,w:0,h:0};
  var colW=0;
  var displayFocus=[]; for(var i=0;i<TOTAL;i++) displayFocus[i]=days[i].focus;
  var viewStart=TOTAL-N_VIEW;

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    var r=canvas.getBoundingClientRect();
    W=Math.max(2,Math.floor(r.width)); H=Math.max(2,Math.floor(r.height));
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    plot.x0=pad.left; plot.y0=pad.top; plot.x1=W-pad.right; plot.y1=H-pad.bottom;
    plot.w=plot.x1-plot.x0; plot.h=plot.y1-plot.y0;
    colW=plot.w/N_VIEW;
  }
  function yOf(f){ return plot.y1-(f/FOCUS_MAX)*plot.h; }
  function colX(d){ var i=d-viewStart; return plot.x0+(i+0.5)*colW; }
  function dayAtX(px){ var i=Math.floor((px-plot.x0)/colW); return Math.max(0,Math.min(TOTAL-1,viewStart+i)); }

  // ---------- 区间聚合（信息可视化的核心） ----------
  function aggregate(a,b){
    if(a>b){var t=a;a=b;b=t;}
    var mf=0,tp=0,mq=0,n=0,maxRun=0,run=0;
    for(var d=a;d<=b;d++){
      var x=days[d]; if(x.focus>0){mf+=x.focus;mq+=x.quiz;n++;} tp+=x.points;
      if(x.streakRun>0){run++; if(run>maxRun)maxRun=run;} else run=0;
    }
    return {a:a,b:b,meanFocus:n?Math.round(mf/n):0,totalPoints:tp,
            meanQuiz:n?Math.round(mq/n):0,maxStreak:maxRun,days:b-a+1,n:n};
  }

  // ---------- 交互状态 ----------
  var hoverDay=-1, selA=-1, selB=-1, dragging=false, downX=0, downY=0, moved=0, userTouched=false, anchorDay=TODAY;
  function clearSel(){ selA=-1; selB=-1; }

  canvas.addEventListener("pointermove",function(e){
    var r=canvas.getBoundingClientRect(); var px=e.clientX-r.left, py=e.clientY-r.top;
    if(dragging){
      var dx=px-downX; moved=Math.max(moved,Math.abs(dx)+Math.abs(py-downY));
      if(moved>=6){ var d=dayAtX(px); selA=anchorDay; selB=d; }
    } else if(px>=plot.x0&&px<=plot.x1&&py>=plot.y0&&py<=plot.y1){
      hoverDay=dayAtX(px);
    } else hoverDay=-1;
  });
  canvas.addEventListener("pointerdown",function(e){
    userTouched=true; autoDemo=false;
    var r=canvas.getBoundingClientRect(); var px=e.clientX-r.left, py=e.clientY-r.top;
    clearSel();                       // 清除遗留选区，确保本次单击/拖动意图不被旧选区吞掉
    downX=px; downY=py; moved=0; dragging=true; anchorDay=dayAtX(px);
    canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointerup",function(e){
    dragging=false;
    if(moved<6) markToday();          // 单击=标记今日（选区已在 pointerdown 清除）
  });
  canvas.addEventListener("pointerleave",function(){ if(!dragging) hoverDay=-1; });
  canvas.addEventListener("wheel",function(e){
    e.preventDefault();
    viewStart=Math.max(0,Math.min(TOTAL-N_VIEW,viewStart+(e.deltaY>0?2:-2)));
  },{passive:false});
  window.addEventListener("keydown",function(e){ if(e.key==="Escape") clearSel(); });
  function markToday(){
    days[TODAY].focus=Math.min(FOCUS_MAX,days[TODAY].focus+42);
    markPulse=1; streakToday=days[TODAY].streakRun;
    var cd=document.getElementById("st"); if(cd) cd.textContent=streakToday;
  }
  var streakToday=days[TODAY].streakRun, markPulse=0;

  // ---------- 自动演示（被真实操作打断） ----------
  var autoDemo=true, demoT=0, demoHover=-1;
  function autoStep(){
    if(!autoDemo) return; demoT++;
    if(demoT%150===0){ var a=TOTAL-12+Math.floor(rnd()*6); selA=a; selB=a+Math.floor(4+rnd()*5); }
    if(demoT%90===0){ demoHover=TOTAL-1-Math.floor(rnd()*N_VIEW); }
  }

  // ---------- 绘制 ----------
  function drawGrid(){
    ctx.strokeStyle="rgba(38,42,49,0.7)"; ctx.fillStyle="#5f656e";
    ctx.font="11px -apple-system,'PingFang SC',sans-serif"; ctx.textAlign="right"; ctx.textBaseline="middle";
    for(var f=0;f<=FOCUS_MAX;f+=60){
      var y=yOf(f);
      ctx.beginPath(); ctx.moveTo(plot.x0,y+0.5); ctx.lineTo(plot.x1,y+0.5); ctx.stroke();
      ctx.fillText(String(f), plot.x0-8, y);
    }
    ctx.save(); ctx.translate(16,(plot.y0+plot.y1)/2); ctx.rotate(-Math.PI/2);
    ctx.textAlign="center"; ctx.fillStyle="#8a8f98"; ctx.fillText("专注投入（分）",0,0); ctx.restore();
    // X 轴周刻度
    ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillStyle="#5f656e";
    for(var k=0;k<=N_VIEW;k+=7){
      var d=viewStart+k; if(d>=TOTAL) break; var x=plot.x0+(k+0.5)*colW;
      var lab = (d===TODAY)?"今天":((TOTAL-1-d)+"天前");
      ctx.fillText(lab, x, plot.y1+6);
    }
  }

  function drawLegend(){
    var items=[["专注",getCss("--amber")],["正确率",getCss("--slate")],["薄弱日",getCss("--weak")],["连续打卡",getCss("--terra")],["考点",getCss("--khaki")]];
    ctx.font="11px -apple-system,'PingFang SC',sans-serif"; ctx.textBaseline="middle"; ctx.textAlign="left";
    var x=plot.x0, y=plot.y1+22;
    for(var i=0;i<items.length;i++){
      ctx.fillStyle=items[i][1]; ctx.fillRect(x,y-4,8,8);
      ctx.fillStyle="#8a8f98"; ctx.fillText(items[i][0], x+12, y);
      x+=12+ctx.measureText(items[i][0]).width+18;
    }
  }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#888"; }

  function drawKPI(){
    var agg = (selA>=0)? aggregate(selA,selB) : aggregate(viewStart, viewStart+N_VIEW-1);
    var label = (selA>=0)? ("已选 第"+(selA+1)+"–"+(selB+1)+"天（"+agg.days+"天）") : "区间：近 "+N_VIEW+" 天";
    ctx.fillStyle="#15171c"; ctx.fillRect(plot.x0-2,8,plot.w+4,72);
    ctx.strokeStyle="rgba(38,42,49,0.8)"; ctx.beginPath(); ctx.moveTo(plot.x0,82); ctx.lineTo(plot.x1,82); ctx.stroke();
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle="#8a8f98"; ctx.font="12px -apple-system,'PingFang SC',sans-serif";
    ctx.fillText(label, plot.x0, 26);
    var tiles=[["平均专注",agg.meanFocus+" 分",getCss("--amber")],
               ["总考点",agg.totalPoints+" 个",getCss("--khaki")],
               ["平均正确率",agg.meanQuiz+"%",agg.meanQuiz<THRESH?getCss("--weak"):getCss("--slate")],
               ["最长连续",agg.maxStreak+" 天",getCss("--terra")]];
    var tx=plot.x0, ty=46;
    for(var i=0;i<tiles.length;i++){
      ctx.fillStyle="#5f656e"; ctx.font="11px -apple-system,sans-serif"; ctx.fillText(tiles[i][0], tx, ty);
      ctx.fillStyle=tiles[i][2]; ctx.font="20px -apple-system,sans-serif"; ctx.fillText(tiles[i][1], tx, ty+22);
      tx+=Math.max(150, ctx.measureText(tiles[i][1]).width+70);
    }
  }

  function drawBars(){
    // 选区高亮
    if(selA>=0){
      var xa=Math.min(colX(selA),colX(selB)), xb=Math.max(colX(selA),colX(selB));
      ctx.fillStyle="rgba(216,166,87,0.08)"; ctx.fillRect(xa-colW/2,plot.y0,xb-xa+colW,plot.h);
      ctx.strokeStyle="rgba(216,166,87,0.5)"; ctx.strokeRect(xa-colW/2+0.5,plot.y0+0.5,xb-xa+colW-1,plot.h-1);
    }
    var bw=Math.min(colW*0.46,18);
    for(var d=viewStart; d<viewStart+N_VIEW && d<TOTAL; d++){
      var x=colX(d), focus=displayFocus[d], quiz=days[d].quiz, pts=days[d].points;
      var weak=days[d].weak;
      // 专注柱（主读）
      var yf=yOf(focus);
      var grad=ctx.createLinearGradient(0,yf,0,plot.y1);
      grad.addColorStop(0, weak? "rgba(181,86,79,0.95)":"rgba(216,166,87,0.95)");
      grad.addColorStop(1, weak? "rgba(181,86,79,0.55)":"rgba(216,166,87,0.55)");
      ctx.fillStyle=grad; ctx.fillRect(x-bw/2, yf, bw, plot.y1-yf);
      // 岩芯层理（细横纹）
      ctx.strokeStyle="rgba(14,15,18,0.35)"; ctx.lineWidth=1;
      for(var ly=yf+6; ly<plot.y1; ly+=10){ ctx.beginPath(); ctx.moveTo(x-bw/2,ly); ctx.lineTo(x+bw/2,ly); ctx.stroke(); }
      // 正确率细柱（次读）
      var qw=Math.max(3,colW*0.12), qx=x+bw/2+3;
      var yq=yOf(quiz/100*FOCUS_MAX*0.55);
      ctx.fillStyle= weak? "rgba(181,86,79,0.9)":"rgba(138,147,160,0.85)";
      ctx.fillRect(qx, yq, qw, plot.y1-yq);
      // 考点小点簇
      for(var p=0;p<pts;p++){
        var px2=x-bw/2 - 4 - (p%4)*3, py2=plot.y1-6-Math.floor(p/4)*4;
        ctx.fillStyle="rgba(154,143,122,0.9)"; ctx.fillRect(px2,py2,2,2);
      }
      // 悬停高亮
      if(d===hoverDay||d===demoHover){
        ctx.strokeStyle="rgba(216,166,87,0.9)"; ctx.lineWidth=1.5;
        ctx.strokeRect(x-bw/2-2,yOf(FOCUS_MAX*0.55),bw+2+qw+6,plot.y1-yOf(FOCUS_MAX*0.55));
      }
    }
    // 连续打卡基线（terracotta 连接）
    ctx.strokeStyle="rgba(192,106,77,0.7)"; ctx.lineWidth=2;
    var prevX=-1;
    for(var d2=viewStart; d2<viewStart+N_VIEW && d2<TOTAL; d2++){
      if(days[d2].streakRun>0){ var cx=colX(d2); if(prevX>=0){ ctx.beginPath(); ctx.moveTo(prevX,plot.y1+2); ctx.lineTo(cx,plot.y1+2); ctx.stroke(); } prevX=cx; } else prevX=-1;
    }
    // 今日标记
    var tx=colX(TODAY), ty=yOf(displayFocus[TODAY]);
    ctx.fillStyle="#d8a657"; ctx.beginPath(); ctx.arc(tx,ty,3.2+2.5*markPulse,0,Math.PI*2); ctx.fill();
    if(markPulse>0.01){ ctx.strokeStyle="rgba(216,166,87,"+(0.5*markPulse)+")"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(tx,ty,8+10*(1-markPulse),0,Math.PI*2); ctx.stroke(); }
  }

  function drawHover(){
    if((hoverDay<0&&demoHover<0)) return;
    var d=(hoverDay>=0)?hoverDay:demoHover; if(d<0||d>=TOTAL) return;
    var x=colX(d), dd=days[d];
    var lines=["第 "+(d+1)+" 天"+(d===TODAY?"（今天）":""),"专注 "+dd.focus+" 分","考点 "+dd.points+" 个",
               "正确率 "+(dd.focus>0?dd.quiz+"%":"—")+(dd.weak?" ⚠薄弱":""),"连续 "+dd.streakRun+" 天","时政 "+(dd.focus>0?"有":"—")];
    var bw=120,bh=lines.length*16+14,bx=x+14,byy=Math.max(plot.y0,plot.y1-plot.h/2-bh/2);
    if(bx+bw>plot.x1) bx=x-bw-14;
    ctx.fillStyle="rgba(20,22,27,0.94)"; ctx.strokeStyle="rgba(216,166,87,0.5)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.rect(bx,byy,bw,bh); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#c9cdd4"; ctx.font="12px -apple-system,'PingFang SC',sans-serif"; ctx.textBaseline="middle"; ctx.textAlign="left";
    for(var li=0;li<lines.length;li++) ctx.fillText(lines[li],bx+10,byy+12+li*16);
  }

  function frame(){
    try{
      autoStep();
      // 平滑生长动画
      for(var d=0;d<TOTAL;d++){ displayFocus[d]+=(days[d].focus-displayFocus[d])*0.15; }
      markPulse*=0.92;
      ctx.clearRect(0,0,W,H); ctx.fillStyle="#0e0f12"; ctx.fillRect(0,0,W,H);
      drawKPI(); drawGrid(); drawBars(); drawLegend(); drawHover();
      frames++;
    }catch(ex){ err++; if(window.console) console.error(ex); }
    requestAnimationFrame(frame);
  }

  // ---------- 启动 ----------
  var frames=0, err=0;
  function boot(){ resize(); window.addEventListener("resize",resize); requestAnimationFrame(frame); }
  if(document.readyState==="complete"||document.readyState==="interactive") setTimeout(boot,0);
  else window.addEventListener("load",boot);

  // ---------- headless 校验钩子 ----------
  window.__cv=canvas;
  window.__probe=function(){
    var lit=0; try{ var w=Math.min(W,500),h=Math.min(H,400),data=ctx.getImageData(0,0,w,h).data;
      for(var i=0;i<data.length;i+=4){ if(data[i]+data[i+1]+data[i+2]>90) lit++; } }catch(e){ err++; }
    return {frames:frames,lit:lit,today:displayFocus[TODAY],err:err,viewStart:viewStart,streak:streakToday};
  };
  window.__agg=function(a,b){ return aggregate(a,b); }; // 供 headless 验证区间聚合
})();
</script>
</body>
</html>
