<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>素履 · 自律时序 — 芙洛理复盘动效概念原型</title>
<style>
  :root{
    --bg:#0e0f12;
    --ink:#e8e6e0;
    --slate:#5b6270;
    --faint:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12);
    --amber:#d8a657;        /* 今日 / 连续打卡 强调（克制暖琥珀）*/
    --vermilion:#c2705f;    /* 考公 */
    --teal:#5b9b8f;         /* 考研 / 练考达标 */
    --gold:#c9a24a;         /* 事业 */
    --weak:#b06a5e;         /* 练考薄弱 */
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
  #stage{position:fixed;inset:0;display:block;}
  /* 顶部 HUD */
  #hud{position:fixed;top:22px;left:28px;pointer-events:none;}
  #hud .title{font-size:18px;letter-spacing:.32em;font-weight:600;color:var(--ink);}
  #hud .sub{margin-top:6px;font-size:11px;letter-spacing:.14em;color:var(--slate);}
  /* 角落倒计时 / 连续打卡 */
  #metrics{position:fixed;top:22px;right:28px;text-align:right;pointer-events:none;}
  #metrics .m{font-family:var(--mono);font-size:13px;color:var(--slate);margin-bottom:6px;}
  #metrics .m b{color:var(--amber);font-weight:600;}
  /* 右侧详情面板 */
  #panel{
    position:fixed;top:96px;right:28px;width:268px;
    background:rgba(20,22,27,.72);border:1px solid var(--faint);border-radius:10px;
    padding:16px 16px 14px;backdrop-filter:blur(6px);
  }
  #panel .pdate{font-family:var(--mono);font-size:12px;color:var(--slate);letter-spacing:.06em;}
  #panel .ptag{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--faint);}
  #panel .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:13px;}
  #panel .row .k{color:var(--slate);}
  #panel .row .v{font-family:var(--mono);color:var(--ink);}
  #panel .hint{margin-top:14px;font-size:11px;color:var(--slate);line-height:1.6;}
  #markBtn{
    margin-top:14px;width:100%;padding:9px 0;cursor:pointer;
    background:transparent;color:var(--amber);border:1px solid rgba(216,166,87,.4);
    border-radius:8px;font-family:var(--sans);font-size:12px;letter-spacing:.12em;
    transition:background .18s ease,border-color .18s ease;
  }
  #markBtn:hover{background:rgba(216,166,87,.10);border-color:rgba(216,166,87,.7);}
  #markBtn:active{background:rgba(216,166,87,.18);}
  /* 底部操作提示 */
  #foot{position:fixed;left:28px;bottom:20px;font-size:11px;letter-spacing:.1em;color:var(--slate);pointer-events:none;}
  #foot b{color:var(--ink);font-weight:500;}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div class="title">素履</div>
  <div class="sub">自律时序 · 复盘时间轴</div>
</div>

<div id="metrics">
  <div class="m">距国考 <b id="mExam">—</b> 天</div>
  <div class="m">连续打卡 <b id="mStreak">—</b> 天</div>
</div>

<div id="panel">
  <div class="pdate" id="pDate">—</div>
  <span class="ptag" id="pTag">—</span>
  <div class="row"><span class="k">专注时长</span><span class="v" id="pFocus">—</span></div>
  <div class="row"><span class="k">收集考点</span><span class="v" id="pPoints">—</span></div>
  <div class="row"><span class="k">练考正确率</span><span class="v" id="pAcc">—</span></div>
  <div class="hint" id="pHint">悬停某日查看当日复盘；滚轮平移时间窗；点击按钮记入今日复盘。</div>
  <button id="markBtn">标记今日已复盘</button>
</div>

<div id="foot">交互：<b>悬停</b>查看 · <b>滚轮</b>平移 · <b>点击「标记今日」</b>确定式增长</div>

<script>
(function(){
  "use strict";

  /* ---------- 确定性演示数据（芙洛理真实场景映射）---------- */
  // LCG 确定性随机，保证每次打开画面一致、可复现
  let _s = 20260816;
  function rnd(){ _s = (_s*1103515245 + 12345) & 0x7fffffff; return _s/0x7fffffff; }

  const TOTAL = 90;          // 共 90 天数据
  const N_VIEW = 28;         // 视窗展示 28 天
  const FOCUS_REF = 180;     // 专注分钟归一基准
  const THRESH = 12;         // 低于此分钟数视为「休息日」
  const CATS = [
    {name:"考公",   color:"#c2705f"},
    {name:"考研",   color:"#5b9b8f"},
    {name:"事业",   color:"#c9a24a"}
  ];

  const TODAY = new Date(2026,7,16);          // 2026-08-16（与当前时间一致）
  const EXAM  = new Date(2026,10,29);         // 国考 2026-11-29
  const DAY_MS = 86400000;
  const examDays = Math.round((EXAM - TODAY)/DAY_MS);

  const days = [];
  for(let i=0;i<TOTAL;i++){
    const d = new Date(TODAY); d.setDate(TODAY.getDate() - (TOTAL-1-i));
    const isToday = (i===TOTAL-1);
    // 专注：基础 + 随考期临近缓慢上升 + 噪声
    let focus = 40 + i*0.6 + (rnd()*2-1)*48;
    if(rnd() < 0.16) focus = 0;              // 休息日
    focus = Math.max(0, Math.min(FOCUS_REF, focus));
    if(isToday && focus < 60) focus = 96;    // 保证今日有投入
    const weak  = (focus>0) && (rnd() < 0.22);
    const points = focus>0 ? Math.floor(rnd()* (weak?5:11)) : 0;   // F-D5 收集考点
    const acc = focus>0 ? (weak ? 0.44+rnd()*0.18 : 0.70+rnd()*0.27) : null; // 练考正确率
    const cat = i % 3;
    days.push({date:d, focus, weak, points, acc, cat, isToday});
  }

  // 连续打卡（自今日向前）
  function computeStreak(){
    let s=0;
    for(let i=TOTAL-1;i>=0;i--){ if(days[i].focus>THRESH) s++; else break; }
    return s;
  }

  /* ---------- 画布与坐标 ---------- */
  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d");
  let W=0,H=0,DPR=1;
  let plotL=0,plotR=0,plotW=0,baseY=0,maxH=0;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio||1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
    cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const panelW = 320;
    plotL = 40;
    plotR = W - panelW - 40;
    plotW = Math.max(120, plotR - plotL);
    baseY = Math.round(H*0.54);
    maxH  = Math.round(H*0.30);
  }

  /* ---------- 交互状态（全部由真实操作驱动，确定可控）---------- */
  const maxScroll = TOTAL - N_VIEW;
  let scroll = maxScroll;         // 默认展示最近 28 天（今日在右端）
  let scrollTarget = maxScroll;   // 目标滚动量
  let hovered = -1;               // 当前悬停 cell（-1 无）
  const hl = new Float32Array(N_VIEW);   // 每格高亮缓动因子
  let todayBoost = 0;            // 今日额外专注（确定式累加）
  let dispBoost = 0;             // 今日额外专注的缓动显示值
  let pulse = {active:false, t:0};// 克制脉冲（无辉光，仅一圈细线）

  function startIdx(){ return Math.round(scroll); }   // 视窗首格在数据中的索引

  function setHoverFromX(mx,my){
    if(mx<plotL || mx>plotR){ hovered=-1; return; }
    const cellW = plotW / N_VIEW;
    let c = Math.floor((mx-plotL)/cellW);
    if(c<0||c>=N_VIEW){ hovered=-1; return; }
    hovered = c;
  }

  // 今日视窗内 cell（用于高亮/脉冲定位）
  function todayCell(){
    const s = startIdx();
    const idx = TOTAL-1;
    if(idx < s || idx > s+N_VIEW-1) return -1;
    return idx - s;
  }

  function markToday(){
    todayBoost = Math.min(FOCUS_REF*0.9, todayBoost + 42);
    scrollTarget = maxScroll;     // 自动滚回今日（视窗右端），给出明确反馈
    const tc = todayCell();
    if(tc>=0){ pulse.active=true; pulse.t=0; }
  }

  /* ---------- 事件（真实操作）---------- */
  cv.addEventListener("pointermove", e=>{ setHoverFromX(e.clientX,e.clientY); });
  cv.addEventListener("pointerleave", ()=>{ hovered=-1; });
  cv.addEventListener("wheel", e=>{
    e.preventDefault();
    // 向上/右 = 更新（朝今日）；向下/左 = 更旧
    scrollTarget = Math.max(0, Math.min(maxScroll, scrollTarget + (e.deltaY>0?-2:2)));
  }, {passive:false});
  cv.addEventListener("click", e=>{
    setHoverFromX(e.clientX,e.clientY);
    if(hovered===todayCell()) markToday();
  });
  window.addEventListener("keydown", e=>{
    if(e.key==="ArrowRight") scrollTarget=Math.min(maxScroll,scrollTarget+2);   // 更新
    else if(e.key==="ArrowLeft") scrollTarget=Math.max(0,scrollTarget-2);        // 更旧
    else if(e.key===" "){ e.preventDefault(); markToday(); }
  });
  document.getElementById("markBtn").addEventListener("click", markToday);
  window.addEventListener("resize", resize);

  /* ---------- 绘制 ---------- */
  function fmtDate(d){ return (d.getMonth()+1)+"/"+d.getDate(); }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // 背景（极淡径向，非发光，仅区分层次）
    ctx.fillStyle = "#0e0f12";
    ctx.fillRect(0,0,W,H);

    const s = startIdx();
    const cellW = plotW / N_VIEW;

    // 横向辅助网格（极淡）
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.lineWidth = 1;
    for(let k=1;k<=3;k++){
      const y = baseY - maxH*(k/4);
      ctx.beginPath(); ctx.moveTo(plotL,y); ctx.lineTo(plotR,y); ctx.stroke();
    }
    // 基线（履迹）
    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(plotL,baseY); ctx.lineTo(plotR,baseY); ctx.stroke();

    // 连续打卡段（F-D7）：自今日向前的连续活跃日
    const streak = computeStreak();
    const streakFrom = TOTAL - streak;
    ctx.strokeStyle = "rgba(216,166,87,.5)";
    ctx.lineWidth = 2;
    let segStarted=false, segX0=0;
    for(let c=0;c<N_VIEW;c++){
      const di = s+c;
      const inStreak = di>=streakFrom && di<TOTAL;
      const x = plotL + (c+0.5)*cellW;
      if(inStreak){
        if(!segStarted){ segStarted=true; segX0=x; }
      } else if(segStarted){
        ctx.beginPath(); ctx.moveTo(segX0, baseY+6); ctx.lineTo(x, baseY+6); ctx.stroke();
        segStarted=false;
      }
    }
    if(segStarted){
      const xEnd = plotL + (N_VIEW-0.5)*cellW;
      ctx.beginPath(); ctx.moveTo(segX0, baseY+6); ctx.lineTo(xEnd, baseY+6); ctx.stroke();
    }

    // 各日 tick + 考点点 + 练考横杠
    const tops = [];
    for(let c=0;c<N_VIEW;c++){
      const di = s+c;
      const day = days[di];
      const x = plotL + (c+0.5)*cellW;
      const isToday = day.isToday;
      const focus = isToday ? day.focus + dispBoost : day.focus;
      const fn = Math.min(1, focus/FOCUS_REF);
      const topY = baseY - fn*maxH;
      tops.push({x, topY, di, day, focus, fn});

      // 悬停高亮因子
      const h = hl[c];

      // tick 颜色：休息日极淡 / 历史板岩 / 悬停提亮 / 今日琥珀
      let col;
      if(focus<=THRESH) col = "rgba(91,98,112,.28)";
      else if(isToday)  col = "#d8a657";
      else col = "#5b6270";
      if(h>0.01){
        // 悬停：向近白插值
        col = mixHex(col, "#e8e6e0", h*0.85);
      }
      const tw = Math.max(2, cellW*0.16);
      ctx.fillStyle = col;
      ctx.fillRect(x - tw/2, topY, tw, baseY - topY);

      // 考点点（F-D5）：实心小点，普通 alpha（无 additive 辉光）
      if(day.points>0){
        const r = 2 + day.points*0.9 + h*1.5;
        const dy = topY - (r+5) - h*4;        // 悬停轻微抬起
        ctx.beginPath(); ctx.arc(x, dy, r, 0, Math.PI*2);
        ctx.fillStyle = CATS[day.cat].color;
        ctx.fill();
        if(h>0.4){ // 悬停细描边
          ctx.lineWidth=1; ctx.strokeStyle="rgba(232,230,224,"+(h*0.6)+")"; ctx.stroke();
        }
      }

      // 练考正确率横杠（底部）
      if(day.acc!=null){
        const len = day.acc*26;
        const by = baseY + 14;
        ctx.fillStyle = day.acc>=0.6 ? "rgba(91,155,143,.85)" : "rgba(176,106,94,.85)";
        ctx.fillRect(x - len/2, by, len, 3);
      }

      // 悬停竖直引导线
      if(h>0.01){
        ctx.strokeStyle = "rgba(232,230,224,"+(h*0.18)+")";
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x, baseY-maxH-10); ctx.lineTo(x, baseY+24); ctx.stroke();
      }

      // 稀疏日期标签（每 4 格）
      if(c%4===0){
        ctx.fillStyle = "rgba(91,98,112,.7)";
        ctx.font = "10px var(--mono),monospace";
        ctx.textAlign="center";
        ctx.fillText(fmtDate(day.date), x, baseY+40);
      }
    }

    // 趋势折线（履迹走势，细、低透明）
    ctx.strokeStyle = "rgba(232,230,224,.22)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    tops.forEach((t,i)=>{ if(i===0) ctx.moveTo(t.x,t.topY); else ctx.lineTo(t.x,t.topY); });
    ctx.stroke();

    // 今日脉冲（克制：仅一圈细线扩张，无辉光）
    if(pulse.active){
      const tc = todayCell();
      if(tc>=0){
        const x = plotL + (tc+0.5)*cellW;
        const r = 3 + pulse.t*26;
        ctx.strokeStyle = "rgba(216,166,87,"+(1-pulse.t)+")";
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(x, baseY - maxH*0.5, r, 0, Math.PI*2); ctx.stroke();
      }
    }
  }

  function mixHex(a,b,t){
    // 支持 #rrggbb 与 rgba(...) → 简单实现：解析 hex
    const pa = hexToRgb(a), pb = hexToRgb(b);
    if(!pa||!pb) return a;
    const r=Math.round(pa[0]+(pb[0]-pa[0])*t);
    const g=Math.round(pa[1]+(pb[1]-pa[1])*t);
    const bl=Math.round(pa[2]+(pb[2]-pa[2])*t);
    return "rgb("+r+","+g+","+bl+")";
  }
  function hexToRgb(h){
    if(h[0]==="#"){
      const n=parseInt(h.slice(1),16);
      return [(n>>16)&255,(n>>8)&255,n&255];
    }
    return null;
  }

  /* ---------- 面板更新 ---------- */
  const elDate=document.getElementById("pDate");
  const elTag=document.getElementById("pTag");
  const elFocus=document.getElementById("pFocus");
  const elPoints=document.getElementById("pPoints");
  const elAcc=document.getElementById("pAcc");
  const mExam=document.getElementById("mExam");
  const mStreak=document.getElementById("mStreak");
  mExam.textContent = examDays;

  function updatePanel(){
    const s = startIdx();
    let c = hovered;
    if(c<0) c = todayCell();          // 默认聚焦今日
    if(c<0) c = N_VIEW-1;
    const di = s+c;
    const day = days[di];
    const focus = day.isToday ? day.focus+dispBoost : day.focus;
    elDate.textContent = day.date.getFullYear()+"-"+fmtDate(day.date) + (day.isToday?" · 今日":"");
    elTag.textContent = CATS[day.cat].name + (day.focus<=THRESH?" · 休息日":(day.weak?" · 练考薄弱":" · 活跃"));
    elTag.style.color = CATS[day.cat].color;
    elTag.style.borderColor = "rgba(255,255,255,.12)";
    elFocus.textContent = Math.round(focus)+" 分钟";
    elPoints.textContent = day.points+" 个";
    elAcc.textContent = day.acc==null ? "—" : Math.round(day.acc*100)+"%";
    mStreak.textContent = computeStreak();
  }

  /* ---------- 主循环（真实操作驱动；无 idle 动画）---------- */
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05,(now-last)/1000); last=now;
    // 滚动缓动（确定可控）
    scroll += (scrollTarget - scroll) * (1 - Math.pow(0.0008, dt));
    // 高亮缓动
    for(let c=0;c<N_VIEW;c++){
      const tgt = (c===hovered)?1:0;
      hl[c] += (tgt - hl[c]) * (1 - Math.pow(0.0009, dt));
    }
    // 今日增长缓动
    dispBoost += (todayBoost - dispBoost) * (1 - Math.pow(0.00003, dt));
    // 脉冲推进
    if(pulse.active){ pulse.t += dt/0.6; if(pulse.t>=1) pulse.active=false; }

    draw();
    updatePanel();
    requestAnimationFrame(frame);
  }

  /* ---------- 启动（load + rAF 后测尺寸，避免 300×150 默认）---------- */
  function boot(){
    resize();
    // 默认悬停今日（静态聚焦，非动画）
    const tc = todayCell(); hovered = (tc>=0)?tc:-1;
    requestAnimationFrame(frame);
  }
  if(document.readyState==="complete") boot();
  else window.addEventListener("load", boot);
})();
</script>
</body>
</html>
