<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>考点星图 · 知识拓扑 · 动效概念原型</title>
<style>
  :root{
    --bg:#0e1116; --ink:#c9d1d9; --ink-dim:#8b949e; --line:#222a33;
    --accent:#6ee0c4; --panel:rgba(20,26,33,.86); --panel-line:#2a333d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  /* ---- 真实界面 chrome 模仿 ---- */
  .topbar{
    height:46px; display:flex; align-items:center; gap:18px; padding:0 18px;
    border-bottom:1px solid var(--line); background:#10151b;
  }
  .brand{font-weight:700; letter-spacing:1px; color:var(--accent); font-size:15px}
  .tabs{display:flex; gap:4px}
  .tab{
    font-size:13px; color:var(--ink-dim); padding:6px 12px; border-radius:7px;
    cursor:default; transition:color .2s, background .2s;
  }
  .tab.active{color:var(--bg); background:var(--accent); font-weight:600}
  .avatar{
    margin-left:auto; width:26px; height:26px; border-radius:50%;
    background:linear-gradient(135deg,#2f5a57,#6ee0c4); opacity:.85;
  }
  /* ---- KPI 条 ---- */
  .kpi{
    height:46px; display:flex; align-items:center; gap:26px; padding:0 20px;
    border-bottom:1px solid var(--line); background:#0d1218; font-size:12px;
  }
  .kpi .item{display:flex; flex-direction:column; gap:1px}
  .kpi .v{font-size:17px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
  .kpi .v.accent{color:var(--accent)}
  .kpi .l{color:var(--ink-dim); letter-spacing:.5px}
  .kpi .hint{margin-left:auto; color:var(--ink-dim); font-size:11px}
  /* ---- 画布 ---- */
  #stage{position:relative; width:100%; height:calc(100% - 92px)}
  canvas{display:block; width:100%; height:100%}
  /* ---- 悬停面板 ---- */
  #tip{
    position:absolute; pointer-events:none; opacity:0; transform:translateY(4px);
    transition:opacity .12s, transform .12s;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:10px 12px; font-size:12px; min-width:184px; backdrop-filter:blur(6px);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #tip.show{opacity:1; transform:translateY(0)}
  #tip .name{font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px}
  #tip .row{display:flex; justify-content:space-between; gap:14px; color:var(--ink-dim); margin-top:3px}
  #tip .row b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  #tip .stat{margin-top:6px; font-size:11px; padding:2px 7px; border-radius:20px; display:inline-block}
  .s-mastered{background:rgba(110,224,196,.16); color:var(--accent)}
  .s-weak{background:rgba(220,120,120,.16); color:#e08989}
  .s-mid{background:rgba(200,180,110,.16); color:#d8c479}
  /* ---- 图例 ---- */
  #legend{
    position:absolute; left:16px; bottom:14px; font-size:11px; color:var(--ink-dim);
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:10px 12px; line-height:1.9; backdrop-filter:blur(6px);
  }
  #legend .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px}
  #legend .bar{display:inline-block; width:22px; height:0; border-top:2px solid var(--accent); margin-right:6px; vertical-align:4px}
  #legend b{color:var(--ink)}
  /* ---- 演示标记 ---- */
  #auto{
    position:absolute; right:16px; top:14px; font-size:11px; color:var(--accent);
    background:var(--panel); border:1px solid var(--panel-line); border-radius:20px;
    padding:4px 11px; opacity:.85;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">芙洛理</span>
    <div class="tabs">
      <span class="tab">知识库</span>
      <span class="tab">练考</span>
      <span class="tab">复盘</span>
      <span class="tab active">考点星图</span>
    </div>
    <div class="avatar"></div>
  </div>
  <div class="kpi">
    <div class="item"><span class="v" id="k-total">0</span><span class="l">考点总数</span></div>
    <div class="item"><span class="v accent" id="k-mastered">0</span><span class="l">已掌握</span></div>
    <div class="item"><span class="v" id="k-rate">0%</span><span class="l">掌握率</span></div>
    <div class="item"><span class="v" id="k-avg">0%</span><span class="l">平均掌握度</span></div>
    <div class="item"><span class="v" id="k-weak">0</span><span class="l">薄弱考点</span></div>
    <div class="hint">悬停查看 · 左键点「掌握」· 右键「取消」· 拖拽节点/空白平移 · 滚轮缩放</div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="legend">
      <div><span class="dot" style="background:var(--accent)"></span><b>明亮</b> = 已掌握，<b>暗淡</b> = 未掌握</div>
      <div><span class="dot" style="background:#2f5a57;border:1px solid #3a4a55"></span><b>节点大小</b> = 该考点分值权重</div>
      <div><span class="bar"></span><b>连线粗细</b> = 考点间关联强度</div>
    </div>
    <div id="auto">● 自动演示中（移动鼠标即停止）</div>
  </div>

<script>
"use strict";
/* ============ 确定性布局：LCG 种子 ============ */
let _s = 20260816;
function rnd(){ _s = (_s*1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff; }

/* ============ 考点数据（考公/考研 · 数媒艺术） ============ */
const CHAPTERS = [
  {key:"yan",  name:"言语理解"},
  {key:"pan",  name:"判断推理"},
  {key:"num",  name:"数量关系"},
  {key:"data", name:"资料分析"},
  {key:"shen", name:"申论"},
  {key:"chang",name:"常识判断"},
  {key:"major",name:"专业·数媒"},
];
// id, name, chapter, weight(分值权重→半径), mastery(初始掌握度 0~1)
const RAW = [
  ["y1","逻辑填空","yan",8,1.0],   ["y2","片段阅读","yan",9,0.7],  ["y3","语句表达","yan",5,0.45],
  ["p1","图形推理","pan",8,1.0],   ["p2","定义判断","pan",7,0.6],  ["p3","类比推理","pan",6,0.5], ["p4","逻辑判断","pan",8,0.4],
  ["n1","数字推理","num",5,0.55],  ["n2","数学运算","num",9,1.0],
  ["d1","文字资料","data",6,0.65], ["d2","表格资料","data",6,0.6], ["d3","图形资料","data",6,0.5], ["d4","综合资料","data",8,0.35],
  ["s1","归纳概括","shen",7,1.0],  ["s2","综合分析","shen",7,0.6], ["s3","提出对策","shen",6,0.5],
  ["s4","应用文写作","shen",7,0.3],["s5","大作文","shen",10,0.3],
  ["c1","政治常识","chang",7,1.0], ["c2","法律常识","chang",6,0.35],["c3","经济常识","chang",5,0.5],
  ["c4","人文常识","chang",5,0.45],["c5","科技常识","chang",5,0.4],
  ["m1","艺术概论","major",8,0.6], ["m2","中外美术史","major",9,0.3],["m3","设计基础","major",8,0.3],
];
// 关联边：[a,b,strength]
const LINKS = [
  ["y1","y2",.9],["y2","y3",.7],["y1","y3",.6],
  ["p1","p2",.8],["p2","p3",.8],["p3","p4",.8],["p1","p4",.6],
  ["n1","n2",.9],["n2","d4",.5],
  ["d1","d2",.8],["d2","d3",.8],["d3","d4",.9],["d1","d4",.6],
  ["s1","s2",.9],["s2","s3",.8],["s3","s4",.8],["s4","s5",.9],["s1","s5",.6],
  ["c1","c2",.7],["c2","c3",.6],["c3","c4",.6],["c4","c5",.6],["c1","c5",.5],
  ["m1","m2",.9],["m2","m3",.8],["m1","m3",.8],
  // 跨章节弱关联
  ["y1","s1",.4],["y2","s2",.4],["p4","s2",.4],["n2","d4",.4],
  ["c1","s5",.4],["c2","s3",.4],["m3","s4",.4],["m1","s1",.4],
];

/* ============ 构建节点 / 边 ============ */
const nodes = RAW.map((r,i)=>({
  id:r[0], name:r[1], ch:r[2], weight:r[3],
  m0:r[4], m:r[4], dm:r[4],          // 目标/当前/显示 掌握度
  x:0,y:0, hx:0,hy:0, vx:0,vy:0, r:0,
}));
const idIndex = {}; nodes.forEach((n,i)=>idIndex[n.id]=i);
const edges = LINKS.map(l=>({a:idIndex[l[0]], b:idIndex[l[1]], s:l[2]}));

/* ============ 章节中心（环形排布） ============ */
const CW = 1000, CH = 720, cx=CW/2, cy=CH/2;
const ringR = 250;
CHAPTERS.forEach((c,i)=>{
  const a = (i/CHAPTERS.length)*Math.PI*2 - Math.PI/2;
  c.cx = cx + Math.cos(a)*ringR;
  c.cy = cy + Math.sin(a)*ringR;
});

/* ============ 初始撒点 + 力导向收敛（确定性） ============ */
(function layout(){
  // 每章内沿黄金角螺旋撒点
  const perCh = {};
  CHAPTERS.forEach(c=>perCh[c.key]=[]);
  nodes.forEach(n=>perCh[n.ch].push(n));
  const GA = Math.PI*(3-Math.sqrt(5));
  CHAPTERS.forEach(c=>{
    const list = perCh[c.key];
    list.forEach((n,k)=>{
      const rr = 18 + Math.sqrt(k)*26;
      const aa = k*GA;
      n.x = c.cx + Math.cos(aa)*rr + (rnd()-0.5)*8;
      n.y = c.cy + Math.sin(aa)*rr + (rnd()-0.5)*8;
    });
  });
  // 力导向：斥力 + 边弹簧 + 章节引力
  const K_REP=1400, L0=58, K_SPR=0.03, K_GRAV=0.012;
  for(let it=0; it<140; it++){
    const fx=new Array(nodes.length).fill(0), fy=new Array(nodes.length).fill(0);
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        let dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        let d=Math.hypot(dx,dy)||0.01;
        const f=K_REP/(d*d);
        fx[i]+=dx/d*f; fy[i]+=dy/d*f; fx[j]-=dx/d*f; fy[j]-=dy/d*f;
      }
    }
    edges.forEach(e=>{
      const A=nodes[e.a], B=nodes[e.b];
      let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||0.01;
      const f=K_SPR*(d-L0);
      fx[e.a]+=dx/d*f; fy[e.a]+=dy/d*f; fx[e.b]-=dx/d*f; fy[e.b]-=dy/d*f;
    });
    nodes.forEach((n,i)=>{
      const c=CHAPTERS.find(c=>c.key===n.ch);
      fx[i]+=(c.cx-n.x)*K_GRAV; fy[i]+=(c.cy-n.y)*K_GRAV;
      n.x+=fx[i]*0.5; n.y+=fy[i]*0.5;
    });
  }
  nodes.forEach(n=>{
    n.hx=n.x; n.hy=n.y; n.r = 6 + n.weight*1.5;
    n.vx=0; n.vy=0;
  });
})();

/* ============ 画布 / 相机 ============ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const tip = document.getElementById("tip");
const auto = document.getElementById("auto");
let DPR = Math.max(1, window.devicePixelRatio||1);
let cw=0, ch=0;
const cam = {scale:1, ox:0, oy:0};

function resize(){
  const stage = document.getElementById("stage");
  cw = stage.clientWidth; ch = stage.clientHeight;
  DPR = Math.max(1, window.devicePixelRatio||1);
  cv.width = cw*DPR; cv.height = ch*DPR;
  cv.style.width = cw+"px"; cv.style.height = ch+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fit();
}
function bounds(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  nodes.forEach(n=>{minX=Math.min(minX,n.hx);minY=Math.min(minY,n.hy);maxX=Math.max(maxX,n.hx);maxY=Math.max(maxY,n.hy);});
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
}
function fit(){
  const b=bounds();
  const pad=70;
  const s=Math.min((cw-pad*2)/b.w, (ch-pad*2)/b.h);
  cam.scale = s;
  cam.ox = cw/2 - b.cx*s;
  cam.oy = ch/2 - b.cy*s;
}
function w2s(x,y){ return [cam.ox + x*cam.scale, cam.oy + y*cam.scale]; }
function s2w(sx,sy){ return [(sx-cam.ox)/cam.scale, (sy-cam.oy)/cam.scale]; }

/* ============ 交互状态 ============ */
let hoverId=-1, dragId=-1, dragMode=null, panLast=null, autoDemo=true, autoTimer=0;

function nodeAt(sx,sy){
  const [wx,wy]=s2w(sx,sy);
  let best=-1, bestD=1e9;
  nodes.forEach((n,i)=>{
    const d=Math.hypot(wx-n.x, wy-n.y);
    if(d < n.r+6 && d<bestD){bestD=d; best=i;}
  });
  return best;
}

cv.addEventListener("mousemove", e=>{
  const R=cv.getBoundingClientRect();
  const sx=e.clientX-R.left, sy=e.clientY-R.top;
  stopAuto();
  if(dragId>=0){
    const [wx,wy]=s2w(sx,sy);
    if(dragMode==="node"){ nodes[dragId].x=wx; nodes[dragId].y=wy; nodes[dragId].vx=0; nodes[dragId].vy=0; }
    else if(dragMode==="pan"){ cam.ox+=sx-panLast.x; cam.oy+=sy-panLast.y; panLast={x:sx,y:sy}; }
    return;
  }
  hoverId = nodeAt(sx,sy);
  if(hoverId>=0) showTip(hoverId, sx, sy); else tip.classList.remove("show");
});
cv.addEventListener("mousedown", e=>{
  const R=cv.getBoundingClientRect();
  const sx=e.clientX-R.left, sy=e.clientY-R.top;
  stopAuto();
  const id=nodeAt(sx,sy);
  if(id>=0){ dragId=id; dragMode="node"; }
  else { dragMode="pan"; panLast={x:sx,y:sy}; }
});
window.addEventListener("mouseup", e=>{
  if(dragId>=0 && dragMode==="node"){
    // 单击（未拖动）=> 掌握
    const moved = Math.hypot(nodes[dragId].x-nodes[dragId].hx, nodes[dragId].y-nodes[dragId].hy);
    if(moved<3 && !e._dragged){ masterNode(dragId); }
  }
  dragId=-1; dragMode=null;
});
cv.addEventListener("click", e=>{ /* 由 mousedown/up 处理 */ });
cv.addEventListener("contextmenu", e=>{
  e.preventDefault();
  const R=cv.getBoundingClientRect();
  const id=nodeAt(e.clientX-R.left, e.clientY-R.top);
  if(id>=0) unmasterNode(id);
});
cv.addEventListener("wheel", e=>{
  e.preventDefault(); stopAuto();
  const R=cv.getBoundingClientRect();
  const sx=e.clientX-R.left, sy=e.clientY-R.top;
  const [wx,wy]=s2w(sx,sy);
  const f = e.deltaY<0 ? 1.12 : 1/1.12;
  const ns = Math.max(0.45, Math.min(3.2, cam.scale*f));
  cam.scale=ns;
  cam.ox = sx - wx*ns; cam.oy = sy - wy*ns;
},{passive:false});

function masterNode(i){
  const n=nodes[i];
  n.m=1.0;
  // 受控冲量：相邻节点被轻微吸引，随后弹簧归位（确定/收敛）
  edges.forEach(e=>{
    if(e.a===i){ const o=nodes[e.b]; const dx=n.x-o.x, dy=n.y-o.y, d=Math.hypot(dx,dy)||1; o.vx+=dx/d*2.4*e.s; o.vy+=dy/d*2.4*e.s; }
    if(e.b===i){ const o=nodes[e.a]; const dx=n.x-o.x, dy=n.y-o.y, d=Math.hypot(dx,dy)||1; o.vx+=dx/d*2.4*e.s; o.vy+=dy/d*2.4*e.s; }
  });
  updateKPI();
}
function unmasterNode(i){ nodes[i].m = nodes[i].m0; updateKPI(); }

/* ============ 提示面板 ============ */
function showTip(i, sx, sy){
  const n=nodes[i];
  const chp=CHAPTERS.find(c=>c.key===n.ch);
  let stat, cls;
  if(n.m>=0.999){stat="已掌握";cls="s-mastered";}
  else if(n.m<0.4){stat="薄弱";cls="s-weak";}
  else {stat="进行中";cls="s-mid";}
  const deg=Math.round(n.m*100);
  const links=nodes[i]._linkCount||0;
  tip.innerHTML="";
  const nm=document.createElement("div"); nm.className="name"; nm.textContent=n.name; tip.appendChild(nm);
  const rows=[["所属章节",chp.name],["分值权重",String(n.weight)],["掌握度",deg+"%"],["关联考点",String(links)]];
  rows.forEach(r=>{
    const row=document.createElement("div"); row.className="row";
    const a=document.createElement("span"); a.textContent=r[0];
    const b=document.createElement("b"); b.textContent=r[1];
    row.appendChild(a); row.appendChild(b); tip.appendChild(row);
  });
  const st=document.createElement("div"); st.className="stat "+cls; st.textContent=stat; tip.appendChild(st);
  tip.classList.add("show");
  let tx=sx+16, ty=sy+16;
  if(tx+200>cw) tx=sx-200; if(ty+120>ch) ty=sy-120;
  tip.style.left=tx+"px"; tip.style.top=ty+"px";
}
function computeLinkCounts(){
  nodes.forEach(n=>n._linkCount=0);
  edges.forEach(e=>{nodes[e.a]._linkCount++;nodes[e.b]._linkCount++;});
}
computeLinkCounts();

/* ============ KPI ============ */
function updateKPI(){
  const total=nodes.length;
  let mas=0, sum=0, weak=0;
  nodes.forEach(n=>{ if(n.m>=0.999)mas++; sum+=n.m; if(n.m<0.4)weak++; });
  document.getElementById("k-total").textContent=total;
  document.getElementById("k-mastered").textContent=mas;
  document.getElementById("k-rate").textContent=Math.round(mas/total*100)+"%";
  document.getElementById("k-avg").textContent=Math.round(sum/total*100)+"%";
  document.getElementById("k-weak").textContent=weak;
}
updateKPI();

/* ============ 自动演示（无鼠标时循环高亮，便于预览） ============ */
function stopAuto(){ if(autoDemo){ autoDemo=false; auto.style.display="none"; } }
let autoIdx=0;
function autoStep(dt){
  if(!autoDemo) return;
  autoTimer+=dt;
  if(autoTimer>1.4){
    autoTimer=0;
    autoIdx=(autoIdx+1)%nodes.length;
    hoverId=autoIdx;
    const n=nodes[autoIdx], [sx,sy]=w2s(n.x,n.y);
    showTip(autoIdx, sx, sy);
  }
}

/* ============ 渲染循环 ============ */
const DIM=[47,90,87], BRIGHT=[110,224,196];
function lerp(a,b,t){return a+(b-a)*t;}
function nodeColor(m){
  const r=lerp(DIM[0],BRIGHT[0],m)|0, g=lerp(DIM[1],BRIGHT[1],m)|0, b=lerp(DIM[2],BRIGHT[2],m)|0;
  return `rgb(${r},${g},${b})`;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  autoStep(dt);
  // 物理：弹簧回 home + 阻尼
  const K_HOME=0.06, DAMP=0.84;
  nodes.forEach(n=>{
    if(dragId===nodes.indexOf(n) && dragMode==="node"){ /* 拖拽中由事件控制 */ }
    else {
      n.vx += (n.hx-n.x)*K_HOME; n.vy += (n.hy-n.y)*K_HOME;
      n.vx*=DAMP; n.vy*=DAMP;
      n.x+=n.vx; n.y+=n.vy;
    }
    n.dm += (n.m-n.dm)*0.12;
  });

  ctx.clearRect(0,0,cw,ch);
  // 背景微妙渐晕（非加性辉光）
  const g=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.2, cw/2,ch/2,Math.max(cw,ch)*0.75);
  g.addColorStop(0,"#11161d"); g.addColorStop(1,"#0b0e13");
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);

  const hov = hoverId>=0 ? nodes[hoverId] : null;
  const hovSet = new Set();
  if(hov){ edges.forEach(e=>{ if(e.a===hoverId)hovSet.add(e.b); if(e.b===hoverId)hovSet.add(e.a); }); }

  // 章节名（暗）
  ctx.textAlign="center"; ctx.textBaseline="middle";
  CHAPTERS.forEach(c=>{
    const members=nodes.filter(n=>n.ch===c.key);
    let mx=0,my=0; members.forEach(n=>{mx+=n.hx;my+=n.hy;}); mx/=members.length; my/=members.length;
    const [sx,sy]=w2s(mx,my);
    ctx.fillStyle="rgba(139,148,158,.34)"; ctx.font="12px system-ui";
    ctx.fillText(c.name, sx, sy - 64*cam.scale);
  });

  // 边
  ctx.lineCap="round";
  edges.forEach(e=>{
    const A=nodes[e.a], B=nodes[e.b];
    const [ax,ay]=w2s(A.x,A.y), [bx,by]=w2s(B.x,B.y);
    const connected = hoverId>=0 && (e.a===hoverId||e.b===hoverId);
    const w = (0.6 + e.s*1.8) * Math.max(0.6,cam.scale);
    if(connected){
      ctx.strokeStyle=`rgba(150,224,205,${0.45+0.35*e.s})`; ctx.lineWidth=w+0.6;
    } else {
      ctx.strokeStyle=`rgba(120,150,160,${0.08+0.10*e.s})`; ctx.lineWidth=w;
    }
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  });

  // 节点
  nodes.forEach((n,i)=>{
    const [sx,sy]=w2s(n.x,n.y);
    const r = n.r*cam.scale*(1+0.10*n.dm);
    const isHov = i===hoverId;
    const isNeighbor = hovSet.has(i);
    // 描边（明度层次，非辉光）
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle=nodeColor(n.dm); ctx.fill();
    ctx.lineWidth=1.2;
    ctx.strokeStyle = isHov ? "rgba(255,255,255,.85)" : (n.dm>0.95?"rgba(180,240,225,.5)":"rgba(255,255,255,.14)");
    ctx.stroke();
    // 标签：已掌握 / 悬停簇 / 放大时显示
    if(n.dm>0.55 || isHov || isNeighbor || cam.scale>1.25){
      ctx.fillStyle = n.dm>0.55 ? "rgba(201,209,217,.92)" : "rgba(139,148,158,.82)";
      ctx.font = (isHov?"600 ":"") + Math.max(10, 11*cam.scale*0.9).toFixed(0) + "px system-ui";
      ctx.fillText(n.name, sx, sy + r + 10*cam.scale + 2);
    }
  });

  // 掌握脉冲环（受控，非辉光）
  if(hov && hov.dm>0.95){
    const [sx,sy]=w2s(hov.x,hov.y); const r=hov.r*cam.scale*(1+0.10*hov.dm);
    ctx.beginPath(); ctx.arc(sx,sy,r+4,0,Math.PI*2);
    ctx.strokeStyle="rgba(110,224,196,.9)"; ctx.lineWidth=1.4; ctx.stroke();
  }

  requestAnimationFrame(frame);
}
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);

/* ============ 无头验证探针 ============ */
window.__probe = function(){
  let lit=0; try{ const d=ctx.getImageData(0,0,cv.width,cv.height).data; for(let i=0;i<d.length;i+=4){ if(d[i]+d[i+1]+d[i+2]>40) lit++; } }catch(e){}
  return {frames:1, lit, total:nodes.length, mastered:nodes.filter(n=>n.m>=0.999).length, hover:hoverId};
};
window.__master = function(i){ masterNode(i); return nodes[i].m; };
window.__kpi = function(){ return {total:nodes.length, mastered:nodes.filter(n=>n.m>=0.999).length, weak:nodes.filter(n=>n.m<0.4).length}; };
</script>
